  b:{q:'¿Qué devuelve minimize(train_mse)?', c:['Un array con los valores de a, b, c que minimizan el error cuadrático medio en el conjunto de entrenamiento','El menor error cuadrático medio posible','Las tarifas ajustadas del conjunto de entrenamiento','El RMSE en el conjunto de prueba'], e:'minimize devuelve los argumentos que minimizan la función, no el valor mínimo en sí.'},
  c:{q:'El valor ajustado de b es 0.42. Interpreta b en una oración.', a:'Manteniendo fija la distancia (miles), cada minuto adicional de duración se asocia con una tarifa predicha unos $0.42 mayor.',
   p:['Manteniendo fijas las millas (las demás variables)','Por cada minuto adicional','Tarifa predicha unos $0.42 mayor','Usar "se asocia / predicha", no "causa"'], e:'Un coeficiente de regresión múltiple debe leerse "manteniendo fijas las demás variables".'},
  d:{q:'El RMSE es $3.10 en train y $5.80 en test. ¿Qué afirmación es la mejor?', c:['El RMSE de test es la mejor estimación de qué tan bien predecirá el modelo viajes nuevos; la diferencia sugiere que el modelo se ajusta mejor a los datos de entrenamiento que a datos nuevos.','El RMSE de entrenamiento es la mejor estimación del desempeño con viajes nuevos.','Un RMSE de entrenamiento menor demuestra que el modelo es correcto.','Hay que agregar el conjunto de prueba al de entrenamiento antes de calcular el RMSE.'], e:'El modelo no ha visto el conjunto de prueba, así que su error refleja el desempeño con datos nuevos. El error de entrenamiento es optimista.'},
  e:{q:'Para una regresión simple de fare sobre miles, el gráfico de residuos muestra una clara U invertida. ¿Qué sugiere?', c:['La relación entre miles y fare no es lineal, así que una recta no es el mejor modelo.','La recta de regresión es el mejor modelo posible.','La correlación entre miles y fare es negativa.','Los residuos promedian un número positivo.'], e:'Un gráfico de residuos con patrón (curvo) indica una relación no lineal. Los residuos siguen promediando 0 (D es falsa).'},
  f:{q:'Para esa regresión simple de fare sobre miles, marca TODAS las afirmaciones que deben ser verdaderas.', c:['Los residuos promedian 0.','La correlación entre los residuos y miles es 0.','La DE de los residuos es √(1 − r²) × DE de fare.','Todos los viajes con tarifa dinámica tienen residuo positivo.'], e:'Las tres primeras son propiedades algebraicas de la recta de regresión y valen para cualquier diagrama. D no está garantizada.'}}}},

 en:{parts:{

 es:{title:'Encuesta de evaluación del curso', bg:'Un curso grande tiene 1,200 estudiantes. La profesora primero publica una encuesta en línea opcional y responden 240 estudiantes. Luego elige 100 estudiantes uniformemente al azar sin reemplazo y le da seguimiento personal a cada uno hasta que responde. La tabla srs contiene las 100 respuestas aleatorias, con una columna Rating de 1 a 5.',

  b:{q:'¿Qué tipo de muestra es el grupo de 100 estudiantes?', c:['Una muestra aleatoria simple','Una muestra de conveniencia','Un censo','Una muestra con reemplazo'], e:'Sin reemplazo y con la misma probabilidad para todos: una muestra aleatoria simple.'},
  c:{q:'Marca TODOS los que son PARÁMETROS.', c:['La calificación promedio de los 1,200 estudiantes','La calificación promedio de los 100 estudiantes muestreados','La proporción de los 1,200 estudiantes que calificarían el curso con 4 o más','La mediana de los estadísticos bootstrap'], e:'Los números que describen a los 1,200 estudiantes son parámetros; los calculados con una muestra o una simulación son estadísticos.'},
  d:{q:'Completa el código para hacer bootstrap de la PROPORCIÓN de estudiantes que califican el curso con 4 o más.', e:'El promedio de un array booleano es una proporción. Se remuestrea con reemplazo, con el mismo tamaño.'},
  e:{q:'El IC del 95% para la proporción que califica con 4 o más es (0.61, 0.79). El año pasado la proporción fue 0.82. Nula: sigue siendo 0.82. Alternativa: cambió. ¿Conclusión con umbral de 5%?', c:['Rechazar la nula; 0.82 no está en el intervalo.','No rechazar la nula; 0.82 está cerca de 0.79.','Aceptar la alternativa; la satisfacción bajó con certeza exactamente 0.12.','No se puede probar esto con un intervalo de confianza.'], e:'0.82 no está en el intervalo del 95%, así que se rechaza. C es incorrecta por "aceptar" y "con certeza / exactamente".'},

// Translations for the exam-style tables and the new Table-code parts (see cases-tables.js).
function patchTr(id, o) {
  const tr = TR[id];
  Object.entries(o.en || {}).forEach(([l, v]) => tr.en.parts[l] = {...(tr.en.parts[l] || {}), ...v});
  Object.entries(o.es || {}).forEach(([l, v]) => tr.es.parts[l] = {...(tr.es.parts[l] || {}), ...v});
  if (o.cols) tr.es.cols = o.cols;
}

 ['Variable numérica vs categórica','Las numéricas tienen valores en una escala donde la aritmética tiene sentido; las categóricas ubican a los individuos en grupos.','Códigos postales, matrículas y números de sección son números pero categóricos.'],
 ['Gráfico de barras (barh)','Muestra la distribución de una variable categórica (o un valor numérico por categoría). Importa la longitud; el orden y el ancho no.','No uses un histograma para una variable categórica.'],
 ['Histograma (hist)','Muestra la distribución de una variable numérica con intervalos en escala de densidad.','El eje horizontal del histograma es numérico, con intervalos contiguos.'],
 ['Diagrama de dispersión','Muestra la relación entre dos variables numéricas; cada punto es un individuo.','Muestra asociación, no causalidad.'],
 ['Gráfico de líneas (plot)','Muestra cómo cambia una variable numérica a lo largo de una variable ordenada como el tiempo.','Si el eje horizontal no tiene orden (por ejemplo individuos), usa scatter, no plot.'],
 ['Gráficos superpuestos','Varios grupos en los mismos ejes para compararlos (barras superpuestas, histogramas superpuestos, etc.).','Para comparar distribuciones numéricas de dos grupos: tbl.hist(col, group=etiqueta).']],
hist:[
 ['Escala de densidad','En un histograma, el ÁREA de cada barra es el porcentaje de datos del intervalo. El área total es 100%.','¡La altura no es un porcentaje! Altura = porcentaje ÷ ancho del intervalo.'],
 ['Unidades de la altura','Altura = porcentaje del intervalo / ancho, en porcentaje por unidad del eje horizontal.','Con intervalos de distinto ancho, comparar solo alturas no dice cuál tiene más gente.'],
 ['Intervalos (bins)','Cada intervalo incluye su extremo izquierdo y excluye el derecho, salvo el último, que incluye ambos.','Ojo con a qué intervalo pertenece un valor justo en un borde.'],
 ['Leer un histograma','Porcentaje en un rango = suma de (altura × ancho) de los intervalos del rango; conteo = porcentaje × total de individuos.','Si el rango corta un intervalo por la mitad, no se puede calcular exacto sin más información (salvo suponer reparto uniforme).']],
functions:[
 ['def / return','def define una función; return devuelve un valor y termina la función. Sin return, devuelve None.','Una función que imprime en vez de devolver retorna None.'],
 ['Argumentos y nombres locales','Los argumentos se asignan a los parámetros al llamar la función; los nombres asignados dentro son locales.','El orden de los argumentos debe coincidir con los parámetros.'],
 ['apply','tbl.apply(f, etiqueta) llama a f con cada valor de la columna y devuelve un ARRAY con los resultados. Con varias etiquetas, f recibe un argumento por columna.','Se pasa el nombre f, no f(); el segundo argumento es la etiqueta como string. apply devuelve un array, normalmente usado con with_column.']],
groups:[
 ['group(etiqueta)',"Devuelve una Table con una fila por valor distinto de la columna y una columna 'count'.",'El resultado se ordena por los valores del grupo; la columna nueva se llama count.'],
 ['group(etiqueta, f)',"Agrega las OTRAS columnas dentro de cada grupo con f; las etiquetas nuevas son como 'Price average' o 'Price max'.",'Se agregan todas las demás columnas, así que conviene hacer select antes.'],
 ['group([e1, e2])','Agrupa por cada combinación de valores de varias columnas.','group da una tabla "larga"; pivot da una "ancha".'],
 ['pivot(columnas, filas, values, collect)','Crea una tabla de contingencia: una columna por valor distinto de columnas, una fila por valor distinto de filas; las celdas son conteos o collect(values).','Orden de argumentos: primero lo que pasa a columnas, luego lo que pasa a filas.'],
 ['Tabla de contingencia','Una tabla de conteos clasificados según dos variables categóricas.','Todas las celdas suman el número de filas original.'],
 ['join(colA, otra, colB)','Combina las filas de dos tablas cuyos valores coinciden en colA y colB. Las filas sin coincidencia se pierden; el resultado conserva colA.','Las filas sin coincidencia desaparecen; las coincidencias de uno a muchos crean varias filas.']],
iteration:[
 ['if / elif / else','Ejecuta el primer bloque cuya condición es True.','Varios if separados (sin elif) se revisan todos.'],
 ['Bucle for','Repite un bloque una vez por cada elemento de una secuencia.','for i in np.arange(n) se ejecuta n veces.'],
 ['Receta de simulación','1) Decidir qué simular; 2) escribir código que simule un valor; 3) repetir muchas veces, agregando cada valor a un array; 4) visualizar y analizar el array.','np.append(arr, x) debe escribirse arr = np.append(arr, x).'],

probability:[
 ['Probabilidad','Un número entre 0 y 1. Si todos los resultados son igualmente probables, P(A) = (resultados en A) / (todos los resultados).',''],
 ['Regla del complemento','P(A no ocurre) = 1 − P(A).',''],
 ['Regla de multiplicación','P(A y B) = P(A) × P(B dado A).','Solo con eventos independientes se puede multiplicar P(A) × P(B) directamente.'],
 ['Regla de la suma','Cuando un evento puede ocurrir de varias formas que no pueden darse a la vez, se suman las probabilidades de esas formas.','Si las formas se superponen, no se puede sumar sin más.'],
 ['Al menos uno','P(al menos un éxito en n intentos) = 1 − P(ningún éxito) = 1 − (1 − p)^n para intentos independientes.','No escribas n × p.'],
 ['Exactamente k de n','Para intentos independientes con probabilidad p: (número de órdenes) × p^k × (1−p)^(n−k).','Ganar 2 de 3 juegos = 3 × p² × (1−p).']],
sampling:[
 ['Población / muestra','La población es todo el grupo de interés; la muestra es el subconjunto que observamos.',''],
 ['Parámetro / estadístico','Un parámetro resume a toda la población; es fijo pero casi siempre desconocido. Un estadístico resume la muestra que sacaste, así que cambia de una muestra a otra.','Un intervalo de confianza se construye para un parámetro, no para un estadístico.'],
 ['Muestra probabilística / aleatoria simple','En una muestra probabilística puedes calcular la probabilidad de que cualquier grupo concreto de individuos quede en la muestra. Una muestra aleatoria simple elige individuos uno a uno, sin reemplazo, con todos los que quedan igual de probables.','Una muestra probabilística no exige la misma probabilidad para cada individuo.'],
 ['Muestra de conveniencia','Una muestra formada por quien es fácil de alcanzar; no es probabilística y puede tener sesgo.',''],
 ['Distribución de probabilidad vs empírica','La de probabilidad da la probabilidad teórica de cada resultado; la empírica es la distribución observada en datos o en una simulación.',''],
 ['Ley de los promedios (grandes números)','Si repites muchas veces el mismo proceso al azar, de forma independiente, la fracción de veces que ocurre un evento se estabiliza cerca de su probabilidad.','Habla de proporciones, no de que la diferencia en conteos se achique.'],
 ['Distribución empírica de un estadístico','Saca muchas muestras, calcula el estadístico en cada una y grafica los resultados; ese histograma estima cómo varía el estadístico de una muestra a otra.','Cuanto mayor la muestra, más angosta la distribución del estadístico (más concentrada cerca del parámetro).']],
models:[
 ['Modelo','Una descripción del proceso aleatorio que creemos que produjo los datos, lo bastante precisa para simularla.',''],
 ['Estadístico de prueba','Un número calculado con los datos que mide qué tan lejos están de lo que predice la nula; elígelo de modo que un extremo de su rango favorezca claramente a la alternativa.','La dirección debe coincidir con la alternativa: unilateral con estadístico con dirección; bilateral con valor absoluto o TVD.'],
 ['Unilateral vs bilateral','Si la alternativa dice "mayor" (o "menor"), usa un estadístico con dirección. Si solo dice "distinto", usa una distancia como |observado − esperado| o la TVD.','La TVD y el valor absoluto no tienen dirección; úsalos solo con alternativas de "distinto".'],
 ['Distancia de variación total (TVD)','Para dos distribuciones categóricas: la mitad de la suma de las diferencias absolutas entre proporciones correspondientes. 0 significa idénticas.','Es ½ × la suma, no un promedio; compara proporciones, no conteos.'],
 ['Simular bajo el modelo','Generar muchos conjuntos de datos suponiendo que el modelo es cierto y calcular el estadístico en cada uno para ver qué valores son típicos.','Simula con las probabilidades de la nula, no con las proporciones observadas.']],
hyptest:[
 ['Hipótesis nula','Un modelo de azar concreto de cómo saldrían los datos si no pasara nada interesante, lo bastante detallado para simularlo. Bajo él, cualquier patrón que veas es solo variación aleatoria.','La nula debe ser tan concreta que se pueda programar su simulación. Habla de la población o del modelo, no de la muestra.'],
 ['Hipótesis alternativa','Otra visión de cómo se generaron los datos, normalmente que existe algún efecto (en una dirección o simplemente distinto).','La alternativa no necesita poder simularse.'],
 ['Valor p','Supón que el modelo nulo es cierto. El valor p es con qué frecuencia ese modelo produciría un estadístico al menos tan extremo como el de tus datos, contando los extremos en la dirección que apoya la alternativa.','El valor p no es "la probabilidad de que la nula sea cierta" ni "de que la alternativa sea cierta".'],
 ['Umbral del valor p (nivel de significancia)','Un umbral elegido ANTES de ver los datos, normalmente 5% (o 1%). Si p < umbral: se rechaza la nula; los datos favorecen la alternativa. Si no: no se rechaza; los datos son consistentes con la nula.','Nunca digas "aceptar la nula" ni "demostrar la nula", ni que la alternativa quedó "demostrada".'],
 ['Estadísticamente significativo','El valor p está por debajo del umbral. No significa que el efecto sea grande o importante.',''],
 ['Error de tipo I','Concluir en contra de la nula cuando en realidad es correcta. Con un umbral de 5%, una nula verdadera se rechaza por error en cerca del 5% de los estudios (no más).','Al hacer muchas pruebas, algunos resultados "significativos" son solo suerte.'],
 ['Plantilla de conclusión','Rechazamos la hipótesis nula con umbral de 5%; los datos favorecen la alternativa de que… / No rechazamos la nula; los datos son consistentes con el modelo de que…','Formula la conclusión en contexto y di qué umbral usaste.']],
abtest:[
 ['Prueba A/B','Una prueba de si dos grupos de números parecen salir de una misma distribución común.',''],
 ['Nula de una prueba A/B','En la población, la distribución del resultado es la misma en ambos grupos; la diferencia observada se debe al azar (las etiquetas de grupo no importan).','Decir "las dos medias muestrales son iguales" es incorrecto; las medias muestrales obviamente pueden diferir.'],
 ['Prueba de permutación','Bajo la nula las etiquetas son intercambiables: se barajan (sin reemplazo), se recalcula el estadístico y se repite muchas veces.','Se baraja con sample(with_replacement=False); se barajan las ETIQUETAS, no los valores.'],
 ['Estadístico de una prueba A/B','Normalmente la diferencia de medias entre grupos (por ejemplo media de B − media de A), o su valor absoluto si la alternativa es bilateral.','La dirección del estadístico debe coincidir con el cálculo del valor p (>= o <=).'],
 ['Conclusión causal','Si los datos vienen de un experimento controlado aleatorizado y la prueba rechaza la nula, podemos concluir que el tratamiento causó la diferencia.','Con datos observacionales, incluso un resultado significativo solo muestra asociación.']],
bootstrap:[
 ['Para qué sirve el bootstrap','Con una sola muestra, igual queremos saber cuánto cambiaría la estimación con otra muestra. El bootstrap imita esas muestras nuevas sacando de la que tenemos.',''],
 ['Remuestreo bootstrap','Sacar al azar CON reemplazo de la muestra original, tantas veces como el tamaño de la muestra original.','Sacar el mismo tamaño sin reemplazo solo reordena la muestra; el estadístico no cambia.'],
 ['Supuesto clave','Depende de que la muestra sea aleatoria y lo bastante grande para parecer una copia pequeña de la población.',''],
 ['Cuándo falla','Funciona mal para parámetros en los extremos (máximo, mínimo, percentiles muy altos o bajos), muestras originales pequeñas y estadísticos muy influidos por elementos raros.',''],
 ['Centro de la distribución bootstrap','La distribución bootstrap se centra cerca del estadístico de la MUESTRA ORIGINAL, no del parámetro de la población.','El bootstrap no corrige una muestra sesgada.'],
 ['Número de remuestreos','Más remuestreos hacen más estable la distribución bootstrap (y los extremos del percentil), pero no angostan el intervalo ni mejoran la estimación del parámetro.','Para angostar el intervalo, aumenta el tamaño de la muestra ORIGINAL.']],
ci:[
 ['Intervalo de confianza','Un rango de valores plausibles para un parámetro, producido por un método que contiene el valor verdadero en una proporción dada de muestras (por ejemplo 95%).','El "95%" describe el método, no un intervalo en particular.'],
 ['Método de percentiles','Un IC bootstrap del 95% va del percentil 2.5 al 97.5 de los estadísticos bootstrap: percentile(2.5, stats), percentile(97.5, stats).','Un intervalo del 90% usa 5 y 95.'],
 ['Interpretación correcta','Tenemos un 95% de confianza en que el parámetro está entre a y b; si repitiéramos todo el proceso muchas veces, cerca del 95% de los intervalos contendrían el parámetro.','No digas "el parámetro tiene 95% de probabilidad de estar en el intervalo" (el parámetro es fijo), ni "el 95% de los datos/individuos está en el intervalo".'],
 ['Ancho','Mayor nivel de confianza → intervalo más ancho. Muestra original más grande → más angosto (ancho ∝ 1/√n). Más remuestreos bootstrap → el ancho casi no cambia.',''],
 ['IC para pruebas','Nula: parámetro = x; alternativa: parámetro ≠ x. Si x NO está en el IC del 95%, se rechaza la nula con umbral de 5%; si está, no se rechaza. Un IC del 99% corresponde a un umbral de 1%.','Solo para alternativas bilaterales ("distinto de").']],
center:[
 ['Media (promedio)','La suma de los valores dividida entre la cantidad; el punto de equilibrio del histograma.','La media no siempre es uno de los valores ni está siempre "en el medio".'],
 ['Mediana','El percentil 50: la mitad de los valores está en ella o por debajo.',''],
 ['Media vs mediana y sesgo','Si el histograma tiene una cola larga a la derecha, la media queda a la derecha de la mediana; si es simétrico, media ≈ mediana.','Los ingresos y los precios de vivienda suelen estar sesgados a la derecha.'],
 ['Desviación estándar (DE)','Toma la distancia de cada valor a la media, elévala al cuadrado, promedia y saca raíz: sqrt(mean((x − mean)²)). Es aproximadamente la distancia típica a la media.','DE ≥ 0; DE = 0 si todos los valores son iguales; las desviaciones siempre promedian 0.'],
 ['Unidades estándar','z = (valor − promedio) / DE: cuántas DE por encima o por debajo del promedio. Tienen media 0 y DE 1.','z no tiene unidades.'],
 ['Desigualdad de Chebyshev','Sea cual sea la forma de la distribución, al menos 1 − 1/z² de los valores está a menos de z DE de la media (z > 1): al menos 75% a 2 DE, 88.9% a 3, 93.75% a 4.','Es una cota inferior ("al menos") válida para toda distribución; 68/95/99.7 solo vale para la normal.'],
 ['Transformaciones lineales','Sumar c desplaza la media en c y no cambia la DE. Multiplicar por c multiplica la media por c y la DE por |c|.','']],
normal:[
 ['Curva normal','Forma de campana, simétrica. Cerca del 68% del área está a 1 DE de la media, el 95% a 2 DE y el 99.73% a 3 DE.','Solo para distribuciones aproximadamente normales.'],
 ['Teorema Central del Límite','Toma una muestra aleatoria grande con reemplazo. Tenga la forma que tenga la población, la SUMA de la muestra, y por tanto su PROMEDIO, sigue una distribución cercana a la curva normal en forma de campana.','El TCL dice que la distribución de la media muestral es normal, no que la muestra o la población se vuelvan normales.'],
 ['Media del promedio muestral','La distribución del promedio muestral se centra en la media de la población.',''],
 ['DE del promedio muestral','DE del promedio muestral = (DE de la población) / √(tamaño de muestra).','Cuadruplicar la muestra solo divide la DE entre 2.'],
 ['Proporciones como promedios','Una proporción es el promedio de una población 0/1. La DE de una población 0/1 con proporción p de unos es √(p(1 − p)), que es como máximo 0.5.','La DE es máxima cuando p = 0.5.'],
 ['Tamaño de muestra y exactitud','Un IC aproximado del 95% para la media es media muestral ± 2 × DE/√n, así que su ancho es cerca de 4 × DE/√n. Para un ancho ≤ w, hace falta √n ≥ 4 × DE / w.','Depende del tamaño de la muestra, no del de la población (si la población es grande).']],
correlation:[
 ['Coeficiente de correlación r','Pasa x e y a unidades estándar, multiplícalas par a par y promedia los productos. El resultado dice qué tan agrupados están los puntos alrededor de una recta (asociación LINEAL).',''],
 ['Propiedades de r','Entre −1 y 1; sin unidades; no cambia al cambiar unidades ni al intercambiar x e y; r = ±1 significa que los puntos están exactamente sobre una recta.','El tamaño de r no es la pendiente.'],
 ['r = 0','No hay asociación LINEAL. Aun así puede haber una asociación no lineal fuerte (por ejemplo, forma de U).',''],
 ['Precauciones','La correlación se ve afectada por valores atípicos, solo mide asociación lineal y no implica causalidad. Las correlaciones de promedios (ecológicas) pueden parecer engañosamente fuertes.','']],
regression:[
 ['Recta de regresión (unidades estándar)','En unidades estándar, la recta de regresión es: y predicha = r × x.',''],
 ['Pendiente e intercepto (unidades originales)','pendiente = r × DE(y) / DE(x); intercepto = media(y) − pendiente × media(x). La recta pasa por (media x, media y).','La pendiente necesita r, DEx y DEy; el intercepto también necesita las dos medias.'],
 ['Efecto de regresión (a la media)','Si x está k DE por encima del promedio, la y predicha está solo r × k DE por encima (|r| ≤ 1), es decir, más cerca de la media.',''],
 ['Mínimos cuadrados','Ninguna otra recta tiene un error cuadrático medio de predicción (o RMSE) menor que la recta de regresión.','"Mínimo" es solo entre rectas.'],
 ['RMSE','Raíz del error cuadrático medio: np.sqrt(np.mean((real − predicho) ** 2)).',''],
 ['minimize','minimize(f) devuelve los argumentos que minimizan la función f; se usa para hallar la recta de mínimos cuadrados (o coeficientes de regresión no lineal o múltiple).','Se pasa la función misma, no el resultado de llamarla.'],
 ['Regresión múltiple','Predecir y con varias variables: y ≈ a·x1 + b·x2 + c. Un coeficiente es el cambio predicho en y por cada unidad más de esa variable, manteniendo fijas las demás. Se ajusta con el conjunto de entrenamiento y se evalúa con el de prueba.','Ajusta con entrenamiento, evalúa con prueba.'],
 ['Extrapolación','Predecir muy fuera del rango de los valores de x observados no es confiable.','']],
residuals:[
 ['Residuo','Residuo = y observada − y ajustada (predicha).','No inviertas el orden.'],
 ['Gráfico de residuos','Diagrama de dispersión de los residuos contra x (o contra los valores ajustados). Con un buen ajuste lineal parece una nube sin forma centrada en una línea horizontal en 0.',''],
 ['Patrones en los residuos','Un patrón curvo indica relación no lineal; una dispersión vertical desigual (heterocedasticidad) indica que la exactitud de la predicción cambia con x.',''],
 ['Propiedades','Para la recta de regresión: los residuos promedian 0; la correlación entre residuos y x es 0; DE de residuos = √(1 − r²) × DE(y); DE de valores ajustados = |r| × DE(y).','Estas propiedades valen sin importar cómo se vea el diagrama.']],
reginf:[
 ['Modelo de regresión','Hay una recta verdadera desconocida, y cada y observada es la altura de esa recta en x más un error aleatorio independiente centrado en 0 (normal): señal más ruido.','La recta de regresión de la muestra estima la "recta verdadera".'],
 ['Bootstrap de la pendiente','Remuestrear las FILAS (pares) del diagrama con reemplazo, ajustar una recta cada vez y usar el 95% central de las pendientes como IC para la pendiente verdadera.','Se remuestrean filas completas, no x e y por separado.'],
 ['Probar pendiente = 0','Nula: la pendiente verdadera es 0 (no hay asociación lineal). Si 0 no está en el IC de la pendiente verdadera, se rechaza la nula.',''],
 ['Intervalo de predicción','Hacer bootstrap de la predicción en un x dado; el intervalo es para la altura de la recta VERDADERA en x. Es más angosto cerca de la media de x y más ancho lejos de ella.','El intervalo es para la altura de la recta verdadera en x, no para la y de un individuo.']],
classification:[
 ['Clasificador','Una función que predice una etiqueta categórica para un individuo a partir de sus atributos (variables).','Predecir un número es regresión; predecir una categoría es clasificación.'],
 ['k vecinos más cercanos','Encontrar los k puntos de entrenamiento más cercanos al nuevo (distancia euclidiana) y predecir la etiqueta más común entre ellos (voto por mayoría).','Con dos clases usa k impar para evitar empates. Si k = tamaño del entrenamiento, siempre predice la clase mayoritaria.'],
 ['Distancia euclidiana','Distancia entre puntos = raíz de la suma de los cuadrados de las diferencias en cada atributo: np.sqrt(sum((p1 − p2) ** 2)).','Las variables en escalas distintas deben pasarse a unidades estándar, o la de mayor escala domina.'],
 ['Conjunto de entrenamiento / prueba','Se ajusta (o se buscan vecinos) con el de entrenamiento; la exactitud se estima con un conjunto de prueba aparte que el clasificador no ha visto.','Evaluar con el de entrenamiento sobreestima la exactitud (1-NN da 100% en entrenamiento).'],
 ['Exactitud','Proporción de individuos de prueba cuya etiqueta predicha coincide con la verdadera.',''],
 ['Sobreajuste','Un clasificador que sigue demasiado a los datos de entrenamiento (por ejemplo, k muy pequeño) puede no generalizar a datos nuevos.',''],
 ['Regresión k-NN','Predecir un valor numérico como el promedio de los valores de los k vecinos más cercanos en lugar de un voto por mayoría.','Solo cambia el "voto" por un "promedio".']],
bayes:[
 ['A priori (prior)','La probabilidad de una clase o hipótesis antes de ver la evidencia nueva (a menudo la tasa base en la población).',''],
 ['Verosimilitud (likelihood)','La probabilidad de la evidencia observada DADA una clase, por ejemplo P(prueba positiva | enfermedad).','P(B|A) y P(A|B) no son lo mismo.'],
 ['Posterior','La probabilidad actualizada de la clase dada la evidencia: P(A | B) = P(A) × P(B | A) / P(B).',''],
 ['Probabilidad total de la evidencia','P(B) = P(A) P(B|A) + P(no A) P(B|no A): sumar todas las ramas del árbol que llevan a B.',''],
 ['Falacia de la tasa base','Ignorar una a priori pequeña: incluso una prueba exacta puede dar sobre todo falsos positivos si la condición es rara.',''],
 ['Clasificador "más probable que no"','Predecir la clase cuya probabilidad posterior es mayor que 0.5 (la posterior más grande).','Cambiar la a priori puede cambiar la conclusión.']],

const pct = (x, d = 1) => fmt(x * 100, d) + '%';
const L3 = (zh, en, es) => LANG === 'zh' ? zh : LANG === 'es' ? es : en;   // explanations
const S2 = (en, es) => LANG === 'es' ? es : en;                            // stems and choices (zh mode uses English, like the exam)
function numMC(correct, distractors, show = v => v) {
  const seen = new Set([show(correct)]); const opts = [show(correct)];
  for (const d of distractors) { const s = show(d); if (!seen.has(s) && opts.length < 5) { seen.add(s); opts.push(s); } }
  return {c: opts, a: 0};
}
function makeGen(g, seed) {
  const keep = R.rand; R.rand = mulberry(seed);
  try { return g.make(); } finally { R.rand = keep; }
}

const GENS = [
{id:'g-hist', t:['hist'], d:2, make() {
  const w = R.pick([2, 5, 10]); const start = R.pick([0, 10, 20]);
  const h1 = R.pick([1, 2, 3, 4]) / (w === 10 ? 2 : 1), h2 = R.pick([1, 2, 3]) / (w === 10 ? 2 : 1);
  const w2 = w * 2, p1 = h1 * w, p2 = h2 * w2, tot = p1 + p2;
  const [unit, u1] = R.pick([['minutes', 'minute', 'minutos', 'minuto'], ['dollars', 'dollar', 'dólares', 'dólar'], ['inches', 'inch', 'pulgadas', 'pulgada']].map(x => LANG === 'es' ? [x[2], x[3]] : [x[0], x[1]]));
  const m = numMC(tot, [h1 + h2, p1, p2, tot / 2, h1 * w2 + h2 * w], v => fmt(v, 1) + '%');
  return {k:'mc', ...m,
    q: S2(`A histogram of a variable measured in ${unit} has a bin [${start}, ${start + w}) with height ${fmt(h1)} percent per ${u1} and the next bin [${start + w}, ${start + w + w2}) with height ${fmt(h2)} percent per ${u1}. What percent of the data are in [${start}, ${start + w + w2})?`,
      `Un histograma de una variable medida en ${unit} tiene un intervalo [${start}, ${start + w}) con altura ${fmt(h1)} por ciento por ${u1} y el siguiente intervalo [${start + w}, ${start + w + w2}) con altura ${fmt(h2)} por ciento por ${u1}. ¿Qué porcentaje de los datos está en [${start}, ${start + w + w2})?`),
    e: L3(`面积 = 百分比。第一个 bin：${fmt(h1)} × ${w} = ${fmt(p1, 1)}%；第二个 bin 宽度是 ${w2}：${fmt(h2)} × ${w2} = ${fmt(p2, 1)}%。合计 ${fmt(tot, 1)}%。常见错误是把高度直接相加（${fmt(h1 + h2)}），或忘了两个 bin 宽度不同。`,
      `Area is percent. First bin: ${fmt(h1)} × ${w} = ${fmt(p1, 1)}%. The second bin is ${w2} wide: ${fmt(h2)} × ${w2} = ${fmt(p2, 1)}%. Total ${fmt(tot, 1)}%. Common mistakes: adding the heights (${fmt(h1 + h2)}) or forgetting that the bins have different widths.`,
      `El área es el porcentaje. Primer intervalo: ${fmt(h1)} × ${w} = ${fmt(p1, 1)}%. El segundo mide ${w2}: ${fmt(h2)} × ${w2} = ${fmt(p2, 1)}%. Total ${fmt(tot, 1)}%. Errores comunes: sumar las alturas (${fmt(h1 + h2)}) u olvidar que los anchos son distintos.`)};
}},
{id:'g-hist-height', t:['hist'], d:1, make() {
  const n = R.pick([200, 400, 500]); const w = R.pick([4, 5, 10]); const cnt = R.pick([20, 40, 50, 80, 100]);
  const p = cnt / n * 100, h = p / w; const u = S2(' % per year', ' % por año');
  const m = numMC(h, [p, cnt / w, h * 10, p * w], v => fmt(v, 2) + u);
  return {k:'mc', ...m,
    q: S2(`${n} people's ages are shown in a density-scale histogram. ${cnt} of them are in the bin [30, ${30 + w}). What is the height of that bar?`,
      `Las edades de ${n} personas se muestran en un histograma en escala de densidad. ${cnt} de ellas están en el intervalo [30, ${30 + w}). ¿Cuál es la altura de esa barra?`),
    e: L3(`占比 = ${cnt}/${n} = ${fmt(p, 2)}%。高度 = 占比 / 宽度 = ${fmt(p, 2)} / ${w} = ${fmt(h, 2)} % per year。`,
      `Percent in the bin = ${cnt}/${n} = ${fmt(p, 2)}%. Height = percent / width = ${fmt(p, 2)} / ${w} = ${fmt(h, 2)} percent per year.`,
      `Porcentaje en el intervalo = ${cnt}/${n} = ${fmt(p, 2)}%. Altura = porcentaje / ancho = ${fmt(p, 2)} / ${w} = ${fmt(h, 2)} % por año.`)};
}},
{id:'g-cheb', t:['center'], d:2, make() {
  const z = R.pick([2, 2.5, 3, 4, 5]); const mean = R.pick([50, 60, 72, 100, 140]); const sd = R.pick([4, 5, 8, 10, 12]);
  const ans = 1 - 1 / (z * z);
  const normal = {2:0.95, 2.5:0.9876, 3:0.9973, 4:0.9999, 5:0.9999}[z];
  const m = numMC(ans, [1 / (z * z), 1 - 1 / z, normal, 0.68, ans === 0.75 ? 0.5 : 0.75], v => pct(v, 2));
  m.c.push(S2('Not enough information', 'Not enough information (no hay suficiente información)'));
  const lo = fmt(mean - z * sd), hi = fmt(mean + z * sd);
  return {k:'mc', ...m,
    q: S2(`A list of numbers has average ${mean} and SD ${sd}. Nothing is known about the shape of its distribution. What is the smallest possible percent of the numbers between ${lo} and ${hi}?`,
      `Una lista de números tiene promedio ${mean} y DE ${sd}. No se sabe nada de la forma de su distribución. ¿Cuál es el menor porcentaje posible de números entre ${lo} y ${hi}?`),
    e: L3(`区间是平均 ± ${z} 个 SD（(${hi} − ${mean}) / ${sd} = ${z}）。分布形状未知 → Chebyshev：至少 1 − 1/${z}² = ${pct(ans, 2)}。正态分布的数字（如 95%）在这里不能用。`,
      `The interval is the average ± ${z} SDs ((${hi} − ${mean}) / ${sd} = ${z}). The shape is unknown, so use Chebyshev: at least 1 − 1/${z}² = ${pct(ans, 2)}. Normal-curve numbers such as 95% do not apply here.`,
      `El intervalo es el promedio ± ${z} DE ((${hi} − ${mean}) / ${sd} = ${z}). La forma es desconocida, así que se usa Chebyshev: al menos 1 − 1/${z}² = ${pct(ans, 2)}. Los valores de la curva normal (como 95%) no aplican aquí.`)};
}},
{id:'g-su', t:['center'], d:1, make() {
  const mean = R.pick([60, 70, 75, 160, 20]); const sd = R.pick([4, 5, 8, 10]); const z = R.pick([-2, -1.5, -0.5, 0.5, 1.25, 1.5, 2.5]);
  const x = mean + z * sd;
  const m = numMC(z, [-z, z * sd, x - mean, x / sd, z / 10], v => fmt(v, 2));
  return {k:'mc', ...m, q: S2(`The average is ${mean} and the SD is ${sd}. What is ${fmt(x)} in standard units?`, `El promedio es ${mean} y la DE es ${sd}. ¿Cuánto es ${fmt(x)} en unidades estándar?`),
    e: L3(`z = (${fmt(x)} − ${mean}) / ${sd} = ${fmt(z)}。`, `z = (${fmt(x)} − ${mean}) / ${sd} = ${fmt(z)}.`, `z = (${fmt(x)} − ${mean}) / ${sd} = ${fmt(z)}.`)};
}},
{id:'g-sdmean', t:['normal'], d:2, make() {
  const sd = R.pick([12, 15, 20, 30, 40]); const n = R.pick([16, 25, 36, 64, 100, 144, 400]);
  const ans = sd / Math.sqrt(n);
  const m = numMC(ans, [sd / n, sd, sd * Math.sqrt(n), sd / Math.sqrt(n / 4)], v => fmt(v, 3));
  return {k:'mc', ...m, q: S2(`A population has SD ${sd}. For random samples of size ${n} drawn with replacement, what is the SD of the sample average?`, `Una población tiene DE ${sd}. Para muestras aleatorias de tamaño ${n} con reemplazo, ¿cuál es la DE del promedio muestral?`),
    e: L3(`SD of sample average = 总体 SD / √n = ${sd} / √${n} = ${sd} / ${Math.sqrt(n)} = ${fmt(ans, 3)}。`, `SD of the sample average = population SD / √n = ${sd} / √${n} = ${sd} / ${Math.sqrt(n)} = ${fmt(ans, 3)}.`, `DE del promedio muestral = DE de la población / √n = ${sd} / √${n} = ${sd} / ${Math.sqrt(n)} = ${fmt(ans, 3)}.`)};
}},
{id:'g-samplesize', t:['normal','ci'], d:3, make() {
  const w = R.pick([0.01, 0.02, 0.04, 0.05, 0.1]); const n = Math.pow(4 * 0.5 / w, 2);
  const m = numMC(n, [Math.pow(2 * 0.5 / w, 2), 4 * 0.5 / w, Math.pow(0.5 / w, 2), n * 4], v => Math.round(v).toLocaleString('en-US'));
  const N = Math.round(n).toLocaleString('en-US');
  return {k:'mc', ...m,
    q: S2(`A pollster wants a 95% confidence interval for the proportion of voters supporting a measure, with total WIDTH at most ${w}. Using the upper bound 0.5 for the SD of a 0/1 population, what is the smallest sample size that guarantees this?`,
      `Una encuestadora quiere un intervalo de confianza del 95% para la proporción de votantes que apoyan una medida, con ANCHO total de a lo sumo ${w}. Usando la cota 0.5 para la DE de una población 0/1, ¿cuál es el menor tamaño de muestra que lo garantiza?`),
    e: L3(`95% CI 宽度 ≈ 4 × SD / √n ≤ ${w} → √n ≥ 4 × 0.5 / ${w} = ${fmt(4 * 0.5 / w)} → n ≥ ${N}。注意是“总宽度”（两边各 2 个 SD），不是半宽。`,
      `Width of a 95% CI ≈ 4 × SD / √n ≤ ${w} → √n ≥ 4 × 0.5 / ${w} = ${fmt(4 * 0.5 / w)} → n ≥ ${N}. This is the total width (2 SDs on each side), not the half-width.`,
      `Ancho del IC del 95% ≈ 4 × DE / √n ≤ ${w} → √n ≥ 4 × 0.5 / ${w} = ${fmt(4 * 0.5 / w)} → n ≥ ${N}. Es el ancho total (2 DE a cada lado), no la mitad.`)};
}},
{id:'g-ciwidth', t:['ci','normal'], d:2, make() {
  const W = R.pick([2, 3, 4, 6, 8]); const k = R.pick([2, 3, 4]); const n = R.pick([50, 100, 200]);
  const ans = W / k;
  const m = numMC(ans, [W / (k * k), W * k, W, W / Math.sqrt(k)], v => fmt(v, 3));
  return {k:'mc', ...m,
    q: S2(`A 95% CI for a population mean, built from a random sample of ${n}, has width ${W}. About how wide would the 95% CI be with a sample of ${n * k * k} from the same population?`,
      `Un IC del 95% para la media poblacional, construido con una muestra aleatoria de ${n}, tiene ancho ${W}. ¿Qué ancho tendría aproximadamente el IC del 95% con una muestra de ${n * k * k} de la misma población?`),
    e: L3(`宽度 ∝ 1/√n。样本量变成 ${k * k} 倍，√${k * k} = ${k}，宽度变成 1/${k}：${W} / ${k} = ${fmt(ans, 3)}。`,
      `Width ∝ 1/√n. The sample is ${k * k} times larger and √${k * k} = ${k}, so the width becomes 1/${k} as large: ${W} / ${k} = ${fmt(ans, 3)}.`,
      `Ancho ∝ 1/√n. La muestra es ${k * k} veces mayor y √${k * k} = ${k}, así que el ancho se divide entre ${k}: ${W} / ${k} = ${fmt(ans, 3)}.`)};
}},
{id:'g-regpred', t:['regression'], d:2, make() {
  const r = R.pick([0.4, 0.5, 0.6, 0.75, -0.5, -0.6]); const mx = R.pick([60, 70, 100]); const sx = R.pick([5, 10, 20]);
  const my = R.pick([50, 80, 200]); const sy = R.pick([4, 8, 12, 30]); const zx = R.pick([-2, -1, 1, 1.5, 2]);
  const x = mx + zx * sx; const pred = my + r * zx * sy;
  const m = numMC(pred, [my + zx * sy, my + r * zx * sx, my - r * zx * sy, my + zx * sy / r], v => fmt(v, 2));
  return {k:'mc', ...m,
    q: S2(`For a set of individuals, x has average ${mx} and SD ${sx}; y has average ${my} and SD ${sy}; r = ${r}. Using the regression line, what is the predicted y for an individual with x = ${fmt(x)}?`,
      `En un grupo de individuos, x tiene promedio ${mx} y DE ${sx}; y tiene promedio ${my} y DE ${sy}; r = ${r}. Con la recta de regresión, ¿cuál es la y predicha para alguien con x = ${fmt(x)}?`),
    e: L3(`先转标准单位：x_su = (${fmt(x)} − ${mx}) / ${sx} = ${zx}。预测 y_su = r × x_su = ${r} × ${zx} = ${fmt(r * zx)}。换回原单位：${my} + ${fmt(r * zx)} × ${sy} = ${fmt(pred)}。注意预测值比 x 更靠近平均（regression to the mean）。`,
      `Convert to standard units: x_su = (${fmt(x)} − ${mx}) / ${sx} = ${zx}. Predicted y_su = r × x_su = ${r} × ${zx} = ${fmt(r * zx)}. Back to original units: ${my} + ${fmt(r * zx)} × ${sy} = ${fmt(pred)}. The prediction is closer to average than x is (regression to the mean).`,
      `En unidades estándar: x_su = (${fmt(x)} − ${mx}) / ${sx} = ${zx}. y_su predicha = r × x_su = ${r} × ${zx} = ${fmt(r * zx)}. En unidades originales: ${my} + ${fmt(r * zx)} × ${sy} = ${fmt(pred)}. La predicción está más cerca del promedio que x (regresión a la media).`)};
}},
{id:'g-slope', t:['regression'], d:2, make() {
  const r = R.pick([0.3, 0.5, 0.6, 0.8, -0.4]); const sx = R.pick([2, 4, 5, 10]); const sy = R.pick([6, 8, 10, 15, 20]);
  const mx = R.pick([10, 20, 30]); const my = R.pick([50, 100, 120]);
  const slope = r * sy / sx; const icpt = my - slope * mx;
  const given = S2(`r = ${r}, SD of x = ${sx}, SD of y = ${sy}, mean of x = ${mx}, mean of y = ${my}.`, `r = ${r}, DE de x = ${sx}, DE de y = ${sy}, media de x = ${mx}, media de y = ${my}.`);
  if (R.pick(['slope', 'intercept']) === 'slope') {
    const m = numMC(slope, [r * sx / sy, r, sy / sx, r * sy], v => fmt(v, 3));
    return {k:'mc', ...m, q: given + S2(' What is the slope of the regression line in original units?', ' ¿Cuál es la pendiente de la recta de regresión en unidades originales?'),
      e: L3(`slope = r × SD(y) / SD(x) = ${r} × ${sy} / ${sx} = ${fmt(slope, 3)}。平均数不影响斜率。`, `slope = r × SD(y) / SD(x) = ${r} × ${sy} / ${sx} = ${fmt(slope, 3)}. The means do not affect the slope.`, `pendiente = r × DE(y) / DE(x) = ${r} × ${sy} / ${sx} = ${fmt(slope, 3)}. Las medias no afectan la pendiente.`)};
  }
  const m = numMC(icpt, [my - r * mx, my + slope * mx, mx - slope * my, my - (r * sx / sy) * mx], v => fmt(v, 2));
  return {k:'mc', ...m, q: given + S2(' What is the intercept of the regression line in original units?', ' ¿Cuál es el intercepto de la recta de regresión en unidades originales?'),
    e: L3(`slope = ${r} × ${sy}/${sx} = ${fmt(slope, 3)}；intercept = mean(y) − slope × mean(x) = ${my} − ${fmt(slope, 3)} × ${mx} = ${fmt(icpt)}。`,
      `slope = ${r} × ${sy}/${sx} = ${fmt(slope, 3)}; intercept = mean(y) − slope × mean(x) = ${my} − ${fmt(slope, 3)} × ${mx} = ${fmt(icpt)}.`,
      `pendiente = ${r} × ${sy}/${sx} = ${fmt(slope, 3)}; intercepto = media(y) − pendiente × media(x) = ${my} − ${fmt(slope, 3)} × ${mx} = ${fmt(icpt)}.`)};
}},
{id:'g-residsd', t:['residuals'], d:2, make() {
  const [r, s] = R.pick([[0.6, 0.8], [0.8, 0.6], [0.28, 0.96], [-0.6, 0.8], [-0.8, 0.6], [0.96, 0.28]]); const sy = R.pick([5, 10, 15, 20, 25]);
  const ans = s * sy, fit = Math.abs(r) * sy;
  const pre = S2(`The correlation between x and y is ${r} and the SD of y is ${sy}.`, `La correlación entre x e y es ${r} y la DE de y es ${sy}.`);
  if (R.pick(['resid', 'fitted']) === 'resid') {
    const m = numMC(ans, [fit, (1 - r * r) * sy, sy, (1 - Math.abs(r)) * sy], v => fmt(v, 2));
    return {k:'mc', ...m, q: pre + S2(' What is the SD of the residuals from the regression line?', ' ¿Cuál es la DE de los residuos de la recta de regresión?'),
      e: L3(`SD of residuals = √(1 − r²) × SD(y) = √(1 − ${fmt(r * r, 4)}) × ${sy} = ${s} × ${sy} = ${fmt(ans)}。`, `SD of residuals = √(1 − r²) × SD(y) = √(1 − ${fmt(r * r, 4)}) × ${sy} = ${s} × ${sy} = ${fmt(ans)}.`, `DE de los residuos = √(1 − r²) × DE(y) = √(1 − ${fmt(r * r, 4)}) × ${sy} = ${s} × ${sy} = ${fmt(ans)}.`)};
  }
  const m = numMC(fit, [ans, r * r * sy, sy, -fit], v => fmt(v, 2));
  return {k:'mc', ...m, q: pre + S2(' What is the SD of the fitted (predicted) values from the regression line?', ' ¿Cuál es la DE de los valores ajustados (predichos) de la recta de regresión?'),
    e: L3(`SD of fitted values = |r| × SD(y) = ${Math.abs(r)} × ${sy} = ${fmt(fit)}。（SD 不会是负数，所以要取绝对值。）`, `SD of fitted values = |r| × SD(y) = ${Math.abs(r)} × ${sy} = ${fmt(fit)}. An SD is never negative, so use |r|.`, `DE de los valores ajustados = |r| × DE(y) = ${Math.abs(r)} × ${sy} = ${fmt(fit)}. Una DE nunca es negativa, por eso se usa |r|.`)};
}},
{id:'g-tvd', t:['models'], d:2, make() {
  const parts = () => { const a = R.int(2, 12), b = R.int(2, 20 - a - 2); return [a, b, 20 - a - b].map(v => v * 0.05); };
  let p = parts(), q = parts(); while (p.join() === q.join()) q = parts();
  const tvd = p.reduce((s, v, i) => s + Math.abs(v - q[i]), 0) / 2, sum = tvd * 2;
  const m = numMC(tvd, [sum, sum / 3, Math.max(...p.map((v, i) => Math.abs(v - q[i]))), p.reduce((s, v, i) => s + (v - q[i]), 0)], v => fmt(v, 3));
  const show = arr => arr.map(v => fmt(v, 2)).join(', '); const diffs = p.map((v, i) => fmt(Math.abs(v - q[i]), 2)).join(' + ');
  return {k:'mc', ...m, q: S2(`Two categorical distributions over the same three categories are (${show(p)}) and (${show(q)}). What is the total variation distance (TVD) between them?`, `Dos distribuciones categóricas sobre las mismas tres categorías son (${show(p)}) y (${show(q)}). ¿Cuál es la distancia de variación total (TVD) entre ellas?`),
    e: L3(`TVD = ½ × Σ|差|。各项差的绝对值：${diffs} = ${fmt(sum, 3)}，乘 ½ 得 ${fmt(tvd, 3)}。不带绝对值求和永远是 0。`, `TVD = ½ × Σ|differences|. Absolute differences: ${diffs} = ${fmt(sum, 3)}; half of that is ${fmt(tvd, 3)}. Without absolute values the sum is always 0.`, `TVD = ½ × Σ|diferencias|. Diferencias absolutas: ${diffs} = ${fmt(sum, 3)}; la mitad es ${fmt(tvd, 3)}. Sin valor absoluto la suma siempre es 0.`)};
}},
{id:'g-atleast', t:['probability'], d:2, make() {
  const p = R.pick([0.1, 0.2, 0.25, 0.3, 0.05]); const n = R.pick([3, 4, 5, 6]);
  const ans = 1 - Math.pow(1 - p, n);
  const m = numMC(ans, [n * p, Math.pow(p, n), 1 - Math.pow(p, n), Math.pow(1 - p, n)], v => fmt(v, 4));
  return {k:'mc', ...m, q: S2(`Each day, independently, the chance that a bus is late is ${p}. What is the chance the bus is late on at least one of ${n} days?`, `Cada día, de forma independiente, la probabilidad de que un autobús llegue tarde es ${p}. ¿Cuál es la probabilidad de que llegue tarde al menos uno de ${n} días?`),
    e: L3(`1 − P(一次都不迟到) = 1 − (1 − ${p})^${n} = 1 − ${fmt(Math.pow(1 - p, n), 4)} = ${fmt(ans, 4)}。直接写 ${n} × ${p} 是错的：这些事件不互斥。`,
      `1 − P(never late) = 1 − (1 − ${p})^${n} = 1 − ${fmt(Math.pow(1 - p, n), 4)} = ${fmt(ans, 4)}. ${n} × ${p} is wrong because the events are not mutually exclusive.`,
      `1 − P(nunca tarde) = 1 − (1 − ${p})^${n} = 1 − ${fmt(Math.pow(1 - p, n), 4)} = ${fmt(ans, 4)}. ${n} × ${p} es incorrecto porque los eventos no son mutuamente excluyentes.`)};
}},
{id:'g-bayes', t:['bayes'], d:3, make() {
  const prior = R.pick([0.01, 0.02, 0.05, 0.1]); const sens = R.pick([0.9, 0.95, 0.99]); const fpr = R.pick([0.05, 0.1, 0.2]);
  const num = prior * sens, den = num + (1 - prior) * fpr, post = num / den;
  const m = numMC(post, [sens, 1 - fpr, num, prior], v => fmt(v, 3));
  return {k:'mc', ...m,
    q: S2(`${pct(prior, 0)} of laptops in a batch are defective. A diagnostic flags ${pct(sens, 0)} of defective laptops and ${pct(fpr, 0)} of working laptops. A randomly chosen laptop is flagged. What is the chance it is defective?`,
      `El ${pct(prior, 0)} de las laptops de un lote están defectuosas. Un diagnóstico marca el ${pct(sens, 0)} de las defectuosas y el ${pct(fpr, 0)} de las que funcionan. Una laptop elegida al azar sale marcada. ¿Cuál es la probabilidad de que esté defectuosa?`),
    e: L3(`树形图：缺陷且被标记 = ${prior} × ${sens} = ${fmt(num, 4)}；正常但被标记 = ${fmt(1 - prior, 2)} × ${fpr} = ${fmt((1 - prior) * fpr, 4)}。posterior = ${fmt(num, 4)} / ${fmt(den, 4)} ≈ ${fmt(post, 3)}。先验很小时，阳性里很多是假阳性（base rate）。`,
      `Tree diagram: defective and flagged = ${prior} × ${sens} = ${fmt(num, 4)}; working but flagged = ${fmt(1 - prior, 2)} × ${fpr} = ${fmt((1 - prior) * fpr, 4)}. Posterior = ${fmt(num, 4)} / ${fmt(den, 4)} ≈ ${fmt(post, 3)}. When the prior is small, many flags are false positives (base rate).`,
      `Diagrama de árbol: defectuosa y marcada = ${prior} × ${sens} = ${fmt(num, 4)}; funciona pero marcada = ${fmt(1 - prior, 2)} × ${fpr} = ${fmt((1 - prior) * fpr, 4)}. Posterior = ${fmt(num, 4)} / ${fmt(den, 4)} ≈ ${fmt(post, 3)}. Con un prior pequeño, muchas marcas son falsos positivos (tasa base).`)};
}},
{id:'g-pval', t:['hyptest'], d:2, make() {
  const sims = 10000; const k = R.pick([12, 30, 80, 150, 240, 420, 700, 1100]); const p = k / sims; const cut = R.pick([0.05, 0.01]);
  const rej = p < cut, P = fmt(p, 4), C = cut * 100;
  const opts = LANG === 'es' ? [`p ≈ ${P}; rechazar la hipótesis nula al umbral de ${C}%`, `p ≈ ${P}; no rechazar la hipótesis nula al umbral de ${C}%`, `p ≈ ${fmt(1 - p, 4)}; rechazar la hipótesis nula al umbral de ${C}%`, `p ≈ ${P}; aceptar la hipótesis nula`]
    : [`p ≈ ${P}; reject the null hypothesis at the ${C}% cutoff`, `p ≈ ${P}; fail to reject the null hypothesis at the ${C}% cutoff`, `p ≈ ${fmt(1 - p, 4)}; reject the null hypothesis at the ${C}% cutoff`, `p ≈ ${P}; accept the null hypothesis`];
  return {k:'mc', c:opts, a: rej ? 0 : 1, fixed:true,
    q: S2(`Under the null hypothesis, a test statistic was simulated 10,000 times. ${k} of the simulated values were greater than or equal to the observed statistic, and large values favor the alternative. Which is correct?`,
      `Bajo la hipótesis nula, un estadístico de prueba se simuló 10,000 veces. ${k} de los valores simulados fueron mayores o iguales que el observado, y los valores grandes favorecen la alternativa. ¿Qué es correcto?`),
    e: L3(`p 值 = ${k} / ${sims} = ${P}。${rej ? `${P} < ${cut} → reject the null，数据更支持备择。` : `${P} ≥ ${cut} → fail to reject the null，数据与零假设一致。`} 永远不说 “accept the null”。`,
      `p-value = ${k} / ${sims} = ${P}. ${rej ? `${P} < ${cut}, so reject the null; the data favor the alternative.` : `${P} ≥ ${cut}, so fail to reject the null; the data are consistent with the null.`} Never say "accept the null".`,
      `valor p = ${k} / ${sims} = ${P}. ${rej ? `${P} < ${cut}: se rechaza la nula; los datos favorecen la alternativa.` : `${P} ≥ ${cut}: no se rechaza la nula; los datos son consistentes con la nula.`} Nunca se dice "aceptar la nula".`)};
}},
{id:'g-citest', t:['ci','hyptest'], d:2, make() {
  const lo = R.int(20, 60); const hi = lo + R.int(3, 10); const level = R.pick([95, 99]);
  const inside = R.rand() < 0.5; const v = inside ? R.int(lo + 1, hi - 1) : R.pick([lo - R.int(1, 4), hi + R.int(1, 4)]);
  const cut = 100 - level;
  const c = LANG === 'es' ? [`Rechazar la nula al umbral de ${cut}%`, `No rechazar la nula al umbral de ${cut}%`, `Aceptar la nula al umbral de ${cut}%`, 'Un IC no sirve para probar una hipótesis']
    : [`Reject the null at the ${cut}% cutoff`, `Fail to reject the null at the ${cut}% cutoff`, `Accept the null at the ${cut}% cutoff`, 'A CI cannot be used to test a hypothesis'];
  return {k:'mc', c, a: inside ? 1 : 0, fixed:true,
    q: S2(`A ${level}% bootstrap confidence interval for a population mean is (${lo}, ${hi}). Null: the population mean is ${v}. Alternative: it is not ${v}. What is the conclusion?`,
      `Un intervalo de confianza bootstrap del ${level}% para la media poblacional es (${lo}, ${hi}). Nula: la media es ${v}. Alternativa: no es ${v}. ¿Cuál es la conclusión?`),
    e: L3(`${level}% 置信区间对应 ${cut}% 的 p-value cutoff（双侧）。${v} ${inside ? '在' : '不在'}区间 (${lo}, ${hi}) 里 → ${inside ? 'fail to reject the null' : 'reject the null'}。`,
      `A ${level}% CI matches a ${cut}% p-value cutoff (two-sided). ${v} is ${inside ? 'inside' : 'outside'} (${lo}, ${hi}), so ${inside ? 'fail to reject' : 'reject'} the null.`,
      `Un IC del ${level}% corresponde a un umbral de ${cut}% (bilateral). ${v} está ${inside ? 'dentro de' : 'fuera de'} (${lo}, ${hi}), así que ${inside ? 'no se rechaza' : 'se rechaza'} la nula.`)};
}},
{id:'g-knn', t:['classification'], d:1, make() {
  const labels = Array.from({length: 9}, () => R.pick(['Spam', 'Ham']));
  const k = R.pick([1, 3, 5, 7, 9]);
  const top = labels.slice(0, k); const s = top.filter(x => x === 'Spam').length;
  const pred = s > k - s ? 'Spam' : 'Ham';
  return {k:'mc', c:['Spam', 'Ham'], a: pred === 'Spam' ? 0 : 1, fixed:true,
    q: S2(`The 9 training emails closest to a new email, from nearest to farthest, are labeled: ${labels.join(', ')}. What does a ${k}-nearest-neighbor classifier predict?`, `Los 9 correos de entrenamiento más cercanos a uno nuevo, del más cercano al más lejano, tienen etiquetas: ${labels.join(', ')}. ¿Qué predice un clasificador de ${k} vecinos más cercanos?`),
    e: L3(`取最近的 ${k} 个：${top.join(', ')}。Spam ${s} 票，Ham ${k - s} 票 → 预测 ${pred}。`, `Take the nearest ${k}: ${top.join(', ')}. Spam has ${s} votes and Ham has ${k - s}, so the prediction is ${pred}.`, `Se toman los ${k} más cercanos: ${top.join(', ')}. Spam tiene ${s} votos y Ham ${k - s}, así que la predicción es ${pred}.`)};
}},
{id:'g-normalpct', t:['normal'], d:2, make() {
  const mean = R.pick([100, 500, 70]); const sd = R.pick([10, 15, 100, 5]);
  const cases = [
    {lab: S2(`above ${mean + 2 * sd}`, `por encima de ${mean + 2 * sd}`), v:0.025, e: L3('±2 SD 内约 95%，剩下 5% 平分到两边，上面约 2.5%。', 'About 95% is within ±2 SDs; the other 5% splits evenly, so about 2.5% is above.', 'Cerca del 95% está a ±2 DE; el 5% restante se reparte en dos colas, así que arriba queda cerca del 2.5%.')},
    {lab: S2(`below ${mean - sd}`, `por debajo de ${mean - sd}`), v:0.16, e: L3('±1 SD 内约 68%，剩下 32% 平分，下面约 16%。', 'About 68% is within ±1 SD; the other 32% splits evenly, so about 16% is below.', 'Cerca del 68% está a ±1 DE; el 32% restante se reparte, así que abajo queda cerca del 16%.')},
    {lab: S2(`between ${mean - sd} and ${mean + 2 * sd}`, `entre ${mean - sd} y ${mean + 2 * sd}`), v:0.815, e: L3('平均到 −1 SD 约 34%，平均到 +2 SD 约 47.5%，合计约 81.5%。', 'From −1 SD to the mean is about 34%, and from the mean to +2 SDs about 47.5%; together about 81.5%.', 'De −1 DE a la media hay cerca del 34%, y de la media a +2 DE cerca del 47.5%; en total cerca del 81.5%.')},
    {lab: S2(`above ${mean}`, `por encima de ${mean}`), v:0.5, e: L3('正态分布对称，平均数以上约 50%。', 'The normal curve is symmetric, so about 50% is above the mean.', 'La curva normal es simétrica, así que cerca del 50% está por encima de la media.')},
  ];
  const c = R.pick(cases);
  const m = numMC(c.v, [0.05, 0.32, 0.68, 0.95, 0.025, 0.16, 0.815, 0.5].filter(x => x !== c.v), v => pct(v, 1));
  return {k:'mc', ...m, q: S2(`Scores are roughly normally distributed with mean ${mean} and SD ${sd}. About what percent of scores are ${c.lab}?`, `Los puntajes siguen aproximadamente una distribución normal con media ${mean} y DE ${sd}. ¿Qué porcentaje aproximado de puntajes está ${c.lab}?`),
    e: L3('标准化后用 68–95–99.7 规则。', 'Convert to standard units and use the 68–95–99.7 rule. ', 'Pasa a unidades estándar y usa la regla 68–95–99.7. ') + c.e};
}},
];

// ---------- state & storage ----------
const $ = s => document.querySelector(s);
const TOPIC = Object.fromEntries(TOPICS.map(t => [t.id, t]));
const KIND = {mc:{zh:'单选', en:'Multiple choice'}, multi:{zh:'多选', en:'Select all'}, tf:{zh:'判断', en:'True / False'}, short:{zh:'简答', en:'Short answer'}, code:{zh:'代码填空', en:'Code'}, case:{zh:'大题', en:'Case study'}};
const PTS = {mc:2, multi:3, tf:2, short:4, code:4};
const WEAK = ['hyptest', 'ci', 'bootstrap', 'abtest'];
const store = {
  get(k, d) { try { const v = localStorage.getItem('c8lab:' + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem('c8lab:' + k, JSON.stringify(v)); } catch {} },
};
const storedCases = store.get('cases', 1);
const S = {
  topics: new Set(store.get('topics', ['hyptest', 'ci', 'bootstrap'])),
  count: store.get('count', 10),
  caseOn: store.get('caseOn', storedCases > 0),
  cases: Math.max(1, storedCases || 1),
  kinds: new Set(store.get('kinds', ['mc', 'multi', 'tf', 'short', 'code']).filter(k => PTS[k])),
  diff: store.get('diff', 'mixed'),
  mode: store.get('mode', 'practice'),
  src: 'bank',
  exam: [], title: {key: 'tPracticeOne'},
  submitted: false, startedAt: 0, timer: null,
  sample: null, aiCtl: null,
};
const nCases = () => S.caseOn ? S.cases : 0;
const saveSettings = () => { store.set('topics', [...S.topics]); store.set('count', S.count); store.set('cases', S.cases); store.set('caseOn', S.caseOn); store.set('kinds', [...S.kinds]); store.set('diff', S.diff); store.set('mode', S.mode); };

// ---------- text helpers ----------
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'}[c]));
const rich = s => esc(s).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>').replace(/\n/g, '<br>');
const LETTERS = 'ABCDEFGH';
const ANCHOR = /^(none of|all of|not enough|cannot be|neither|ninguna de|no hay suficiente)/i;
const ptsOf = q => q.k === 'case' ? q.parts.reduce((s, p) => s + ptsOf(p), 0) : (q.pts || PTS[q.k] || 2);
const getQ = key => { const [i, j] = String(key).split('-').map(Number); return j == null || isNaN(j) ? S.exam[i] : S.exam[i].parts[j]; };
const units = () => S.exam.flatMap((q, i) => q.k === 'case' ? q.parts.map((p, j) => ({q: p, key: `${i}-${j}`, parent: q})) : [{q, key: String(i)}]);
const unitScore = q => q.k === 'short' ? q.self : q.res?.score;
const examTitle = () => t(S.title.key, S.title.vars) + (S.title.suffix || '');

// ---------- preparing questions (localize, then shuffle choices; both are repeatable) ----------
function shuffleChoices(q, ord) {
  if (q.k === 'case') {
    const parts = q.parts.map((p, j) => shuffleChoices({...p, t: p.t || q.t}, ord?.parts?.[j]));
    return {...q, parts, _order: {parts: parts.map(p => p._order)}};
  }
  if (!(q.k === 'mc' || q.k === 'multi') || q.fixed) return {...q, _order: null};
  let order = ord;
  if (!order) {
    const idx = q.c.map((_, i) => i);
    const free = idx.filter(i => !ANCHOR.test(q.c[i])), tail = idx.filter(i => ANCHOR.test(q.c[i]));
    order = R.shuffle(free).concat(tail);
  }
  const c = order.map(i => q.c[i]);
  const a = q.k === 'mc' ? order.indexOf(q.a) : q.a.map(x => order.indexOf(x)).sort((x, y) => x - y);
  return {...q, c, a, _order: order};
}
// src is a bank question, a case, an AI question, or {genId, seed, id, t, d} for a random template.
function baseOf(src) {
  if (src.genId) { const g = GENS.find(x => x.id === src.genId); return {...makeGen(g, src.seed), id: src.id, t: g.t, d: g.d, gen: true}; }
  return loc(src);
}
function prep(src) { const q = shuffleChoices(baseOf(src)); q._src = src; return q; }
function relocal(q) {
  const n = shuffleChoices(baseOf(q._src), q._order); n._src = q._src;
  const carry = (from, to) => { to.res = from.res; to.self = from.self; to.ai = from.ai; };
  if (n.k === 'case') n.parts.forEach((p, j) => carry(q.parts[j], p)); else carry(q, n);
  return n;
}

// ---------- building an exam from the bank ----------
function poolFor(topics, kinds, diff) {
  const okD = q => diff === 'mixed' || (diff === 'exam' ? q.d >= 2 : q.d >= 3);
  const statics = BANK.filter(q => q.t.some(t => topics.has(t)) && kinds.has(q.k) && okD(q));
  const gens = kinds.has('mc') ? GENS.filter(g => g.t.some(t => topics.has(t)) && (diff !== 'hard' || g.d >= 2)) : [];
  const cases = CASES.filter(c => c.t.some(t => topics.has(t)));
  return {statics, gens, cases};
}

function buildSingles() {
  const {statics, gens} = poolFor(S.topics, S.kinds, S.diff);
  const seen = new Set(store.get('seen', []));
  const byTopic = new Map([...S.topics].map(t => [t, []]));
  const rank = q => (seen.has(q.id) ? 1 : 0) + Math.random() * 0.9 - (q.t.filter(t => S.topics.has(t)).length > 1 ? 0.3 : 0);
  for (const q of statics.slice().sort((a, b) => rank(a) - rank(b))) byTopic.get(R.shuffle(q.t.filter(t => S.topics.has(t)))[0]).push(q);
  for (const g of gens) {
    const list = byTopic.get(R.shuffle(g.t.filter(t => S.topics.has(t)))[0]);
    const mk = () => ({genId: g.id, seed: Math.floor(Math.random() * 2 ** 31), id: g.id + '-' + Math.random().toString(36).slice(2, 7), t: g.t, d: g.d});
    list.splice(Math.min(list.length, 1 + Math.floor(Math.random() * 3)), 0, mk());
    list.push(mk());
  }
  const out = [], used = new Set(), topicOrder = R.shuffle([...S.topics]);
  let guard = 0;
  while (out.length < S.count && guard++ < 500) {
    let progressed = false;
    for (const tp of topicOrder) {
      if (out.length >= S.count) break;
      const list = byTopic.get(tp);
      while (list.length) {
        const src = list.shift();
        if (used.has(src.id)) continue;
        used.add(src.id); out.push(prep(src)); progressed = true; break;
      }
    }
    if (!progressed) break;
  }
  const pos = id => TOPICS.findIndex(x => x.id === id);
  out.sort((a, b) => Math.min(...a.t.map(pos)) - Math.min(...b.t.map(pos)));
  return out;
}

// A "True or False" block like the ones that open recent finals: 8 statements, 2 points each.
function tfBlock(exclude) {
  const pool = BANK.filter(q => q.k === 'tf' && q.t.some(x => S.topics.has(x)) && !exclude.has(q.id));
  if (pool.length < 6) return null;
  const parts = R.shuffle(pool).slice(0, 8).map((q, j) => ({...q, l: 'abcdefgh'[j], pts: 2}));
  return {id: 'tfb-' + Math.random().toString(36).slice(2, 7), k: 'case', d: 2, title: 'True or False', t: [...new Set(parts.flatMap(p => p.t))],
    bg: 'For each statement below, choose True or False. Each part is worth 2 points.', bgzh: '判断以下每个说法的对错，每小题 2 分。', parts};
}

function buildCases(n, singles) {
  if (!n) return [];
  const seen = new Set(store.get('seen', []));
  const overlap = c => c.t.filter(x => S.topics.has(x)).length / c.t.length;
  const ranked = poolFor(S.topics, S.kinds, S.diff).cases
    .map(c => ({c, r: (seen.has(c.id) ? 1 : 0) + Math.random() * 0.6 - overlap(c)}))
    .sort((a, b) => a.r - b.r).map(x => x.c);
  const out = ranked.slice(0, n).map(prep);
  if (out.length < n) { const b = tfBlock(new Set(singles.map(q => q.id))); if (b) out.unshift(prep(b)); }
  return out;
}

function buildExam() {
  const singles = buildSingles();
  const all = [...singles, ...buildCases(nCases(), singles)];
  store.set('seen', [...new Set([...all.map(q => q.id), ...store.get('seen', [])])].slice(0, 400));
  return all;
}

// ---------- rendering ----------
function renderExam(keep) {
  if (!keep) { S.submitted = false; units().forEach(({q}) => { q.res = null; q.self = null; q.ai = null; }); }
  $('#paperTitle').textContent = examTitle();
  const singles = S.exam.filter(q => q.k !== 'case'), cases = S.exam.filter(q => q.k === 'case');
  const total = S.exam.reduce((s, q) => s + ptsOf(q), 0);
  const kinds = {}; singles.forEach(q => kinds[q.k] = (kinds[q.k] || 0) + 1);
  const topicNames = [...new Set(units().flatMap(u => u.q.t || u.parent.t))].filter(x => TOPIC[x]).map(topicName);
  $('#paperMeta').innerHTML = `<span>${t('metaN', {n: S.exam.length, p: total})}</span><span>${Object.entries(kinds).map(([k, n]) => `${kindShort(k)} ${n}`).join(' · ')}${cases.length ? ' · ' + t('metaCases', {n: cases.length}) : ''}</span><span>${t(S.mode === 'exam' ? 'metaExam' : 'metaPractice')}</span><span id="clock"></span>` +
    `<span style="flex-basis:100%">${esc(topicNames.join(' · '))}</span>`;
  $('#questions').innerHTML = S.exam.length ? S.exam.map((q, i) => q.k === 'case' ? renderCase(q, i) : renderQ(q, i)).join('') : `<div class="empty">${t('empty')}</div>`;
  $('#submitBar').hidden = !S.exam.length;
  if (!keep) { $('#results').hidden = true; $('#results').innerHTML = ''; }
  $('#submitBtn').textContent = t(S.mode === 'exam' ? 'submit' : 'gradeAll');
  if (!keep) {
    clearInterval(S.timer); S.startedAt = Date.now();
    const tick = () => { const s = Math.floor((Date.now() - S.startedAt) / 1000); const c = $('#clock'); if (c) c.textContent = `⏱ ${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`; };
    tick(); S.timer = setInterval(tick, 1000);
  }
  updateAnswered();
}

function bodyHTML(q, key) {
  if (q.k === 'mc' || q.k === 'multi' || q.k === 'tf') {
    const c = q.k === 'tf' ? [t('T'), t('F')] : q.c;
    const type = q.k === 'multi' ? 'checkbox' : 'radio';
    return `<div class="opts" role="${q.k === 'multi' ? 'group' : 'radiogroup'}">` + c.map((txt, j) =>
      `<label class="opt" data-j="${j}"><input type="${type}" name="q${key}" id="q${key}o${j}" value="${j}"><span class="bub ${q.k === 'multi' ? 's' : 'c'}">${LETTERS[j]}</span><span class="txt">${rich(txt)}</span></label>`).join('') + `</div>`;
  }
  if (q.k === 'code') return `<div class="blanks">` + q.blanks.map((b, j) => `<div class="blank"><label for="q${key}b${j}">${b.l === 'output' ? 'output' : '[' + esc(b.l) + ']'}</label><input id="q${key}b${j}" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="${esc(b.l === 'output' ? t('phOut') : t('phBlank', {l: b.l}))}"></div>`).join('') + `</div>`;
  return `<textarea id="q${key}t" placeholder="${esc(t('phText'))}"></textarea>`;
}
const actionsHTML = key => `<div class="q-actions">${S.mode === 'practice' ? `<button class="ghost" data-check="${key}">${t('check')}</button>` : ''}<span class="verdict" id="v${key}"></span></div><div id="ex${key}"></div>`;
const topicTags = ts => ts.filter(x => TOPIC[x]).map(x => `<span class="tag">${esc(LANG === 'zh' ? TOPIC[x].zh : topicName(x))}</span>`).join('');

function renderQ(q, i) {
  const d = '●'.repeat(q.d || 2) + '○'.repeat(3 - (q.d || 2));
  return `<article class="q" id="qcard${i}" data-i="${i}">
    <div class="q-head"><span class="q-num">${i + 1}.</span><span class="tag kind">${esc(kindName(q.k))}</span><span class="tag pts">${ptsOf(q)} pts</span>${q.fromAI ? `<span class="tag ai">${t('tagAI')}</span>` : ''}${q.gen ? `<span class="tag">${t('tagRand')}</span>` : ''}${topicTags(q.t)}<span class="diff" title="difficulty">${d}</span></div>
    <div class="stem">${rich(q.q)}</div>
    ${q.code ? `<pre class="code">${esc(q.code)}</pre>` : ''}
    ${bodyHTML(q, String(i))}
    ${actionsHTML(String(i))}
  </article>`;
}

function renderCase(q, i) {
  const tbls = q.tables || (q.table ? [q.table] : []);
  const table = tbls.map(tb => `<div class="tbl">${tb.name ? `<div class="tname"><code>${esc(tb.name)}.show(${tb.rows.length})</code></div>` : ''}<table><thead><tr>${tb.cols.map(c => `<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>${tb.rows.map(r => `<tr>${r.map(v => `<td>${esc(v)}</td>`).join('')}</tr>`).join('')}</tbody></table>${tb.more ? `<div class="more">${t('rowsOmitted', {n: Number(tb.more).toLocaleString('en-US')})}</div>` : ''}</div>`).join('');
  const cols = q.cols ? `<ul class="cols">${q.cols.map(c => `<li>${rich(c)}</li>`).join('')}</ul>` : '';
  const parts = q.parts.map((p, j) => {
    const key = `${i}-${j}`;
    return `<div class="part" id="qcard${key}">
      <div class="part-head"><span class="part-l">(${esc(p.l || 'abcdefghij'[j])})</span><span class="tag pts">${ptsOf(p)} pts</span><span class="tag kind">${esc(kindShort(p.k))}</span></div>
      <div class="stem">${rich(p.q)}</div>
      ${p.code ? `<pre class="code">${esc(p.code)}</pre>` : ''}
      ${bodyHTML(p, key)}
      ${actionsHTML(key)}
    </div>`;
  }).join('');
  return `<article class="q case" id="qcard${i}" data-i="${i}">
    <div class="q-head"><span class="q-num">${i + 1}.</span><span class="tag kind">${t('tagCase')}</span><span class="tag pts">${ptsOf(q)} pts</span>${q.fromAI ? `<span class="tag ai">${t('tagAI')}</span>` : ''}${topicTags(q.t)}<span class="case-score" id="cs${i}"></span></div>
    <h3 class="case-title">${esc(q.title)}</h3>
    <div class="bgbox"><div class="stem">${rich(q.bg)}</div>${q.bgzh && LANG === 'zh' ? `<details><summary>${t('bgHint')}</summary><p>${rich(q.bgzh)}</p></details>` : ''}</div>
    ${table}${cols}
    ${q.code ? `<pre class="code">${esc(q.code)}</pre>` : ''}
    <div class="parts">${parts}</div>
  </article>`;
}

function updateAnswered() {
  const n = S.exam.filter((q, i) => q.k === 'case' ? q.parts.some((p, j) => isAnswered(p, `${i}-${j}`)) : isAnswered(q, String(i))).length;
  $('#answeredInfo').textContent = S.exam.length ? t('answered', {a: n, b: S.exam.length}) : '';
}
function isAnswered(q, key) {
  if (q.k === 'code') return q.blanks.some((_, j) => (document.getElementById(`q${key}b${j}`)?.value || '').trim());
  if (q.k === 'short') return (document.getElementById(`q${key}t`)?.value || '').trim().length > 0;
  return !!document.querySelector(`input[name="q${key}"]:checked`);
}

// Reads the first JSON value out of a reply, tolerating code fences or a sentence around it.
function parseLoose(text) {
  const s = String(text || '').trim();
  const tries = [s];
  const fence = s.match(/```(?:json)?\s*([\s\S]*?)```/i); if (fence) tries.push(fence[1]);
  const i = Math.min(...['{', '['].map(c => s.indexOf(c)).filter(x => x >= 0)); const j = Math.max(s.lastIndexOf('}'), s.lastIndexOf(']'));
  if (isFinite(i) && j > i) tries.push(s.slice(i, j + 1));
  for (const x of tries) { try { return JSON.parse(x); } catch {} }
  throw {code: 'invalid_json', text: s};
}

// Claude Messages API over HTTP, streamed so long case-study replies do not time out.
const FALLBACK_MODELS = ['claude-opus-5-5', 'claude-opus-5', 'claude-sonnet-5-5', 'claude-fable-5-2', 'claude-fable-5-1'];
async function callAnthropic(prompt, kind, signal, onProgress) {
  const model = (S.ai.models.anthropic || '').trim() || 'claude-opus-5-5';
  const headers = {'content-type': 'application/json', 'x-api-key': S.ai.keys.anthropic, 'anthropic-version': '2026-10-21', 'anthropic-dangerous-direct-browser-access': 'true'};
  const body = {model, max_tokens: kind === 'grade' ? 8000 : 64000, stream: true, messages: [{role: 'user', content: prompt}]};
  if (/^claude-(opus-5|sonnet-5-5|haiku-5-5|fable-5|mythos-5)/.test(model)) body.output_config = {effort: kind === 'grade' ? 'low' : 'high'};
  if (FALLBACK_MODELS.includes(model)) { headers['anthropic-beta'] = 'server-side-fallback-2026-07-01'; body.fallbacks = 'default'; }
  let res;
  try { res = await fetch('https://api.anthropic.com/v1/messages', {method: 'POST', headers, body: JSON.stringify(body), signal}); }
  catch (e) { throw e?.name === 'AbortError' ? {code: 'cancelled'} : {code: 'network'}; }
  if (!res.ok) { const j = await res.json().catch(() => null); throw {code: 'http', status: res.status, message: j?.error?.message || res.statusText}; }
  const reader = res.body.getReader(), dec = new TextDecoder();
  let buf = '', text = '', stop = null;
  try {
    for (;;) {
      const {value, done} = await reader.read(); if (done) break;
      buf += dec.decode(value, {stream: true});
      let cut;
      while ((cut = buf.indexOf('\n\n')) >= 0) {
        const chunk = buf.slice(0, cut); buf = buf.slice(cut + 2);
        const data = chunk.split('\n').filter(l => l.startsWith('data:')).map(l => l.slice(5).trim()).join('');
        if (!data) continue;
        let ev; try { ev = JSON.parse(data); } catch { continue; }
        if (ev.type === 'content_block_delta' && ev.delta?.type === 'text_delta') { text += ev.delta.text; onProgress?.(text.length); }
        else if (ev.type === 'message_delta' && ev.delta?.stop_reason) stop = ev.delta.stop_reason;
        else if (ev.type === 'error') throw {code: 'http', status: 'stream', message: ev.error?.message || 'stream error'};
      }
    }
  } catch (e) { throw e?.name === 'AbortError' ? {code: 'cancelled'} : e; }
  if (stop === 'refusal') throw {code: 'refused'};
  if (stop === 'max_tokens') throw {code: 'truncated'};
  return text;
}

// OpenAI Chat Completions over HTTP, asking for a JSON object back.
async function callOpenAI(prompt, signal) {
  const model = (S.ai.models.openai || '').trim() || 'gpt-5';
  let res;
  try {
    res = await fetch('https://api.openai.com/v1/chat/completions', {method: 'POST', signal,
      headers: {'content-type': 'application/json', authorization: 'Bearer ' + S.ai.keys.openai},
      body: JSON.stringify({model, messages: [{role: 'user', content: prompt}], response_format: {type: 'json_object'}})});
  } catch (e) { throw e?.name === 'AbortError' ? {code: 'cancelled'} : {code: 'network'}; }
  const j = await res.json().catch(() => null);
  if (!res.ok) throw {code: 'http', status: res.status, message: j?.error?.message || res.statusText};
  const choice = j?.choices?.[0];
  if (choice?.finish_reason === 'length') throw {code: 'truncated'};
  return choice?.message?.content || '';
}

async function aiJSON(prompt, {kind = 'gen', signal, onProgress} = {}) {
  const p = S.ai.provider;
  if (p === 'app') return S.sample.json(prompt, {signal, cache: false, modelTier: kind === 'grade' ? 'default' : nCases() ? 'complex' : 'default'});

}

// ---------- grading ----------
const norm = s => String(s).trim().replace(/\s+/g, '').replace(/"/g, "'").replace(/;+$/, '');
const loosen = s => norm(s).toLowerCase().replace(/array\(|\)|\[|\]/g, '');
function blankOk(input, b, loose) {
  const v = loose ? loosen(input) : norm(input);
  if (!v) return false;
  return b.acc.some(a => {
    const x = loose ? loosen(a) : norm(a);
    if (v === x) return true;
    if (loose && /^[-\d.e]+$/.test(v) && !isNaN(parseFloat(x)) && Math.abs(parseFloat(v) - parseFloat(x)) < 1e-9) return true;
    if (loose && /^\d+\/\d+$/.test(v)) { const [p, q] = v.split('/').map(Number); return Math.abs(p / q - parseFloat(x)) < 1e-9; }
    return false;
  });
}
const el = id => document.getElementById(id);
function grade(q, key) {
  if (q.k === 'mc' || q.k === 'tf') {
    const c = document.querySelector(`input[name="q${key}"]:checked`);
    const pick = c ? +c.value : -1; const right = q.k === 'tf' ? (q.a ? 0 : 1) : q.a;
    return {score: pick === right ? 1 : 0, pick: [pick], right: [right]};
  }
  if (q.k === 'multi') {
    const picks = [...document.querySelectorAll(`input[name="q${key}"]:checked`)].map(e => +e.value);
    const hits = picks.filter(p => q.a.includes(p)).length, wrong = picks.length - hits;
    const exact = hits === q.a.length && wrong === 0;
    return {score: exact ? 1 : Math.max(0, (hits - wrong) / q.a.length) * 0.5, pick: picks, right: q.a, exact};
  }
  if (q.k === 'code') {
    const oks = q.blanks.map((b, j) => blankOk(el(`q${key}b${j}`).value, b, q.loose));
    return {score: oks.filter(Boolean).length / oks.length, oks};
  }
  return {score: q.self == null ? null : q.self};
}

// Shows a graded unit. regrade=false re-displays an existing result (after a language switch).
function showResult(key, regrade = true) {
  key = String(key);
  const q = getQ(key); const card = el('qcard' + key);
  if (!q || !card) return;
  if (regrade || !q.res) q.res = grade(q, key);
  card.querySelectorAll(':scope > .opts input, :scope > .blanks input, :scope > textarea').forEach(e => { if (q.k === 'code') e.readOnly = true; else e.disabled = true; });
  card.querySelector(':scope > .q-actions [data-check]')?.remove();
  if (q.k === 'mc' || q.k === 'tf' || q.k === 'multi') {
    card.querySelectorAll(':scope > .opts .opt').forEach(o => {
      const j = +o.dataset.j;
      if (q.res.right.includes(j)) o.classList.add('is-right');
      else if (q.res.pick.includes(j)) o.classList.add('is-wrong');
    });
  }
  if (q.k === 'code') q.res.oks.forEach((ok, j) => el(`q${key}b${j}`).classList.add(ok ? 'ok' : 'no'));
  paintVerdict(key);
  el('ex' + key).innerHTML = explainHTML(q, key);
  if (regrade) afterScore(key); else if (key.includes('-')) paintCase(+key.split('-')[0]);
}
function afterScore(key) {
  const [i, j] = String(key).split('-');
  const top = S.exam[+i];
  if (j != null) paintCase(+i);
  const scores = top.k === 'case' ? top.parts.map(unitScore) : [unitScore(top)];
  if (scores.some(s => s != null && s < 1)) addMistake(top);
  else if (scores.every(s => s != null && s >= 1)) dropMistake(top.id);
  if (S.submitted) renderResults();
}
function paintCase(i) {
  const q = S.exam[i]; const done = q.parts.filter(p => unitScore(p) != null);
  if (!done.length) return;
  const got = done.reduce((s, p) => s + unitScore(p) * ptsOf(p), 0);
  el('cs' + i).textContent = `${fmt(got, 1)} / ${ptsOf(q)} pts${done.length < q.parts.length ? t('partly') : ''}`;
}
function paintVerdict(key) {
  const q = getQ(key), v = el('v' + key), s = unitScore(q);
  if (s == null) { v.className = 'verdict'; v.textContent = q.k === 'short' ? t('selfPrompt') : ''; return; }
  v.className = 'verdict ' + (s >= 1 ? 'good' : s > 0 ? 'part' : 'bad');
  const p = ptsOf(q);
  v.textContent = t(s >= 1 ? 'vRight' : s > 0 ? 'vPart' : 'vWrong') + ` · ${fmt(s * p, 1)}/${p} pts`;
}
function explainHTML(q, key) {
  let ans = '';
  if (q.k === 'mc') ans = `${t('ansIs')}${LETTERS[q.a]}. ${rich(q.c[q.a])}`;

  const ai = q.ai ? `<div class="ai-fb"><b>${t('aiFb')}</b>${q.ai}</div>` : '';
  return `<div class="explain"><div class="ans">${ans}</div>${model}${keys}<div>${rich(q.e || '')}</div>${self}${override}${ai}</div>`;
}

${exCase}` : '';
