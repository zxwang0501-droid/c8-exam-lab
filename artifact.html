// Exam-style tables for the case studies: more columns of mixed types, extra columns the question does not need,
// a second table to join where it fits, and extra parts that need multi-step Table code even when the topic is inference.
function patchCase(id, o) {
  const c = CASES.find(x => x.id === id);
  delete c.table;
  c.tables = o.tables; c.cols = o.cols;
  if (o.code) c.code = o.code;
  if (o.t) c.t = [...new Set([...c.t, ...o.t])];
  for (const [l, edit] of Object.entries(o.edit || {})) Object.assign(c.parts.find(p => p.l === l), edit);
  (o.parts || []).forEach(p => c.parts.push(p));
}

// English and Spanish versions for bank-a (Midterm 1 topics). null in a choice list keeps the original (code or numbers).
addTr({
ca1:{en:{e:'This is an observational study (the researchers did not assign who eats breakfast), so it only shows association. A and C are causal claims. D is wrong because observational studies can still find associations; they just cannot establish causation.'},
 es:{q:'Una encuesta a 3,000 adultos encuentra que quienes desayunan todos los días reportan menos días de enfermedad que quienes no desayunan. ¿Qué conclusión justifica este estudio por sí solo?', c:['Desayunar hace que la gente se enferme menos.','Hay una asociación entre desayunar a diario y reportar menos días de enfermedad.','Saltarse el desayuno hace que la gente se enferme más.','No hay asociación, porque el estudio es observacional.'],
 e:'Es un estudio observacional (nadie asignó quién desayuna), así que solo muestra asociación. A y C son afirmaciones causales. D es falsa: un estudio observacional sí puede encontrar asociaciones; lo que no puede es probar causalidad.'}},
ca2:{en:{e:'A confounder must (1) differ between the OH and non-OH groups and (2) affect scores itself. Motivation, job hours, and programming background can all affect both whether a student goes to OH and their score. The room number is the same for everyone, so it creates no difference between groups.'},
 es:{q:'Un estudio observacional encuentra que los estudiantes que van a las horas de oficina (OH) sacan mejores notas en el examen. ¿Cuáles podrían ser factores de confusión (confounding factors)? Marca todas las correctas.', c:['La motivación del estudiante por sacar buena nota','Las horas semanales que el estudiante trabaja en un empleo','El número del salón donde se hacen las horas de oficina','La experiencia previa del estudiante con la programación'],
 e:'Un factor de confusión debe (1) ser distinto entre quienes van y no van a OH y (2) afectar por sí mismo la nota. La motivación, las horas de trabajo y la experiencia en programación pueden influir en ambas cosas. El número de salón es igual para todos, así que no crea diferencias entre los grupos.'}},
ca3:{en:{e:'Only a randomized controlled experiment makes the groups differ by nothing but chance apart from the treatment, so a difference can be attributed to the app. In A, students choose (more diligent students may download it). In C the groups already differ. D is self-report.'},
 es:{q:'Una investigadora quiere mostrar que una nueva app de estudio CAUSA mejores notas en las pruebas cortas. ¿Qué diseño podría establecerlo?', c:['Comparar las notas de quienes eligieron descargar la app con las de quienes no.','Asignar al azar a los estudiantes a tener la app o no, y luego comparar sus notas.','Dar la app a los 100 estudiantes con mejor promedio y compararlos con el resto.','Preguntar a los estudiantes si creen que la app les ayudó.'],
 e:'Solo un experimento controlado aleatorizado hace que los grupos difieran únicamente por azar fuera del tratamiento, así que la diferencia puede atribuirse a la app. En A los estudiantes eligen (los más aplicados quizá la descargan). En C los grupos ya son distintos. D es una opinión subjetiva.'}},
ca4:{en:{e:'False. Random assignment only makes the groups differ by chance apart from the treatment; it does not make them identical. That is why we still run a test (such as an A/B test) to see whether a difference could be due to chance.'},
 es:{q:'Verdadero o falso: En un experimento controlado aleatorizado, se garantiza que los grupos de tratamiento y control son idénticos en todo excepto en el tratamiento.',
 e:'Falso. La asignación aleatoria solo hace que los grupos difieran por azar fuera del tratamiento; no los hace idénticos. Por eso seguimos usando una prueba (como una prueba A/B) para ver si la diferencia podría deberse al azar.'}},
ca5:{en:{e:'Random SAMPLING lets conclusions generalize to the population; random ASSIGNMENT is what supports causation. Here the sample is random but students chose whether to join, so we can only claim an association in the population.'},
 es:{q:'Unos investigadores toman una muestra aleatoria simple de 800 estudiantes de pregrado de UC Berkeley. Cada estudiante decide si se une a un programa de mentorías. Los que tuvieron mentoría terminan con un promedio más alto. ¿Qué se puede concluir?', c:['La mentoría causa mejores promedios en todos los estudiantes de Berkeley, porque la muestra fue aleatoria.','La mentoría causa mejores promedios, pero solo en los 800 de la muestra.','Hay una asociación entre la mentoría y el promedio entre los estudiantes de Berkeley, pero no necesariamente causalidad.','Nada, porque 800 estudiantes es una muestra muy pequeña.'],
 e:'El MUESTREO aleatorio permite generalizar a la población; la ASIGNACIÓN aleatoria es la que permite hablar de causalidad. Aquí la muestra es aleatoria pero cada estudiante eligió participar, así que solo podemos afirmar una asociación en la población.'}},
ca6:{en:{p:['Random assignment makes the groups similar apart from the treatment, including unmeasured factors','Any remaining difference between groups is due to chance','If the difference is too large to be explained by chance, it can be attributed to the treatment'], e:'Key chain of reasoning: randomization removes systematic confounding, so only chance remains; once a test rules out chance, the difference comes from the treatment.'},
 es:{q:'En una o dos oraciones, explica por qué asignar al azar a los sujetos a tratamiento y control permite sacar conclusiones causales.', a:'La asignación aleatoria hace que los grupos de tratamiento y control sean parecidos en todo (incluidos factores de confusión no medidos) salvo el tratamiento, excepto por diferencias debidas al azar. Si la diferencia en los resultados es demasiado grande para explicarse por azar, se puede atribuir al tratamiento.',
 p:['La asignación aleatoria hace que los grupos sean parecidos salvo el tratamiento, incluso en factores no medidos','Lo que queda de diferencia se debe al azar','Si la diferencia es demasiado grande para el azar, se atribuye al tratamiento'], e:'Razonamiento clave: aleatorizar elimina la confusión sistemática, así que solo queda el azar; si una prueba descarta el azar, la diferencia viene del tratamiento.'}},
ca7:{en:{e:'Drawing conclusions about a population (all California voters) from a sample while accounting for uncertainty is inference. Exploration looks for patterns; prediction makes guesses about individuals we have not seen.'},
 es:{q:'Unos investigadores usan una muestra aleatoria grande y representativa de votantes de California para estimar la proporción de TODOS los votantes de California que apoyan una medida. ¿Qué faceta de la ciencia de datos ilustra principalmente?', c:['Exploración (Exploration)','Inferencia (Inference)','Predicción (Prediction)','Visualización'],
 e:'Sacar conclusiones sobre una población (todos los votantes de California) a partir de una muestra, teniendo en cuenta la incertidumbre, es inferencia. La exploración busca patrones; la predicción adivina sobre individuos que no hemos visto.'}},
ca8:{en:{e:'True. Single-blind means the subjects do not know their group; double-blind means neither the subjects nor the people measuring outcomes know. It prevents expectation effects and biased measurement.'},
 es:{q:'Verdadero o falso: En un experimento doble ciego, ni los sujetos ni las personas que miden los resultados saben qué sujetos recibieron el tratamiento.',
 e:'Verdadero. Ciego simple: los sujetos no saben su grupo; doble ciego: ni los sujetos ni quienes evalúan lo saben. Así se evitan efectos de expectativa y sesgos al medir.'}},
ca9:{en:{p:['Key idea: assignment was "as good as random"','The groups do not differ systematically apart from the treatment (no confounding factors)','Example: John Snow\'s two water companies (a natural experiment)'], e:'Observational studies generally cannot establish causation. The exception is when the way people ended up in groups is essentially random, which rules out confounders.'},
 es:{q:'¿En qué casos es razonable sacar una conclusión causal de un estudio observacional? Responde en una oración.', a:'Solo cuando la forma en que los individuos quedaron en tratamiento o control es prácticamente aleatoria, de modo que los grupos son parecidos salvo el tratamiento y no hay factores de confusión (como en un experimento natural, por ejemplo la comparación de John Snow entre dos compañías de agua).',
 p:['Idea clave: la asignación fue "prácticamente aleatoria"','Los grupos no difieren sistemáticamente salvo el tratamiento (sin factores de confusión)','Ejemplo: las dos compañías de agua de John Snow (experimento natural)'], e:'Los estudios observacionales en general no prueban causalidad. La excepción es cuando la forma de formar los grupos es esencialmente aleatoria, lo que descarta factores de confusión.'}},
ca10:{en:{e:'Snow did not randomize (A is wrong), but households of the two companies were similar in income, jobs, and neighborhood, so assignment was almost random: a natural experiment. The difference in death rates can reasonably be attributed to the water source.'},
 es:{q:'En el estudio de John Snow sobre el cólera en Londres, cada casa recibía agua de una de dos compañías, y las tuberías de ambas pasaban por las mismas calles. ¿Por qué fue convincente esta comparación?', c:['Snow asignó al azar cada casa a una compañía.','Las casas de las dos compañías eran parecidas en otros aspectos, así que la asignación era casi aleatoria.','Snow encuestó a todas las casas de Londres.','Más casas usaban la compañía contaminada, así que la muestra era más grande.'],
 e:'Snow no aleatorizó (A es falsa), pero los clientes de ambas compañías eran parecidos en ingresos, empleos y barrio, así que la asignación fue casi aleatoria: un experimento natural. La diferencia en muertes puede atribuirse razonablemente a la fuente de agua.'}},
py1:{en:{e:'True counts as 1 and False as 0, so the average is (1 + 0 + 1 + 1)/4 = 0.75. This is the standard trick for proportions: np.mean(arr > 10) is the proportion above 10.'},
 es:{q:'¿A qué se evalúa la siguiente expresión? Si da error, escribe Error.', e:'True cuenta como 1 y False como 0, así que el promedio es (1 + 0 + 1 + 1)/4 = 0.75. Es el truco habitual para proporciones: np.mean(arr > 10) es la proporción mayor que 10.'}},
py2:{en:{e:"A string and an integer cannot be added; it raises a TypeError. To join them write '4' + str(4); to add them write int('4') + 4."},
 es:{q:"¿A qué se evalúa la expresión '4' + 4?", c:[null,null,null,'Un error'], e:"No se puede sumar un string con un entero: da TypeError. Para concatenar escribe '4' + str(4); para sumar, int('4') + 4."}},
py3:{en:{e:'Start at 2 and add 3 each time: 2, 5, 8. The next value, 11, equals stop and is not included.'},
 es:{q:'¿A qué se evalúa esta expresión? Escribe los elementos del array separados por comas.', e:'Empieza en 2 y suma 3 cada vez: 2, 5, 8. El siguiente, 11, es igual a stop y no se incluye.'}},
py4:{en:{e:'Array arithmetic is elementwise and needs equal lengths (or a single number). Lengths 3 and 2 do not match, so this errors.'},
 es:{q:'¿Qué pasa al ejecutar este código?', c:[null,null,null,'Un error, porque los arrays tienen longitudes distintas'], e:'La aritmética con arrays es elemento a elemento y requiere la misma longitud (o un solo número). Las longitudes 3 y 2 no coinciden, así que da error.'}},
py5:{en:{e:"2**3 is 8 ✓; string comparison is case-sensitive ✗; 10/4 = 2.5 ✗; the max is 7 ✓; abs(-3) = 3 is not less than 2 ✗."},
 es:{q:'¿Cuáles de las siguientes expresiones se evalúan a True? Marca todas las correctas.', e:"2**3 es 8 ✓; la comparación de strings distingue mayúsculas ✗; 10/4 = 2.5 ✗; el máximo es 7 ✓; abs(-3) = 3 no es menor que 2 ✗."}},
py6:{en:{e:'np.diff gives differences of neighbors: 4−1, 9−4, 16−9. The result has one fewer element than the input.'},
 es:{q:'¿A qué se evalúa esta expresión? Escribe los elementos separados por comas.', e:'np.diff da las diferencias entre vecinos: 4−1, 9−4, 16−9. El resultado tiene un elemento menos que el original.'}},
py7:{en:{e:'In Python, / always returns a float, so 6 / 3 is 2.0.'},
 es:{q:'¿De qué tipo es el valor de la expresión 6 / 3?', e:'En Python, / siempre devuelve float, así que 6 / 3 es 2.0.'}},
py8:{en:{e:'np.append returns a NEW array and does not change x. You must write x = np.append(x, 20). This comes up constantly in simulation loops.'},
 es:{q:'x = make_array(5, 10, 15). Después de ejecutar np.append(x, 20) (sin asignar), ¿qué es x?', c:[null,null,null,'Un error'], e:'np.append devuelve un array NUEVO y no cambia x. Hay que escribir x = np.append(x, 20). Esto aparece todo el tiempo en los bucles de simulación.'}},
tb1:{en:{e:'column returns an array; select, where, and sort all return Tables.'},
 es:{q:'La tabla cafes tiene columnas name (str), area (str), rating (float) y price (float). ¿Qué expresión se evalúa a un ARRAY?', e:'column devuelve un array; select, where y sort devuelven Tables.'}},
tb2:{en:{e:"where takes a column label (a string) and then a value or predicate: where('area', 'Northside') is the same as where('area', are.equal_to('Northside')). The two where calls can be in either order. Finally column('name') extracts the names."},
 es:{q:"Con la tabla cafes (columnas name, area, rating, price), completa los espacios para obtener un array con los nombres de los cafés del área 'Northside' con rating mayor que 4.", e:"where recibe la etiqueta de la columna (string) y luego un valor o predicado: where('area', 'Northside') equivale a where('area', are.equal_to('Northside')). El orden de los dos where da igual. Al final column('name') extrae los nombres."}},
tb3:{en:{e:'are.between(a, b) includes a and excludes b, the same convention as np.arange and histogram bins. To include both ends use are.between_or_equal_to(a, b).'},
 es:{q:"¿Qué valores de x conserva tbl.where('x', are.between(2, 4))?", e:'are.between(a, b) incluye a y excluye b, igual que np.arange y los intervalos del histograma. Para incluir ambos extremos usa are.between_or_equal_to(a, b).'}},
tb4:{en:{e:"False. Table methods return new tables; the original is unchanged. To change cafes you must write cafes = cafes.drop('price')."},
 es:{q:"Verdadero o falso: Después de ejecutar solo cafes.drop('price'), la tabla cafes ya no tiene la columna price.", e:"Falso. Los métodos de Table devuelven tablas nuevas; la original no cambia. Para cambiar cafes hay que escribir cafes = cafes.drop('price')."}},
tb5:{en:{e:"After sorting in descending order the first row is the highest: sort('rating', descending=True), then column('name').item(0). With the default ascending sort you would need the last item."},
 es:{q:'Completa los espacios para que top sea el NOMBRE (un string) del café con mejor rating.', e:"Tras ordenar de mayor a menor, la primera fila es la más alta: sort('rating', descending=True) y luego column('name').item(0). Con el orden ascendente por defecto habría que tomar el último elemento."}},
tb6:{en:{e:'num_rows is an attribute, written without parentheses. len(cafes.labels) is the number of columns.'},
 es:{q:'¿Qué expresión da el número de filas de cafes?', e:'num_rows es un atributo, sin paréntesis. len(cafes.labels) es el número de columnas.'}},
tb7:{en:{e:"with_column(label, values): values must be an array as long as the table (or a single number). select returns a Table, which cannot be multiplied like that; 'price' * 1.1 multiplies a string; D has the arguments reversed."},
 es:{q:"¿Qué expresión agrega a cafes una columna 'with tax' igual a price × 1.1?", e:"with_column(etiqueta, valores): los valores deben ser un array tan largo como la tabla (o un solo número). select devuelve una Table que no se puede multiplicar así; 'price' * 1.1 multiplica un string; D tiene los argumentos al revés."}},
tb8:{en:{e:'Counting rows after filtering ✓; counting True values in a boolean array ✓; summing a boolean array also counts the Trues ✓. num_columns counts columns, and item(0) is the first price, not a count.'},
 es:{q:'¿Qué expresiones dan el NÚMERO de cafés con precio menor que 10? Marca todas las correctas.', e:'Contar filas tras filtrar ✓; contar los True de un array booleano ✓; sumar un array booleano también cuenta los True ✓. num_columns cuenta columnas, e item(0) es el primer precio, no una cantidad.'}},
tb9:{en:{e:'take selects rows by position; np.arange(3) is 0, 1, 2, so these are the first three rows.'},
 es:{q:'¿A qué se evalúa cafes.take(np.arange(3))?', c:['Una tabla con las 3 primeras filas de cafes','Una tabla con las 3 primeras columnas de cafes','El array [0, 1, 2]','Una tabla solo con la fila 3'], e:'take elige filas por posición; np.arange(3) es 0, 1, 2, así que son las tres primeras filas.'}},
vz1:{en:{e:'Zip codes and section numbers are digits, but arithmetic on them is meaningless; they are labels for groups, so they are categorical. Units enrolled and height are numerical.'},
 es:{q:'Una tabla tiene una fila por estudiante. ¿Qué columnas son variables CATEGÓRICAS? Marca todas las correctas.', c:['Código postal del domicilio','Número de créditos inscritos','Carrera que piensa estudiar','Número de sección de discusión','Estatura en cm'], e:'El código postal y el número de sección son dígitos, pero hacer cuentas con ellos no tiene sentido; son etiquetas de grupo, así que son categóricas. Los créditos y la estatura son numéricos.'}},
vz2:{en:{e:'The distribution of one numerical variable calls for a histogram. Bar charts are for categories, line plots for ordered data such as time, and scatter plots for two numerical variables.'},
 es:{q:'Quieres visualizar la distribución de los tiempos de traslado (en minutos) de 500 estudiantes. ¿Qué gráfico es más apropiado?', c:['Gráfico de barras','Histograma','Gráfico de líneas','Diagrama de dispersión'], e:'La distribución de una variable numérica se muestra con un histograma. Las barras son para categorías, las líneas para datos ordenados como el tiempo y la dispersión para dos variables numéricas.'}},
vz3:{en:{e:'The relationship between two numerical variables calls for a scatter plot, with one point per student.'},
 es:{q:'Quieres ver si los estudiantes que duermen más tienden a sacar mejores notas (ambas numéricas). ¿Qué gráfico usarías?', c:['Gráfico de barras','Histograma','Gráfico de líneas','Diagrama de dispersión'], e:'La relación entre dos variables numéricas se ve con un diagrama de dispersión, un punto por estudiante.'}},
vz4:{en:{e:'When the horizontal axis is an ordered variable like time and you want the trend, use a line plot (tbl.plot).'},
 es:{q:'Una tabla tiene una fila por mes de 2020 a 2025 con el alquiler promedio en Berkeley ese mes. ¿Qué gráfico muestra mejor cómo cambió el alquiler?', c:['Gráfico de barras','Histograma','Gráfico de líneas','Histogramas superpuestos'], e:'Cuando el eje horizontal es ordenado, como el tiempo, y quieres la tendencia, usa un gráfico de líneas (tbl.plot).'}},
vz5:{en:{e:"The group argument of hist draws overlaid histograms by category: scores.hist('Score', group='Section')."},
 es:{q:"La tabla scores tiene columnas 'Score' (numérica) y 'Section' (categórica). Completa el espacio para dibujar histogramas superpuestos que comparen la distribución de Score entre secciones.", e:"El argumento group de hist dibuja histogramas superpuestos por categoría: scores.hist('Score', group='Section')."}},
vz6:{en:{e:'False. In a bar chart only the length matters; width and order are arbitrary. (In a histogram the width does matter.)'},
 es:{q:'Verdadero o falso: En un gráfico de barras de una variable categórica, el ancho de cada barra y el orden de las barras contienen información sobre los datos.', e:'Falso. En un gráfico de barras solo importa la longitud; el ancho y el orden son arbitrarios. (En un histograma sí importa el ancho.)'}},
hs1:{en:{e:'False. On the density scale the AREA of a bar is the percent in the bin; height = percent ÷ bin width, in percent per unit.'},
 es:{q:'Verdadero o falso: En un histograma en escala de densidad, la altura de una barra es el porcentaje de datos en ese intervalo.', e:'Falso. En escala de densidad el ÁREA de la barra es el porcentaje del intervalo; altura = porcentaje ÷ ancho, en porcentaje por unidad.'}},
hs2:{en:{e:'Height = percent / width, and width is in minutes, so the units are percent per minute.'},
 es:{q:'Un histograma muestra tiempos en minutos. ¿En qué unidades está el eje vertical en escala de densidad?', c:['Minutos','Porcentaje','Porcentaje por minuto','Cantidad por porcentaje'], e:'Altura = porcentaje / ancho, y el ancho está en minutos, así que las unidades son porcentaje por minuto.'}},
hs3:{en:{e:'Area is the percent: 3 × 10 = 30% and 1 × 30 = 30%. The two bins contain the same amount; comparing only heights would mislead you.'},
 es:{q:'Un histograma tiene una barra sobre [0, 10) con altura 3 por ciento por unidad y otra sobre [10, 40) con altura 1 por ciento por unidad. ¿Qué intervalo contiene más datos?', c:[null,null,'Contienen el mismo porcentaje de datos','No se puede determinar'], e:'El área es el porcentaje: 3 × 10 = 30% y 1 × 30 = 30%. Los dos tienen lo mismo; comparar solo alturas engaña.'}},
hs4:{en:{e:'Bins include the left endpoint and exclude the right one (the last bin includes both). 20 belongs to [20, 30).'},
 es:{q:'Los intervalos de un histograma son [10, 20), [20, 30), [30, 40]. Un valor exactamente igual a 20, ¿en qué intervalo se cuenta?', c:[null,null,'En ambos','En ninguno'], e:'Cada intervalo incluye el extremo izquierdo y excluye el derecho (el último incluye ambos). 20 está en [20, 30).'}},
hs5:{en:{p:['Conclusion: it cannot be determined','The bar only gives the total percent in the bin (2 × 10 = 20%)','How the data are spread inside the bin is not shown (unless we assume they are spread evenly)'], e:'A histogram hides the detail inside each bin. As a multiple-choice question the answer is usually "cannot be determined / not enough information".'},
 es:{q:'Un histograma tiene una sola barra sobre [10, 20) con altura 2 por ciento por unidad. ¿Puedes determinar el porcentaje de datos entre 12 y 15? Explica brevemente.', a:'No. La barra dice que el 20% de los datos está en [10, 20), pero un histograma no muestra cómo se reparten los datos dentro del intervalo, así que no sabemos qué parte de ese 20% está entre 12 y 15 (a menos que supongamos que están distribuidos de forma pareja).',
 p:['Conclusión: no se puede determinar','La barra solo da el porcentaje total del intervalo (2 × 10 = 20%)','No se ve cómo se reparten los datos dentro del intervalo (salvo que se suponga uniformidad)'], e:'El histograma oculta el detalle dentro de cada intervalo. En opción múltiple, la respuesta suele ser "no se puede determinar".'}},
hs6:{en:{e:'The percents of all bins add to 100%, so the total area is 100%.'},
 es:{q:'¿Cuál es el área total de todas las barras de un histograma en escala de densidad?', c:['1 por ciento','100 por ciento','El número de individuos','Depende del ancho de los intervalos'], e:'Los porcentajes de todos los intervalos suman 100%, así que el área total es 100%.'}},
fn1:{en:{e:'The function only prints; it has no return. The screen shows 10, but the function returns None, so result is None.'},
 es:{q:'¿Cuál es el valor de result después de ejecutar este código?', e:'La función solo imprime; no tiene return. En pantalla se ve 10, pero la función devuelve None, así que result es None.'}},
fn2:{en:{e:'max(arr) - min(arr). Remember to return the value rather than print it.'},
 es:{q:'Completa la función para que devuelva el rango (máximo menos mínimo) de un array de números.', e:'max(arr) - min(arr). Recuerda devolver (return) el valor, no imprimirlo.'}},
fn3:{en:{e:'apply calls f on every value in the column and returns an array as long as the table, usually added back with with_column.'},
 es:{q:"¿Qué tipo de valor devuelve tbl.apply(f, 'Score')?", c:['Una Table','Un array','Un solo número','Una función'], e:'apply llama a f con cada valor de la columna y devuelve un array del largo de la tabla, que suele añadirse con with_column.'}},
fn4:{en:{e:"roster.apply(letter, 'Score'): pass the function name letter (no parentheses), then the column label as a string."},
 es:{q:"letter(score) devuelve la letra de calificación (string) para una nota. Completa el espacio para agregar la columna 'Grade' a la tabla roster, que tiene la columna 'Score'.", e:"roster.apply(letter, 'Score'): se pasa el nombre de la función letter (sin paréntesis) y luego la etiqueta de la columna como string."}},
fn5:{en:{e:'With several column labels, the function receives one argument per column, in order. It is called once per row and the results form an array.'},
 es:{q:"bmi(w, h) recibe un peso y una estatura. ¿Qué hace people.apply(bmi, 'weight', 'height')?", c:['Llama a bmi una vez con dos arrays','Llama a bmi una vez por fila, con el peso y la estatura de esa fila como argumentos, y devuelve un array','Devuelve una tabla con una columna nueva','Da error, porque apply solo acepta una columna'], e:'Con varias columnas, la función recibe un argumento por columna, en orden. Se llama una vez por fila y los resultados forman un array.'}},
fn6:{en:{e:'False. Names inside a function body are local and disappear when the function finishes. Use return to send a value out.'},
 es:{q:'Verdadero o falso: Un nombre asignado dentro del cuerpo de una función puede usarse fuera de la función después de llamarla.', e:'Falso. Los nombres dentro de una función son locales y desaparecen al terminar. Para sacar un valor hay que usar return.'}},
gp1:{en:{e:"With one column label, group counts how many times each value appears. The result has two columns: day and count."},
 es:{q:"La tabla trips tiene columnas rider, day, duration y type. ¿Cuáles son las etiquetas de columna de trips.group('day')?", e:"Con una sola columna, group cuenta cuántas veces aparece cada valor. El resultado tiene dos columnas: day y count."}},
gp2:{en:{e:"group(col, f) aggregates the other columns, and the new label is the old label plus a space plus the function name: 'duration mean'."},
 es:{q:"¿Cuáles son las etiquetas de columna de trips.select('type', 'duration').group('type', np.mean)?", e:"group(col, f) agrega las demás columnas, y la etiqueta nueva es la etiqueta original + espacio + nombre de la función: 'duration mean'."}},
gp3:{en:{e:"Select only the columns you need first (otherwise np.mean would be applied to string columns like rider and type), then group('day', np.mean)."},
 es:{q:'Completa los espacios para obtener una tabla con una fila por día y la duración PROMEDIO de los viajes ese día.', e:"Primero selecciona solo las columnas necesarias (si no, np.mean se aplicaría a columnas de texto como rider y type), luego group('day', np.mean)."}},
gp4:{en:{e:"pivot(columns, rows): the values of the first argument become column labels, and each value of the second gets a row. Without values/collect, the cells are counts. D describes group(['day', 'type'])."},
 es:{q:"En trips, type es 'member' o 'casual' y day tiene 7 valores. ¿Cómo es trips.pivot('type', 'day')?", c:['7 filas y 3 columnas: day, casual, member; las celdas son conteos','2 filas y 8 columnas; las celdas son conteos','7 filas y 2 columnas: day y count','14 filas, una por cada par (day, type)'], e:"pivot(columnas, filas): los valores del primer argumento pasan a ser etiquetas de columna y cada valor del segundo es una fila. Sin values/collect, las celdas son conteos. D describe group(['day', 'type'])."}},
gp5:{en:{e:'Every cell of a contingency table is a count, so they add to the original number of rows: 10+25+40+15+20+30 = 140. The original only needs two columns: Year and mode of transport.'},
 es:{q:'La tabla de contingencia de abajo se hizo con pivot a partir de una tabla original. ¿Cuántas filas y columnas tenía la tabla original (suponiendo que solo tenía las columnas necesarias)?', c:['140 filas, 2 columnas','140 filas, 4 columnas','2 filas, 3 columnas','6 filas, 4 columnas'], e:'Cada celda de una tabla de contingencia es un conteo, así que suman el número de filas original: 10+25+40+15+20+30 = 140. La original solo necesita dos columnas: Year y el medio de transporte.'}},
gp6:{en:{e:'join keeps only rows that match (A ✓); the result keeps the first table\'s label sid (B ✓); unmatched rows disappear and one-to-many matches create several rows, so the row count can change (C ✗, D ✓).'},
 es:{q:"students tiene columnas name y sid; grades tiene columnas id y score. Considera students.join('sid', grades, 'id'). Marca todas las afirmaciones verdaderas.", c:['Un estudiante cuyo sid no aparece en grades no aparecerá en el resultado.',"El resultado tiene una columna 'sid' pero no una columna 'id'.",'El resultado siempre tiene el mismo número de filas que students.','Si un id aparece dos veces en grades, el estudiante correspondiente aparece en dos filas del resultado.'], e:'join solo conserva las filas que coinciden (A ✓); el resultado mantiene la etiqueta sid de la primera tabla (B ✓); las filas sin coincidencia desaparecen y las coincidencias de uno a muchos crean varias filas, así que el número de filas puede cambiar (C ✗, D ✓).'}},
gp7:{en:{e:"group('day') counts trips per day; sort by count in descending order and the first row is the busiest day."},
 es:{q:'Completa los espacios para que busiest sea el día con más viajes.', e:"group('day') cuenta los viajes por día; ordenando count de mayor a menor, la primera fila es el día con más viajes."}},
gp8:{en:{e:'Both are cross-classified counts with different shapes: group gives a "long" table (one row per combination); pivot gives a "wide" table (one variable\'s values become columns).'},
 es:{q:"¿Cuál es la mejor descripción de la diferencia entre trips.group(['day', 'type']) y trips.pivot('type', 'day')?", c:['Tienen los mismos conteos; group pone cada par (day, type) en su propia fila, mientras que pivot pone los tipos en columnas separadas.','group cuenta viajes; pivot promedia duraciones.','pivot elimina los días sin usuarios casual.','Son tablas idénticas.'], e:'Ambas son conteos cruzados con forma distinta: group da una tabla "larga" (una fila por combinación); pivot da una tabla "ancha" (los valores de una variable pasan a ser columnas).'}},
it1:{en:{e:'np.arange(3, 30, 3) is 3, 6, …, 27: nine numbers (30 is excluded).'},
 es:{q:'¿Cuántas veces se ejecuta el cuerpo de este bucle?', e:'np.arange(3, 30, 3) es 3, 6, …, 27: nueve números (30 no se incluye).'}},
it2:{en:{e:'np.random.choice(coin, 100) draws 100 times with replacement. Each loop appends the result and must reassign heads_counts.'},
 es:{q:'Completa la simulación del número de caras en 100 lanzamientos de una moneda justa, repetida 10,000 veces.', e:'np.random.choice(coin, 100) saca 100 veces con reemplazo. En cada vuelta se agrega el resultado y hay que reasignar heads_counts.'}},
it3:{en:{e:'if/elif checks conditions top to bottom and runs the first True one. 95 >= 70 is already True, so it returns C and never checks the elif.'},
 es:{q:'¿Qué devuelve grade(95)?', e:'if/elif revisa las condiciones de arriba abajo y ejecuta la primera verdadera. 95 >= 70 ya es True, así que devuelve C y nunca revisa el elif.'}},
it4:{en:{e:'True. np.random.choice samples with replacement by default, so the same element can be drawn more than once.'},
 es:{q:'Verdadero o falso: np.random.choice(arr, 5) saca 5 elementos de arr CON reemplazo.', e:'Verdadero. np.random.choice muestrea con reemplazo por defecto, así que un mismo elemento puede salir varias veces.'}},
it5:{en:{e:'sample_proportions simulates 100 random draws and returns the proportion in each category (not counts). The two proportions add to 1 and change from run to run.'},
 es:{q:'¿Qué devuelve sample_proportions(100, make_array(0.3, 0.7))?', c:['Un array de dos conteos que suman 100','Un array de dos proporciones que suman 1','Una tabla con 100 filas','El array [0.3, 0.7] siempre'], e:'sample_proportions simula 100 extracciones al azar y devuelve la proporción de cada categoría (no conteos). Las dos proporciones suman 1 y cambian en cada ejecución.'}},
it6:{en:{e:'Only 4 and 6 are greater than 3, so total = 4 + 6 = 10.'},
 es:{q:'¿Cuánto vale total después de ejecutar este código?', e:'Solo 4 y 6 son mayores que 3, así que total = 4 + 6 = 10.'}},
});

addTr({
fn1:{es:{q:'¿Cuál es el valor de result después de ejecutar este código?', c:[null,null,null,'Un error'], e:'La función solo imprime; no tiene return. En pantalla se ve 10, pero la función devuelve None, así que result es None.'}, en:{e:'The function only prints; it has no return. The screen shows 10, but the function returns None, so result is None.'}},
pr1:{en:{e:'"At least once" = 1 − "never". Missing all three has chance 0.2³, so the answer is 1 − 0.2³ = 0.992. 1 − 0.8³ is the chance of missing at least once.'},
 es:{q:'Una jugadora de baloncesto encesta cada tiro libre con probabilidad 0.8, de forma independiente. ¿Cuál es la probabilidad de que enceste al menos uno de 3 tiros libres?', e:'"Al menos uno" = 1 − "ninguno". Fallar los tres tiene probabilidad 0.2³, así que la respuesta es 1 − 0.2³ = 0.992. 1 − 0.8³ es la probabilidad de fallar al menos uno.'}},
pr2:{en:{e:'Choose which 2 of the 4 shots go in: 6 orders (HHMM, HMHM, HMMH, MHHM, MHMH, MMHH), each with chance 0.4²×0.6², so the total is 6 × 0.4² × 0.6² ≈ 0.346.'},
 es:{q:'Un tirador encesta cada tiro libre con probabilidad 0.4, de forma independiente. ¿Cuál es la probabilidad de encestar EXACTAMENTE 2 de 4 tiros?', e:'Hay 6 órdenes posibles para elegir cuáles 2 de los 4 entran (EEFF, EFEF, EFFE, FEEF, FEFE, FFEE), cada uno con probabilidad 0.4²×0.6², así que el total es 6 × 0.4² × 0.6² ≈ 0.346.'}},
pr3:{en:{e:'Multiplication rule: P(A and B) = P(A) × P(B | A). The first is red with chance 4/10; given that, 3 red remain among 9, so 3/9.'},
 es:{q:'Una bolsa tiene 4 canicas rojas y 6 azules. Se sacan dos al azar SIN reemplazo. ¿Cuál es la probabilidad de que ambas sean rojas?', e:'Regla de multiplicación: P(A y B) = P(A) × P(B | A). La primera es roja con probabilidad 4/10; dado eso, quedan 3 rojas entre 9, así que 3/9.'}},
pr4:{en:{e:'True. This is the addition rule; it requires the events to be mutually exclusive.'},
 es:{q:'Verdadero o falso: Si dos eventos no pueden ocurrir a la vez, la probabilidad de que ocurra uno u otro es la suma de sus probabilidades.', e:'Verdadero. Es la regla de la suma; requiere que los eventos sean mutuamente excluyentes.'}},
pr5:{en:{e:'1 − P(no six in four rolls) = 1 − (5/6)⁴ ≈ 0.52. 4/6 is a common mistake: it adds chances of events that are not mutually exclusive.'},
 es:{q:'Se lanza un dado 4 veces. ¿Qué expresión da la probabilidad de que al menos un lanzamiento sea un seis?', e:'1 − P(ningún seis en cuatro lanzamientos) = 1 − (5/6)⁴ ≈ 0.52. 4/6 es un error común: suma probabilidades de eventos que no son mutuamente excluyentes.'}},
sa1:{en:{e:'A parameter describes the population and is fixed (usually unknown); a statistic is computed from the sample and changes from sample to sample.'},
 es:{q:'Se quiere la estatura promedio de los 30,000 estudiantes de pregrado de Berkeley. Se mide a 400 elegidos al azar y el promedio es 169 cm. ¿Qué afirmación es correcta?', c:['169 cm es un parámetro.','169 cm es un estadístico; la estatura promedio de los 30,000 es un parámetro.','Ambos son estadísticos.','El promedio de los 30,000 es aleatorio.'], e:'Un parámetro describe la población y es fijo (casi siempre desconocido); un estadístico se calcula con la muestra y cambia de una muestra a otra.'}},
sa2:{en:{e:'False. A probability sample only requires that the chance of each possible sample can be calculated. Equal chances for every individual is the special case of a simple random sample.'},
 es:{q:'Verdadero o falso: En una muestra probabilística, todos los individuos de la población deben tener la misma probabilidad de ser elegidos.', e:'Falso. Una muestra probabilística solo exige que se pueda calcular la probabilidad de cada muestra posible. Que todos tengan la misma probabilidad es el caso particular de la muestra aleatoria simple.'}},
sa3:{en:{e:'Asking whoever is easy to reach is a convenience sample, not a probability sample, and it may be biased (people passing at noon may not represent everyone).'},
 es:{q:'Una estudiante encuesta a las primeras 50 personas que pasan por Sather Gate al mediodía. Esto es un ejemplo de:', c:['Una muestra aleatoria simple','Una muestra probabilística','Una muestra de conveniencia','Un censo'], e:'Preguntar a quien es fácil de alcanzar es una muestra de conveniencia, no probabilística, y puede tener sesgo (quienes pasan al mediodía quizá no representan a todos).'}},
sa4:{en:{e:'The law of averages: with more independent repetitions, the empirical distribution gets closer to the probability distribution. It is about proportions getting close, not counts becoming exactly equal.'},
 es:{q:'Se lanza un dado justo 10 veces y luego 10,000 veces. ¿Qué afirmación describe mejor la ley de los promedios?', c:['Tras 10,000 lanzamientos, el histograma empírico probablemente se parecerá al de probabilidad (cada cara cerca de 1/6).','Tras 10 lanzamientos, cada cara aparece muy cerca de 1/6 de las veces.','Tras muchos lanzamientos, el número de seises será exactamente igual al de unos.','Los lanzamientos se vuelven menos aleatorios cuanto más se lanza.'], e:'Ley de los promedios: con más repeticiones independientes, la distribución empírica se acerca a la de probabilidad. Se trata de proporciones que se acercan, no de conteos exactamente iguales.'}},
sa5:{en:{e:'Larger samples concentrate the statistic around the parameter: the SD of the sample mean is the population SD / √n. 400/25 = 16 times the sample size makes the width 1/4.'},
 es:{q:'Simulas muchas veces la media muestral con muestras de tamaño 25 y luego con muestras de tamaño 400 (de la misma población). ¿Cómo se comparan las dos distribuciones empíricas de la media muestral?', c:['Ambas se centran cerca de la media poblacional; la de n = 400 es mucho más angosta.','La de n = 400 se centra más lejos de la media poblacional.','Tienen la misma dispersión.','La de n = 400 es más ancha porque hay más datos.'], e:'Las muestras grandes concentran el estadístico alrededor del parámetro: la DE de la media muestral es la DE de la población / √n. Con 16 veces más datos (400/25), el ancho se divide entre 4.'}},
sa6:{en:{p:['Probability distribution: the theoretical chance of each outcome','Empirical distribution: what was actually observed in data or a simulation','Bonus: with more repetitions the empirical distribution approaches the probability distribution (law of averages)'], e:'One is theoretical, the other is what you actually see.'},
 es:{q:'Explica la diferencia entre una distribución de probabilidad y una distribución empírica.', a:'Una distribución de probabilidad da la probabilidad teórica de cada resultado posible de un proceso aleatorio. Una distribución empírica es la de los resultados realmente observados en datos o en una simulación; por la ley de los promedios se acerca a la de probabilidad cuando aumentan las repeticiones.',
 p:['Distribución de probabilidad: la probabilidad teórica de cada resultado','Distribución empírica: lo que realmente se observó en datos o en una simulación','Extra: con más repeticiones, la empírica se acerca a la de probabilidad (ley de los promedios)'], e:'Una es teórica; la otra es lo que realmente se ve.'}},
md1:{en:{e:'The alternative has a direction (toward tails), so use a directional statistic: more tails supports the alternative. Tails − 100 is just a shift, so it works too. Number of heads is small under the alternative. Absolute value and TVD have no direction, so they also grow if the coin favors heads.'},
 es:{q:'Nula: la moneda es justa. Alternativa: la moneda está sesgada hacia CRUZ (tails). 200 lanzamientos. Marca todos los estadísticos para los que valores GRANDES apoyan la alternativa.', c:['Número de cruces','Número de caras','Número de cruces − 100','|Número de cruces − 100|','TVD entre lo observado y (0.5, 0.5)'], e:'La alternativa tiene dirección (hacia cruz), así que se usa un estadístico con dirección: más cruces apoya la alternativa. Cruces − 100 es solo un desplazamiento, también sirve. El número de caras es pequeño bajo la alternativa. El valor absoluto y la TVD no tienen dirección: también crecen si la moneda favorece caras.'}},
md2:{en:{e:'"Not fair" can happen in many ways, so compare the whole categorical distribution with TVD. The sum or a single face\'s proportion catches only some kinds of unfairness (if the chances of 1 and 6 swap, the sum does not change). The number of rolls is fixed, not a statistic.'},
 es:{q:'Nula: el dado de seis caras es justo. Alternativa: el dado NO es justo. ¿Qué estadísticos de prueba son razonables? Marca todos los que correspondan.', c:['La TVD entre las proporciones observadas de cada cara y (1/6, …, 1/6)','La suma de los lanzamientos','La proporción de lanzamientos que salen 1','El número de lanzamientos'], e:'"No justo" puede ocurrir de muchas formas, así que se compara toda la distribución categórica con la TVD. La suma o la proporción de una cara solo detectan algunos tipos de sesgo (si se intercambian las probabilidades del 1 y el 6, la suma no cambia). El número de lanzamientos es fijo, no es un estadístico.'}},
md3:{en:{e:'TVD = ½ × (|0.5−0.4| + |0.3−0.4| + |0.2−0.2|) = ½ × 0.2 = 0.1. Do not forget the ½.'},
 es:{q:'Las proporciones observadas en tres categorías son (0.5, 0.3, 0.2); el modelo dice (0.4, 0.4, 0.2). ¿Cuál es la TVD?', e:'TVD = ½ × (|0.5−0.4| + |0.3−0.4| + |0.2−0.2|) = ½ × 0.2 = 0.1. No olvides el ½.'}},
md4:{en:{e:'Simulate under the null model, using the model\'s 26%, not the observed 8%. C is the bootstrap (for estimating a parameter, not testing a model); D is a permutation test (for comparing two groups).'},
 es:{q:'Un panel de jurado de 100 personas tenía 8 miembros afroamericanos, mientras que la población elegible es 26% afroamericana. Para probar si el panel se eligió al azar de la población, ¿qué deberías simular?', c:['Paneles de 100 con sample_proportions(100, make_array(0.26, 0.74)) muchas veces, registrando cuántos miembros afroamericanos hay.','Paneles de 100 con proporciones (0.08, 0.92).','Remuestrear el panel observado con reemplazo muchas veces.','Barajar las etiquetas de los 100 miembros del panel.'], e:'Se simula bajo el modelo nulo, con el 26% del modelo, no con el 8% observado. C es bootstrap (sirve para estimar un parámetro, no para probar un modelo); D es una prueba de permutación (para comparar dos grupos).'}},
md5:{en:{e:'False. TVD uses absolute values; its minimum is 0 (identical distributions) and its maximum is 1.'},
 es:{q:'Verdadero o falso: La TVD entre dos distribuciones categóricas puede ser negativa si la segunda distribución tiene proporciones más pequeñas.', e:'Falso. La TVD usa valores absolutos; su mínimo es 0 (distribuciones idénticas) y su máximo es 1.'}},
md6:{en:{e:'Each time, sample_proportions(300, model) simulates the proportions from 300 rolls under the null; then TVD = ½ Σ|sim − model|.'},
 es:{q:'Completa el código que simula la TVD bajo la nula de que un dado es justo, con 300 lanzamientos.', e:'Cada vez, sample_proportions(300, model) simula las proporciones de 300 lanzamientos bajo la nula; luego TVD = ½ Σ|sim − model|.'}},
ht1:{en:{e:'A p-value is a conditional probability computed assuming the null is true. It describes how extreme the statistic is, not how likely a hypothesis is. A, C, and D are classic misreadings.'},
 es:{q:'¿Cuál es la mejor definición de valor p (p-value)?', c:['La probabilidad de que la hipótesis nula sea verdadera.','La probabilidad, suponiendo que la nula es verdadera, de obtener un estadístico igual al observado o más extremo en la dirección de la alternativa.','La probabilidad de que la hipótesis alternativa sea verdadera.','La probabilidad de que el resultado observado se deba solo al azar, dados los datos.'], e:'El valor p es una probabilidad condicional calculada suponiendo que la nula es cierta. Describe qué tan extremo es el estadístico, no qué tan probable es una hipótesis. A, C y D son malinterpretaciones clásicas.'}},
ht2:{en:{e:'The null must be a chance model we can simulate: each game won with chance 1/4, independently. A is the alternative; C is a fact about the sample, not a hypothesis; D uses the observed proportion instead of the chance model being tested.'},
 es:{q:'En un juego de aros de una feria, quien lanza al azar debería ganar 1/4 de las veces. Una jugadora gana 9 de 15 juegos. Para probar si gana más de lo que explica el azar, ¿cuál es la hipótesis NULA adecuada?', c:['La jugadora tiene habilidad y gana más de 1/4 de las veces.','La jugadora gana cada juego con probabilidad 1/4, de forma independiente; el número alto de victorias se debe al azar.','La jugadora ganó 9 de 15 juegos.','La jugadora gana cada juego con probabilidad 9/15.'], e:'La nula debe ser un modelo de azar que podamos simular: cada juego con probabilidad 1/4, independiente. A es la alternativa; C es un hecho de la muestra, no una hipótesis; D usa la proporción observada en lugar del modelo que se prueba.'}},
ht3:{en:{e:'p = 0.03 < 0.05, so reject the null; the data favor the alternative. Never say "proven", and the p-value is not the probability that the null is true.'},
 es:{q:'Una prueba da un valor p de 0.03. Con un umbral de 0.05, ¿qué conclusión está bien formulada?', c:['Aceptamos la hipótesis alternativa; está demostrada.','Rechazamos la hipótesis nula; los datos favorecen la alternativa.','Hay un 3% de probabilidad de que la nula sea verdadera.','No rechazamos la hipótesis nula.'], e:'p = 0.03 < 0.05: se rechaza la nula; los datos favorecen la alternativa. Nunca se dice "demostrada", y el valor p no es la probabilidad de que la nula sea cierta.'}},
ht4:{en:{e:'p > cutoff, so fail to reject. The data are consistent with the null, but that does not prove the null is true, so never write "accept the null".'},
 es:{q:'Una prueba da un valor p de 0.12 con un umbral de 5%. ¿Qué debemos concluir?', c:['Aceptamos la hipótesis nula; es verdadera.','No rechazamos la hipótesis nula; los datos son consistentes con la nula.','Rechazamos la hipótesis nula.','La hipótesis alternativa es falsa.'], e:'p > umbral: no se rechaza la nula. Los datos son consistentes con ella, pero eso no prueba que sea cierta, así que nunca se escribe "aceptar la nula".'}},
ht5:{en:{e:'True. That is what the cutoff means: it bounds the chance of a Type I error (rejecting a true null).'},
 es:{q:'Verdadero o falso: Si usamos un umbral de valor p de 5% y la hipótesis nula es en realidad verdadera, hay cerca de un 5% de probabilidad de rechazarla (por error).', e:'Verdadero. Eso significa el umbral: acota la probabilidad de un error de tipo I (rechazar una nula verdadera).'}},
ht6:{en:{e:'Each test has about a 5% chance of wrongly rejecting a true null, so 40 × 0.05 = 2. Run many tests and some will look "significant" by luck.'},
 es:{q:'Un investigador hace 40 pruebas de hipótesis independientes con umbral de 5%. En realidad, la nula es verdadera en las 40. ¿Cuántas pruebas esperaríamos que rechacen la nula?', e:'Cada prueba tiene cerca de 5% de probabilidad de rechazar por error una nula verdadera: 40 × 0.05 = 2. Si haces muchas pruebas, algunas parecerán "significativas" por suerte.'}},
ht7:{en:{e:'p-value = the proportion of simulated statistics equal to the observed value or more extreme in the direction of the alternative. The alternative is "wins more", so use >= 9, including the equal sign.'},
 es:{q:'sim_wins es un array de 10,000 conteos de victorias simulados (de 15) bajo la nula; el conteo observado es 9. La alternativa es que la jugadora gana MÁS de lo que explica el azar. Escribe una expresión para el valor p.', e:'Valor p = proporción de estadísticos simulados iguales al observado o más extremos en la dirección de la alternativa. La alternativa es "gana más", así que se usa >= 9, incluyendo el igual.'}},
ht8:{en:{p:['Null must be a model you can simulate: each customer orders oat milk with chance 0.6 (differences are due to chance)','Alternative has a direction: the chance is less than 0.6','Do not put the sample\'s 52% into a hypothesis; hypotheses are about the population or process'], e:'This is the format the course stresses: the null is a chance model we can simulate under; the alternative is a different view, here in one direction.'},
 es:{q:'Una cafetería dice que el 60% de sus clientes pide leche de avena. Sospechas que la proporción real es MENOR. Observas que 52 de 100 clientes la piden. Escribe una hipótesis nula y una alternativa.', a:'Nula: cada cliente pide leche de avena con probabilidad 0.6, independientemente de los demás; que el 52% difiera del 60% se debe solo al azar. Alternativa: la probabilidad de que un cliente pida leche de avena es menor que 0.6.',
 p:['La nula debe ser un modelo simulable: cada cliente pide avena con probabilidad 0.6 (diferencias por azar)','La alternativa tiene dirección: la probabilidad es menor que 0.6','No pongas el 52% de la muestra en una hipótesis; las hipótesis hablan de la población o del proceso'], e:'Es el formato que insiste el curso: la nula es un modelo de azar que se puede simular; la alternativa es otra visión, aquí en una dirección.'}},
ht9:{en:{e:'A is the correct reading of a p-value ✓; B is a common misreading ✗; 0.001 < 0.01, so reject ✓; statistically significant does not mean a large effect, since with big samples tiny effects can be very significant ✗.'},
 es:{q:'Una prueba sobre si un nuevo programa de tutorías ayuda da p = 0.001. Marca todas las afirmaciones correctas.', c:['Si la nula fuera verdadera, un estadístico así de extremo sería muy poco probable.','Hay un 0.1% de probabilidad de que la nula sea verdadera.','Con umbral de 1%, rechazamos la nula.','El programa de tutorías debe tener un efecto grande.'], e:'A es la lectura correcta del valor p ✓; B es una malinterpretación común ✗; 0.001 < 0.01, se rechaza ✓; significativo no quiere decir efecto grande: con muestras grandes, efectos pequeños pueden ser muy significativos ✗.'}},
ht10:{en:{e:'False. Choose the cutoff before looking at the data. Adjusting it after seeing the result is cheating (p-hacking).'},
 es:{q:'Verdadero o falso: El umbral del valor p debe elegirse después de ver el valor p, para poder ajustarlo a los datos.', e:'Falso. El umbral se elige antes de ver los datos. Ajustarlo después de ver el resultado es hacer trampa (p-hacking).'}},
ht11:{en:{e:'The p-value is the area of the tail starting at the observed value, in the direction of the alternative. C describes how a confidence interval is built, not a p-value.'},
 es:{q:'¿Dónde está el valor p dentro de la distribución empírica de los estadísticos simulados?', c:['En el área de la cola que empieza en el estadístico observado, en la dirección de la alternativa.','En la altura del histograma en el estadístico observado.','En el área entre los percentiles 2.5 y 97.5.','En el centro de la distribución.'], e:'El valor p es el área de la cola que empieza en el valor observado, en la dirección de la alternativa. C describe cómo se arma un intervalo de confianza, no un valor p.'}},
ht12:{en:{p:['A large p-value cannot prove the null','It only means the data are not unusual under the null','Correct wording: fail to reject the null; the data are consistent with the null'], e:'A test can only reject or fail to reject the null. It never proves the null.'},
 es:{q:"Un estudiante escribe: 'El valor p fue 0.20, así que demostramos que la hipótesis nula es verdadera.' Explica qué está mal y reescribe la conclusión correctamente.", a:'Un valor p grande no demuestra la nula; solo indica que los datos observados no son raros bajo la nula. Correcto: como 0.20 está por encima del umbral (por ejemplo 5%), no rechazamos la hipótesis nula; los datos son consistentes con el modelo nulo.',
 p:['Un valor p grande no puede demostrar la nula','Solo indica que los datos no son raros bajo la nula','Formulación correcta: no rechazamos la nula; los datos son consistentes con ella'], e:'Una prueba solo puede rechazar o no rechazar la nula. Nunca la demuestra.'}},
});

addTr({
ab1:{en:{e:'The null says that in the population the two groups have the same distribution and the observed difference is due to chance. B and D talk about the samples, whose means can obviously differ; C is the alternative.'},
 es:{q:'Se compara el peso al nacer de bebés de madres fumadoras y no fumadoras. ¿Cuál es la hipótesis nula correcta para una prueba A/B?', c:['En la población, la distribución del peso al nacer es la misma en ambos grupos; la diferencia observada se debe al azar.','Los pesos promedio de las dos MUESTRAS son iguales.','Fumar reduce el peso al nacer.','La diferencia entre los promedios muestrales es 0.'], e:'La nula dice que en la población ambos grupos tienen la misma distribución y que la diferencia observada se debe al azar. B y D hablan de las muestras, cuyas medias obviamente pueden diferir; C es la alternativa.'}},
ab2:{en:{e:'Under the null the labels are unrelated to the outcomes, so we shuffle the labels (sample(with_replacement=False)). That simulates how big a difference random grouping alone would produce. D is the bootstrap.'},
 es:{q:'En una prueba de permutación, ¿qué barajamos y por qué?', c:['Los valores del resultado, porque los resultados son aleatorios.','Las etiquetas de grupo, porque bajo la nula las etiquetas no influyen en los resultados.','Ambas columnas por separado, para crear datos nuevos.','Las filas, con reemplazo, para estimar un parámetro.'], e:'Bajo la nula las etiquetas no tienen relación con los resultados, así que se barajan las etiquetas (sample(with_replacement=False)). Así se simula qué diferencia produciría solo una agrupación al azar. D es el bootstrap.'}},
ab3:{en:{e:'A permutation reorders all rows without replacement: sample(with_replacement=False). The default sample() draws with replacement, which is the bootstrap.'},
 es:{q:"La tabla births tiene columnas 'Smoker' (bool) y 'Weight'. diff_of_means(tbl) devuelve la diferencia de medias de Weight entre los grupos. Completa el espacio para calcular UN estadístico simulado bajo la nula.", e:'Una permutación reordena todas las filas sin reemplazo: sample(with_replacement=False). El sample() por defecto es con reemplazo, que es el bootstrap.'}},
ab4:{en:{e:'p < 0.01, so reject the null. Because treatment was randomly assigned, once chance is ruled out the difference can be attributed to the treatment, so a causal conclusion is justified.'},
 es:{q:'En un experimento controlado aleatorizado, una prueba de permutación da p = 0.004 para la diferencia de alivio del dolor entre un medicamento y un placebo. Con un umbral de 1%, ¿qué podemos concluir?', c:['Hay una asociación, pero no podemos decir que el medicamento cause la diferencia.','Rechazamos la nula; como el tratamiento se asignó al azar, los datos apoyan que el medicamento causa un mayor alivio.','No rechazamos la nula.','El medicamento funciona para todos los pacientes.'], e:'p < 0.01: se rechaza la nula. Como el tratamiento se asignó al azar, una vez descartado el azar la diferencia se atribuye al tratamiento, así que se justifica una conclusión causal.'}},
ab5:{en:{e:'False. Shuffling keeps each group the same size as in the data, and the groups can have different sizes.'},
 es:{q:'Verdadero o falso: En una prueba A/B, la prueba de permutación requiere que los dos grupos tengan el mismo número de individuos.', e:'Falso. Al barajar, cada grupo mantiene el tamaño que tenía en los datos, y los grupos pueden ser de distinto tamaño.'}},
ab6:{en:{e:'The alternative says B is larger, so larger statistics support it and the tail is >= the observed value. Using the absolute value would be a two-sided test.'},
 es:{q:'El estadístico es (media del grupo B) − (media del grupo A). La alternativa es que el grupo B tiene valores MAYORES. El estadístico observado es 2.1. ¿Qué expresión da el valor p a partir del array sims de estadísticos simulados?', e:'La alternativa dice que B es mayor, así que estadísticos grandes la apoyan y la cola es >= al observado. Usar valor absoluto sería una prueba bilateral.'}},
ab7:{en:{p:['Null: the distribution of time spent is the same under both layouts; differences come from the random assignment','Alternative: the distributions differ (no direction given)','Statistic: absolute difference of the group means (two-sided alternative)'], e:'The alternative says "changes", not "increases", so it is two-sided and the statistic should use an absolute value.'},
 es:{q:'Una empresa prueba si un nuevo diseño del sitio web (B) cambia el tiempo promedio que los usuarios pasan en la página respecto al diseño anterior (A). A cada usuario se le muestra A o B al azar. Escribe las hipótesis nula y alternativa y propone un estadístico de prueba.', a:'Nula: la distribución del tiempo en la página es la misma con ambos diseños; cualquier diferencia observada se debe a la asignación aleatoria. Alternativa: la distribución del tiempo es distinta con los dos diseños (el tiempo promedio difiere). Estadístico: |media de B − media de A| (valor absoluto porque la alternativa no tiene dirección).',
 p:['Nula: la distribución del tiempo es la misma con ambos diseños; las diferencias vienen de la asignación aleatoria','Alternativa: las distribuciones difieren (sin dirección)','Estadístico: diferencia absoluta de las medias (alternativa bilateral)'], e:'La alternativa dice "cambia", no "aumenta", así que es bilateral y el estadístico debe usar valor absoluto.'}},
bs1:{en:{e:'The bootstrap resamples the ORIGINAL SAMPLE with replacement, keeping the same size. Drawing n without replacement just reorders the sample and leaves the statistic unchanged. We cannot draw from the population (A).'},
 es:{q:'¿Cómo se genera un remuestreo bootstrap a partir de una muestra original de tamaño n?', c:['Sacar n individuos de la población.','Sacar n individuos de la muestra original CON reemplazo.','Sacar n individuos de la muestra original SIN reemplazo.','Sacar n/2 individuos de la muestra original con reemplazo.'], e:'El bootstrap remuestrea la MUESTRA ORIGINAL con reemplazo, con el mismo tamaño. Sacar n sin reemplazo solo reordena la muestra y deja el estadístico igual. No podemos sacar de la población (A).'}},
bs2:{en:{e:'The bootstrap resamples the original sample, so its distribution is centered near the original sample statistic, not the population parameter. It estimates variability; it cannot correct bias.'},
 es:{q:'La distribución bootstrap de la mediana muestral suele estar centrada cerca de:', c:['La mediana de la población','La mediana de la muestra original','Cero','La media de la población'], e:'El bootstrap remuestrea la muestra original, así que su distribución se centra cerca del estadístico de la muestra original, no del parámetro. Estima la variabilidad; no corrige el sesgo.'}},
bs3:{en:{e:'The bootstrap works poorly for the maximum or minimum (extreme values not in the sample can never be drawn), for tiny samples, and for non-random samples (it assumes the sample looks like the population). A large random sample for a median is the normal use case.'},
 es:{q:'¿En cuáles de los siguientes casos el bootstrap probablemente funcionaría MAL? Marca todas las correctas.', c:['Estimar la edad máxima de una población','Estimar el ingreso mediano con una muestra aleatoria grande','Estimar la media con una muestra original de tamaño 5','Estimar la media de una población con una muestra de conveniencia grande'], e:'El bootstrap funciona mal para el máximo o el mínimo (los extremos que no están en la muestra nunca salen), con muestras muy pequeñas y con muestras no aleatorias (supone que la muestra se parece a la población). Una muestra aleatoria grande para una mediana es el uso normal.'}},
bs4:{en:{e:'False. More resamples only make the endpoints more stable (less simulation error); the width barely changes. To narrow the interval, increase the ORIGINAL sample size.'},
 es:{q:'Verdadero o falso: Aumentar el número de remuestreos bootstrap de 1,000 a 100,000 hará que el intervalo de confianza del 95% sea bastante más angosto.', e:'Falso. Más remuestreos solo estabilizan los extremos (menos error de simulación); el ancho casi no cambia. Para angostar el intervalo hay que aumentar el tamaño de la muestra ORIGINAL.'}},
bs5:{en:{e:'sample() with no arguments draws as many rows as the table has, with replacement: exactly a bootstrap resample. Then compute the median of the resample.'},
 es:{q:"sample_tbl es una muestra aleatoria grande con una columna 'Rent'. Completa el código para hacer bootstrap de la mediana del alquiler 5,000 veces.", e:'sample() sin argumentos saca tantas filas como tiene la tabla, con reemplazo: justo un remuestreo bootstrap. Luego se calcula la mediana del remuestreo.'}},
bs6:{en:{p:['With replacement, each resample differs, imitating new samples from the population','Drawing the same number without replacement only reorders the sample, so the statistic does not change','Assumption: the original sample is large and random, so it resembles the population'], e:'This is the most common bootstrap concept question.'},
 es:{q:'¿Por qué en el bootstrap remuestreamos CON reemplazo a partir de la muestra original? ¿Qué supuesto clave lo hace razonable?', a:'Remuestrear con reemplazo (del mismo tamaño que la original) produce muestras nuevas distintas de la original, imitando la variación que veríamos si pudiéramos sacar muestras nuevas de la población. Es razonable porque suponemos que la muestra original es grande y aleatoria, así que se parece a la población.',
 p:['Con reemplazo, cada remuestreo es distinto e imita sacar muestras nuevas de la población','Sacar el mismo número sin reemplazo solo reordena la muestra y el estadístico no cambia','Supuesto: la muestra original es grande y aleatoria, así que se parece a la población'], e:'Es la pregunta conceptual de bootstrap más común.'}},
bs7:{en:{e:'For regression inference, resample whole rows to keep (x, y) pairs together. Resampling separately breaks the relationship between x and y; shuffling y is a permutation test of slope = 0.'},
 es:{q:'Para hacer bootstrap de la pendiente de una recta de regresión a partir de una tabla de dispersión, ¿en qué debe consistir cada remuestreo?', c:['Remuestrear los valores de x y los de y por separado, cada uno con reemplazo.','Remuestrear filas completas (pares x, y) con reemplazo.','Barajar los valores de y sin reemplazo.','Remuestrear solo los valores de y con reemplazo y dejar x fija.'], e:'En inferencia de regresión se remuestrean filas completas para mantener los pares (x, y). Remuestrear por separado rompe la relación entre x e y; barajar y es una prueba de permutación de pendiente = 0.'}},
ci1:{en:{e:'The confidence level describes the PROCESS: about 95% of intervals built this way capture the parameter. A is wrong because the parameter is fixed, so a specific interval either contains it or not. B confuses the average with individuals. D confuses bootstrap statistics with the parameter.'},
 es:{q:'Con una muestra aleatoria, un intervalo de confianza del 95% para el tiempo promedio de traslado de los estudiantes de Berkeley es (21.4, 26.8) minutos. ¿Qué interpretación es correcta?', c:['Hay un 95% de probabilidad de que el promedio poblacional esté entre 21.4 y 26.8.','El 95% de los estudiantes de Berkeley tarda entre 21.4 y 26.8 minutos.','Si repitiéramos muchas veces el muestreo y la construcción del intervalo, cerca del 95% de los intervalos contendrían el promedio poblacional.','El 95% de los promedios bootstrap está entre 21.4 y 26.8, así que el promedio poblacional también.'], e:'El nivel de confianza describe el PROCESO: cerca del 95% de los intervalos construidos así capturan el parámetro. A es falsa porque el parámetro es fijo: un intervalo concreto lo contiene o no. B confunde el promedio con los individuos. D confunde los estadísticos bootstrap con el parámetro.'}},
ci2:{en:{e:'False. Once computed, an interval either contains the parameter or it does not; there is no probability left. The confidence level is the success rate of the method.'},
 es:{q:'Verdadero o falso: El nivel de confianza es la probabilidad de que un intervalo ya calculado contenga el parámetro verdadero.', e:'Falso. Una vez calculado, el intervalo contiene el parámetro o no; ya no hay probabilidad. El nivel de confianza es la tasa de éxito del método.'}},
ci3:{en:{e:'True. To be more confident of capturing the parameter you need a wider net, so the interval is wider.'},
 es:{q:'Verdadero o falso: Con todo lo demás igual, un intervalo de confianza del 99% es más ancho que uno del 95%.', e:'Verdadero. Para tener más confianza en capturar el parámetro hay que abrir más la red, así que el intervalo es más ancho.'}},
ci4:{en:{e:'False. Larger samples give more precise estimates and narrower intervals (width roughly ∝ 1/√n).'},
 es:{q:'Verdadero o falso: Con todo lo demás igual, una muestra original más grande produce un intervalo de confianza más ancho.', e:'Falso. Muestras más grandes dan estimaciones más precisas e intervalos más angostos (ancho aproximadamente ∝ 1/√n).'}},
ci5:{en:{e:'Testing with a CI: if the null value is not in the 95% interval, reject the null at the 5% cutoff. This requires a two-sided ("not equal") alternative. A 99% interval matches a 1% cutoff.'},
 es:{q:'Un IC bootstrap del 95% para las horas semanales de estudio promedio es (11.2, 14.5). Nula: el promedio es 15 horas. Alternativa: el promedio no es 15 horas. ¿Cuál es la conclusión con umbral de 5%?', c:['Rechazar la nula, porque 15 no está en el intervalo.','No rechazar la nula, porque 15 está cerca del intervalo.','No rechazar la nula, porque el intervalo no contiene 0.','Un IC no sirve para hacer pruebas.'], e:'Prueba con IC: si el valor de la nula no está en el intervalo del 95%, se rechaza con umbral de 5%. Requiere una alternativa bilateral ("distinto de"). Un intervalo del 99% corresponde a un umbral de 1%.'}},
ci6:{en:{e:'A 90% interval cuts 5% from each side: the 5th and 95th percentiles. A 95% interval uses 2.5 and 97.5.'},
 es:{q:'stats es un array de 10,000 medias muestrales bootstrap. Completa los espacios para calcular un intervalo de confianza del 90%.', e:'Un intervalo del 90% quita 5% de cada lado: percentiles 5 y 95. Uno del 95% usa 2.5 y 97.5.'}},
ci7:{en:{e:'A ✓ (5 and 95 give 90%); B ✗ the interval is about the average, not individuals; C ✓ success rate of the process; D ✓ a 95% interval is wider and contains the 90% one; E ✗ more resamples do not make the estimate more accurate, only the simulation more stable.'},
 es:{q:'Con una muestra aleatoria de 200 estudiantes, las medias bootstrap del tiempo semanal frente a pantallas tienen percentil 5 igual a 21.3 y percentil 95 igual a 26.9 horas. Marca todas las afirmaciones verdaderas.', c:['(21.3, 26.9) es un intervalo de confianza aproximado del 90% para la media poblacional del tiempo frente a pantallas.','Cerca del 90% de los estudiantes tiene entre 21.3 y 26.9 horas frente a pantallas.','Si repitiéramos todo el proceso (muestra nueva + bootstrap) 100 veces, cerca de 90 intervalos contendrían la media poblacional.','Un IC del 95% con el mismo bootstrap contendría tanto 21.3 como 26.9.','Hacer más remuestreos bootstrap haría más exacta la estimación de la media poblacional.'], e:'A ✓ (5 y 95 dan 90%); B ✗ el intervalo es sobre el promedio, no sobre individuos; C ✓ tasa de éxito del proceso; D ✓ un intervalo del 95% es más ancho y contiene al del 90%; E ✗ más remuestreos no hacen más exacta la estimación, solo más estable la simulación.'}},
ci8:{en:{p:['It is about the POPULATION proportion (a parameter), not the sample','Say "95% confident", not "95% probability"','Optionally: the method captures the true value about 95% of the time'], e:'This is where Project answers most often lose points: the subject must be the population parameter, and 95% describes the reliability of the method.'},
 es:{q:'Un intervalo de confianza del 95% para la proporción de californianos que apoyan una política es (0.52, 0.58). Escribe una interpretación correcta en una oración.', a:'Tenemos un 95% de confianza en que la proporción de TODOS los californianos que apoyan la política está entre 0.52 y 0.58, es decir, el intervalo viene de un proceso que captura la proporción verdadera cerca del 95% de las veces.',
 p:['Habla de la proporción de la POBLACIÓN (parámetro), no de la muestra','Di "95% de confianza", no "95% de probabilidad"','Opcional: el método captura el valor verdadero cerca del 95% de las veces'], e:'Aquí se pierden más puntos en los proyectos: el sujeto debe ser el parámetro de la población, y el 95% describe la confiabilidad del método.'}},
ci9:{en:{e:'Each interval independently captures the parameter with chance about 0.95, so both do with chance ≈ 0.95 × 0.95 ≈ 0.9025 (multiplication rule).'},
 es:{q:'Dos investigadores toman muestras aleatorias independientes y cada uno construye un IC del 95% para el mismo parámetro. ¿Cuál es aproximadamente la probabilidad de que AMBOS intervalos contengan el parámetro?', e:'Cada intervalo captura el parámetro, de forma independiente, con probabilidad cercana a 0.95; ambos lo hacen con probabilidad ≈ 0.95 × 0.95 ≈ 0.9025 (regla de multiplicación).'}},
ci10:{en:{e:'Width ∝ 1/√n. Four times the sample size gives √4 = 2, so the width is cut in half.'},
 es:{q:'La investigadora A usa una muestra de 400; el investigador B, una de 100 de la misma población. Ambos construyen IC bootstrap del 95% para la media. ¿Cómo se comparan aproximadamente sus anchos?', c:['El intervalo de A mide cerca de la mitad que el de B.','El intervalo de A mide cerca de una cuarta parte que el de B.','Miden lo mismo.','El intervalo de A mide cerca del doble.'], e:'Ancho ∝ 1/√n. Cuatro veces la muestra da √4 = 2, así que el ancho se reduce a la mitad.'}},
});

addTr({
ce1:{en:{e:'A long right tail pulls the mean to the right, while the median is barely affected by extreme values, so mean > median.'},
 es:{q:'El histograma de ingresos de los hogares de una ciudad tiene una cola larga a la derecha. ¿Cómo se comparan probablemente la media y la mediana?', c:['Media > mediana','Media < mediana','Media = mediana','No se puede saber nada'], e:'Una cola larga a la derecha jala la media hacia la derecha, mientras que a la mediana casi no le afectan los valores extremos, así que media > mediana.'}},
ce2:{en:{e:'7.5 and 16.5 are the average ± 3 SDs (4.5 / 1.5 = 3). The shape is unknown, so use Chebyshev: at least 1 − 1/3² ≈ 88.9%. 99.7% only applies to roughly normal distributions.'},
 es:{q:'Las baterías de un teléfono duran en promedio 12 horas con DE de 1.5 horas. No se sabe nada más de la distribución. ¿Cuál es el porcentaje MÍNIMO de baterías que duran entre 7.5 y 16.5 horas?', c:[null,null,null,null,'Not enough information (no hay suficiente información)'], e:'7.5 y 16.5 son el promedio ± 3 DE (4.5 / 1.5 = 3). La forma es desconocida, así que se usa Chebyshev: al menos 1 − 1/3² ≈ 88.9%. El 99.7% solo aplica a distribuciones aproximadamente normales.'}},
ce3:{en:{e:'False. Chebyshev works for every distribution; that is its value. The price is that it only gives "at least" bounds.'},
 es:{q:'Verdadero o falso: La desigualdad de Chebyshev solo aplica a distribuciones con forma aproximada de campana.', e:'Falso. Chebyshev funciona para cualquier distribución; ese es su valor. El precio es que solo da cotas de "al menos".'}},
ce4:{en:{e:'Multiplying by 3 gives mean 30 and SD 6; adding 5 gives mean 35 and leaves the SD at 6 (adding a constant shifts, it does not spread).'},
 es:{q:'Cada valor de una lista se multiplica por 3 y luego se le suma 5. Si la media original es 10 y la DE es 2, ¿cuáles son la nueva media y la nueva DE?', c:['Media 35, DE 6','Media 35, DE 11','Media 30, DE 6','Media 15, DE 2'], e:'Multiplicar por 3 da media 30 y DE 6; sumar 5 da media 35 y deja la DE en 6 (sumar una constante desplaza, no dispersa).'}},
ce5:{en:{e:'z = (82 − 70) / 8 = 1.5, so the score is 1.5 SDs above average.'},
 es:{q:'Una nota es 82; la media del curso es 70 y la DE es 8. ¿Cuál es la nota en unidades estándar?', e:'z = (82 − 70) / 8 = 1.5, es decir, 1.5 DE por encima del promedio.'}},
ce6:{en:{e:'True. The mean is the balance point, so positive and negative deviations cancel. That is why the SD squares deviations before averaging (root mean square).'},
 es:{q:'Verdadero o falso: El promedio de las desviaciones respecto a la media (valor − media) siempre es 0.', e:'Verdadero. La media es el punto de equilibrio, así que las desviaciones positivas y negativas se cancelan. Por eso la DE eleva al cuadrado antes de promediar (raíz de la media de los cuadrados).'}},
ce7:{en:{e:'SD = root mean square of deviations: compute x − mean, square, average, then take the square root.'},
 es:{q:'Escribe una expresión para la DE del array x usando solo np.mean, np.sqrt y aritmética.', e:'DE = raíz de la media de los cuadrados de las desviaciones: calcula x − media, eleva al cuadrado, promedia y saca raíz.'}},
ce8:{en:{e:'At least 1 − 1/16 is within 4 SDs, so at most 1/16 = 6.25% is outside.'},
 es:{q:'Según Chebyshev, ¿qué porcentaje como MÁXIMO de cualquier lista de números puede estar a 4 DE o más del promedio?', e:'Al menos 1 − 1/16 está a menos de 4 DE, así que como máximo 1/16 = 6.25% queda fuera.'}},
nm1:{en:{e:'The CLT is about the distribution of the sample SUM or AVERAGE. The sample itself looks like the population (possibly skewed), and not every statistic becomes normal (the max does not).'},
 es:{q:'¿Qué afirmación describe correctamente el Teorema Central del Límite (TCL)?', c:['Si la muestra es grande, la distribución de la muestra es aproximadamente normal.','Si la muestra es grande y se saca al azar con reemplazo, la distribución de probabilidad del promedio muestral es aproximadamente normal, sin importar la distribución de la población.','La población se vuelve normal cuando es grande.','Cualquier estadístico calculado con una muestra grande tiene distribución normal.'], e:'El TCL trata de la distribución de la SUMA o el PROMEDIO muestral. La muestra en sí se parece a la población (quizá sesgada), y no todo estadístico se vuelve normal (el máximo no).'}},
nm2:{en:{e:'SD of the sample average = population SD / √n = 20 / 10 = 2.'},
 es:{q:'Una población tiene DE 20. ¿Cuál es la DE del promedio muestral para muestras aleatorias de tamaño 100?', e:'DE del promedio muestral = DE de la población / √n = 20 / 10 = 2.'}},
nm3:{en:{e:'False. A large random sample\'s histogram looks like the POPULATION (incomes are right-skewed, so the sample is too). It is the distribution of the sample average that is roughly normal.'},
 es:{q:'Verdadero o falso: Según el TCL, el histograma de una muestra aleatoria grande de ingresos se verá aproximadamente normal.', e:'Falso. El histograma de una muestra aleatoria grande se parece a la POBLACIÓN (los ingresos están sesgados a la derecha, y la muestra también). Lo que es aproximadamente normal es la distribución del promedio muestral.'}},
nm4:{en:{e:'For a normal curve, about 68% is within ±1 SD, 95% within ±2 SDs, and 99.7% within ±3 SDs. 75% is Chebyshev\'s bound for any distribution.'},
 es:{q:'Para una distribución aproximadamente normal, ¿qué porcentaje aproximado de los valores está a menos de 2 DE de la media?', e:'En una curva normal, cerca del 68% está a ±1 DE, el 95% a ±2 DE y el 99.7% a ±3 DE. El 75% es la cota de Chebyshev para cualquier distribución.'}},
nm5:{en:{e:'Width ≈ 4 × SD / √n ≤ 0.04 → √n ≥ 4 × 0.5 / 0.04 = 50 → n ≥ 2,500. A 0/1 population has SD at most 0.5 (when p = 0.5).'},
 es:{q:'Quieres un IC del 95% para una proporción poblacional con ancho de a lo sumo 0.04. Usando la DE máxima de 0.5 para una población 0/1, ¿qué tamaño de muestra necesitas?', e:'Ancho ≈ 4 × DE / √n ≤ 0.04 → √n ≥ 4 × 0.5 / 0.04 = 50 → n ≥ 2,500. Una población 0/1 tiene DE como máximo 0.5 (cuando p = 0.5).'}},
nm6:{en:{e:'SD ∝ 1/√n. To make it 3 times smaller, √n must triple, so n must be 9 times larger.'},
 es:{q:'Para que la DE del promedio muestral sea 3 veces más pequeña, ¿por qué factor debe crecer el tamaño de la muestra?', e:'DE ∝ 1/√n. Para dividirla entre 3, √n debe triplicarse, así que n debe ser 9 veces mayor.'}},
nm7:{en:{e:'True. SD of the sample average = population SD / √n, and the population size is not in the formula. A sample of 1,000 estimates California or the whole U.S. about equally well.'},
 es:{q:'Verdadero o falso: Para una muestra aleatoria grande, la exactitud del promedio muestral como estimación del promedio poblacional depende sobre todo del tamaño de la muestra, no del de la población.', e:'Verdadero. DE del promedio muestral = DE de la población / √n, y el tamaño de la población no aparece. Una muestra de 1,000 estima California o todo EE. UU. con precisión parecida.'}},
nm8:{en:{e:'For a 0/1 population: mean = p = 0.3 and SD = √(p(1−p)) = √0.21 ≈ 0.46.'},
 es:{q:'Una población tiene 30% de unos y 70% de ceros. ¿Cuál es su DE?', e:'Para una población 0/1: media = p = 0.3 y DE = √(p(1−p)) = √0.21 ≈ 0.46.'}},
nm9:{en:{p:['Cite the CLT: for a large random sample, the sample mean is roughly normal regardless of the population\'s shape','Center: the population average','SD: population SD / √400 = population SD / 20'], e:'Three parts: shape (normal), center (population mean), and width (σ/√n).'},
 es:{q:'La distribución de las duraciones de canciones en una plataforma está sesgada a la derecha. Explica por qué la distribución de la duración PROMEDIO de 400 canciones elegidas al azar sigue teniendo forma de campana, y di dónde se centra y qué tan dispersa es.', a:'Por el Teorema Central del Límite, el promedio de una muestra aleatoria grande (con reemplazo) tiene una distribución aproximadamente normal sin importar la forma de la población. Se centra en la duración promedio de la población y su DE es la DE de la población dividida entre √400 = 20.',
 p:['Citar el TCL: con una muestra aleatoria grande, la media muestral es aproximadamente normal sin importar la forma de la población','Centro: el promedio de la población','DE: DE de la población / √400 = DE de la población / 20'], e:'Tres partes: forma (normal), centro (media poblacional) y ancho (σ/√n).'}},
});

addTr({
co1:{en:{e:'r has no units, does not change with a change of units or when x and y are switched, and lies in [−1, 1]. r = 0 only rules out LINEAR association (the plot could be U-shaped); r measures how tightly points cluster around a line, not the slope.'},
