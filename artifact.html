<meta charset="utf-8">
<title>Data C8 Exam Lab</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;700&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
/* Layout: a setup rail beside an exam "paper"; questions look like bubble-sheet items (circles = one answer, squares = select all). */
:root {
  --paper: #f4f5f1; --card: #ffffff; --ink: #1a2130; --muted: #5b6474; --line: #d8dcd3; --soft: #eceee8;
  --accent: #1f5bbf; --accent-ink: #ffffff; --accent-soft: #e3ebfa; --mark: #ffe27a;
  --good: #19804a; --good-soft: #e1f3e8; --bad: #be3434; --bad-soft: #fae5e3; --warn: #a86a12; --warn-soft: #fbf0d9;
  --f-display: 'Space Grotesk', 'Noto Sans SC', system-ui, sans-serif;
  --f-body: 'IBM Plex Sans', 'Noto Sans SC', system-ui, -apple-system, 'PingFang SC', sans-serif;
  --f-mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #11151c; --card: #191f29; --ink: #e5e8ee; --muted: #9aa3b3; --line: #2c3442; --soft: #212834;
  --accent: #7ea6ff; --accent-ink: #0d1424; --accent-soft: #1f2b45; --mark: #6b5814;
  --good: #57c98a; --good-soft: #15301f; --bad: #ff8a80; --bad-soft: #3a1c1c; --warn: #e8b45a; --warn-soft: #382a10;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --paper: #11151c; --card: #191f29; --ink: #e5e8ee; --muted: #9aa3b3; --line: #2c3442; --soft: #212834;
  --accent: #7ea6ff; --accent-ink: #0d1424; --accent-soft: #1f2b45; --mark: #6b5814;
  --good: #57c98a; --good-soft: #15301f; --bad: #ff8a80; --bad-soft: #3a1c1c; --warn: #e8b45a; --warn-soft: #382a10;
  color-scheme: dark; }
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; }
[hidden] { display: none !important; }
.lang { display: flex; gap: 2px; border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
.lang button { border: 0; background: transparent; border-radius: 999px; padding: 4px 10px; font-size: 13px; font-weight: 500; color: var(--muted); }
.lang button.on { background: var(--ink); color: var(--card); }
body { background: var(--paper); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.55; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--card); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
code, pre { font-family: var(--f-mono); font-size: 0.88em; }
code { background: var(--soft); padding: 1px 5px; border-radius: 4px; }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; }
.wrap { max-width: 1240px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* header */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--card); border-bottom: 1px solid var(--line); }
.top .wrap { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; padding-block: 10px; }
.brand { display: flex; align-items: baseline; gap: 10px; margin-right: auto; }
.brand h1 { font-size: 20px; letter-spacing: -0.01em; }
.brand h1 b { color: var(--accent); }
.brand span { color: var(--muted); font-size: 13px; }
.tabs { display: flex; gap: 4px; background: var(--soft); padding: 4px; border-radius: 999px; }
.tabs a { text-decoration: none; color: var(--muted); padding: 6px 14px; border-radius: 999px; font-size: 14px; font-weight: 500; white-space: nowrap; }
.tabs a.on { background: var(--card); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
.tabs a small { font-size: 11px; opacity: .7; margin-left: 4px; }

main { padding-block: 20px 60px; }
.view[hidden] { display: none !important; }
/* setup screen */
.setup-page { display: grid; gap: 16px; max-width: 1120px; margin: 0 auto; }
.setup-head { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: flex-end; justify-content: space-between; }
.setup-head h2 { font-size: 26px; letter-spacing: -0.01em; }
.setup-head p { margin: 4px 0 0; }
.setup-msg { margin: 0; padding: 10px 14px; border-radius: 8px; background: var(--bad-soft); color: var(--bad); font-size: 14px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 18px 20px; display: grid; gap: 16px; align-content: start; min-width: 0; }
.card-h { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.card-h h3 { font-size: 17px; }
.card-h em { font-style: normal; font-size: 13px; color: var(--muted); }
#topicList { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 250px), 1fr)); gap: 8px 24px; align-items: start; }
.setup-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 380px), 1fr)); gap: 16px; align-items: start; }
.field-group { display: grid; gap: 8px; }
.field-group .hint { margin: 0; }
.ai-box { border-top: 1px dashed var(--line); padding-top: 12px; }
.ai-box summary { cursor: pointer; font-family: var(--f-display); font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.ai-box[open] summary { margin-bottom: 12px; }
.genbar { position: sticky; bottom: 0; z-index: 4; display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between; background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px)); box-shadow: 0 -6px 20px rgba(0,0,0,.06); }
.genbar-text { display: grid; gap: 2px; min-width: 0; }
.genbar-text b { font-size: 14px; font-weight: 600; }
.genbar .primary { padding: 12px 28px; }
/* paper screen */
.paper-page { max-width: 880px; margin: 0 auto; display: grid; gap: 12px; }
.paper-tools { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }

/* setup rail */

.label { font-family: var(--f-display); font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.label em { font-style: normal; text-transform: none; letter-spacing: 0; font-family: var(--f-body); font-weight: 400; }
.quick { display: flex; flex-wrap: wrap; gap: 6px; }
.pill { border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 3px 10px; font-size: 12.5px; color: var(--muted); }
.pill:hover { border-color: var(--accent); color: var(--accent); }
.pill.weak { border-color: var(--warn); color: var(--warn); }
.unit { display: grid; gap: 6px; }
.unit h4 { margin: 4px 0 0; font-size: 12px; color: var(--muted); font-weight: 500; }
.topic { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 8px; border: 1px solid transparent; cursor: pointer; font-size: 14px; line-height: 1.3; }
.topic:hover { background: var(--soft); }
.topic input { accent-color: var(--accent); width: 16px; height: 16px; flex: none; margin: 0; }
.topic .tz { color: var(--muted); font-size: 12px; display: block; }
.topic.on { background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent) 30%, transparent); }
.topic .n { margin-left: auto; font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg button, .chk { border: 1px solid var(--line); background: var(--card); border-radius: 8px; padding: 6px 10px; font-size: 13px; }
.seg button.on, .chk.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.seg button:disabled { opacity: .45; cursor: not-allowed; }
.hint { font-size: 12.5px; color: var(--muted); margin: 0; }
.primary { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 10px; padding: 12px 16px; font-weight: 600; font-size: 15px; font-family: var(--f-display); }
.primary:disabled { opacity: .5; cursor: not-allowed; }
.ghost { background: transparent; border: 1px solid var(--line); border-radius: 8px; padding: 7px 12px; font-size: 13.5px; }
.ghost:hover { border-color: var(--accent); color: var(--accent); }

/* paper */
.paper { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); min-width: 0; }
.paper-head { padding: 22px 26px 16px; border-bottom: 1px dashed var(--line); display: grid; gap: 10px; }
.paper-head h2 { font-size: 24px; letter-spacing: -0.01em; }
.meta { display: flex; flex-wrap: wrap; gap: 8px 18px; color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 12.5px; color: var(--muted); align-items: center; }
.legend i { display: inline-block; width: 13px; height: 13px; border: 1.6px solid var(--muted); vertical-align: -2px; margin-right: 5px; }
.legend i.c { border-radius: 50%; } .legend i.s { border-radius: 2px; }
.status { padding: 12px 26px; font-size: 14px; color: var(--muted); border-bottom: 1px solid var(--line); display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.status.err { color: var(--bad); }
.qs { display: grid; }
.q { padding: 22px 26px; border-bottom: 1px solid var(--line); display: grid; gap: 12px; min-width: 0; }
.q-head { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; font-size: 12.5px; }
.q-num { font-family: var(--f-display); font-weight: 700; font-size: 17px; color: var(--ink); margin-right: 4px; }
.tag { padding: 2px 8px; border-radius: 999px; background: var(--soft); color: var(--muted); }
.tag.kind { background: var(--accent-soft); color: var(--accent); font-weight: 500; }
.tag.ai { background: var(--warn-soft); color: var(--warn); }
.diff { letter-spacing: 2px; color: var(--warn); }
.stem { font-size: 15.5px; max-width: 72ch; }
pre.code { background: var(--soft); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; overflow-x: auto; margin: 0; line-height: 1.5; white-space: pre; }
.opts { display: grid; gap: 6px; max-width: 760px; }
.opt { display: flex; gap: 12px; align-items: flex-start; padding: 8px 10px; border-radius: 8px; border: 1px solid transparent; cursor: pointer; }
.opt:hover { background: var(--soft); }
.opt input { position: absolute; opacity: 0; pointer-events: none; }
.bub { flex: none; width: 24px; height: 24px; border: 1.8px solid var(--muted); display: grid; place-items: center; font-family: var(--f-display); font-size: 12px; font-weight: 600; color: var(--muted); margin-top: 1px; }
.bub.c { border-radius: 50%; } .bub.s { border-radius: 4px; }
.opt input:checked + .bub { background: var(--ink); border-color: var(--ink); color: var(--card); }
.opt input:focus-visible + .bub { outline: 2px solid var(--accent); outline-offset: 2px; }
.opt.is-right { background: var(--good-soft); border-color: color-mix(in srgb, var(--good) 40%, transparent); }
.opt.is-wrong { background: var(--bad-soft); border-color: color-mix(in srgb, var(--bad) 40%, transparent); }
.opt .txt { min-width: 0; overflow-wrap: anywhere; }
.blanks { display: grid; gap: 8px; max-width: 760px; }
.blank { display: grid; grid-template-columns: 70px minmax(0, 1fr); gap: 10px; align-items: center; }
.blank label { font-family: var(--f-mono); font-size: 13px; color: var(--muted); }
.blank input, textarea { width: 100%; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; background: var(--paper); font-family: var(--f-mono); font-size: 13.5px; }
textarea { font-family: var(--f-body); font-size: 14.5px; min-height: 92px; resize: vertical; }
.blank input.ok { border-color: var(--good); background: var(--good-soft); }
.blank input.no { border-color: var(--bad); background: var(--bad-soft); }
.q-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.verdict { font-weight: 600; font-size: 14px; }
.verdict.good { color: var(--good); } .verdict.bad { color: var(--bad); } .verdict.part { color: var(--warn); }
.explain { background: var(--paper); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; display: grid; gap: 8px; font-size: 14.5px; max-width: 80ch; }
.explain .ans { font-weight: 600; }
.explain ul { margin: 0; padding-left: 20px; }
.explain .ai-fb { border-top: 1px dashed var(--line); padding-top: 8px; }
.selfgrade { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; font-size: 13px; color: var(--muted); }
.selfgrade button.on { background: var(--ink); color: var(--card); border-color: var(--ink); }
.submit-bar { position: sticky; bottom: 0; z-index: 3; background: var(--card); border-top: 1px solid var(--line); border-radius: 0 0 var(--r) var(--r); padding: 14px 26px calc(14px + env(safe-area-inset-bottom, 0px)); display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
.results { padding: 22px 26px; border-top: 2px solid var(--ink); display: grid; gap: 14px; }
.score { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.score b { font-family: var(--f-display); font-size: 44px; line-height: 1; font-variant-numeric: tabular-nums; }
.bars { display: grid; gap: 6px; max-width: 620px; }
.bar { display: grid; grid-template-columns: minmax(0, 220px) minmax(0, 1fr) 54px; gap: 10px; align-items: center; font-size: 13px; }
.bar .track { height: 8px; background: var(--soft); border-radius: 99px; overflow: hidden; }
.bar .fill { height: 100%; background: var(--accent); border-radius: 99px; }
.bar .v { text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); }
.empty { padding: 40px 26px; color: var(--muted); text-align: center; }

/* knowledge base */
.kb-tools { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 18px; }
.kb-tools input { flex: 1 1 260px; border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; background: var(--card); }
.kb-topic { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); margin-bottom: 16px; }
.kb-topic > header { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: baseline; padding: 16px 20px; border-bottom: 1px solid var(--line); }
.kb-topic > header h2 { font-size: 19px; }
.kb-topic > header .zh { color: var(--muted); }
.kb-topic > header .lec { font-size: 12px; color: var(--muted); font-family: var(--f-mono); }
.kb-topic > header button { margin-left: auto; }
.kb-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr)); gap: 0; }
.kb-item { padding: 14px 20px; border-bottom: 1px solid var(--line); display: grid; gap: 6px; align-content: start; min-width: 0; }
.kb-item h3 { font-size: 15.5px; font-family: var(--f-display); }
.kb-item .en { font-size: 13.5px; color: var(--muted); }
.kb-item .zh { font-size: 14.5px; }
.kb-item .trap { font-size: 13px; color: var(--bad); }
.kb-item .trap::before { content: attr(data-label); font-weight: 600; }
mark { background: var(--mark); color: inherit; border-radius: 2px; }

/* mistakes */
.mk-head { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 16px; }
.mk-head h2 { font-size: 22px; margin-right: auto; }
.mk-list { display: grid; gap: 10px; }
.mk { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 18px; display: grid; gap: 6px; }
.mk .stem { font-size: 14.5px; }
.mk .meta { font-size: 12px; }

@media (max-width: 560px) {
  .paper-head, .q, .submit-bar, .results, .status { padding-left: 16px; padding-right: 16px; }
  .bar { grid-template-columns: minmax(0, 1fr) 70px 44px; }
  .tabs a small { display: none; }
  .top { position: static; }
  .genbar #poolInfo { display: none; }
  .genbar .primary { flex: 1 1 auto; }
  .card { padding: 16px; }
  .brand span { display: none; }
}
.foot { color: var(--muted); font-size: 12.5px; padding-block: 0 40px; }
/* AI service */
.aipanel { display: grid; gap: 10px; }
.claude-link { display: grid; gap: 2px; text-decoration: none; color: var(--ink); border: 1px solid var(--accent); border-radius: 10px; padding: 10px 12px; background: var(--accent-soft); }
.claude-link b { color: var(--accent); font-size: 14px; }
.claude-link span { font-size: 12.5px; color: var(--muted); }
.field { display: grid; gap: 4px; font-size: 12.5px; color: var(--muted); }
.field input { border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; background: var(--paper); font-family: var(--f-mono); font-size: 13px; width: 100%; }
.check { display: flex; gap: 8px; align-items: center; font-size: 13px; }
.chatflow { display: grid; gap: 10px; width: 100%; color: var(--ink); }
.chatflow ol { margin: 0; padding-left: 20px; display: grid; gap: 8px; }
.chatflow a.ghost { text-decoration: none; color: var(--ink); display: inline-block; margin-left: 4px; }
.chatflow textarea { min-height: 120px; font-family: var(--f-mono); font-size: 12.5px; }
.chatflow details summary { cursor: pointer; color: var(--muted); font-size: 13px; }
/* case studies */
.pill.mock { border-color: var(--accent); color: var(--accent); font-weight: 600; }
.tag.pts { background: transparent; border: 1px solid var(--line); color: var(--ink); font-variant-numeric: tabular-nums; }
.q.case { gap: 14px; background: linear-gradient(var(--card), var(--card)); }
.case-title { font-size: 20px; letter-spacing: -0.01em; }
.case-score { margin-left: auto; font-family: var(--f-display); font-weight: 600; color: var(--accent); font-variant-numeric: tabular-nums; }
.bgbox { background: var(--paper); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; display: grid; gap: 8px; max-width: 80ch; }
.bgbox details summary { cursor: pointer; color: var(--muted); font-size: 13px; }
.bgbox details p { margin: 6px 0 0; font-size: 14px; }
.tbl { overflow-x: auto; max-width: 100%; }
.tbl table { border-collapse: collapse; font-family: var(--f-mono); font-size: 13px; }
.tbl th, .tbl td { padding: 4px 14px 4px 0; text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap; }
.tbl th { font-weight: 500; color: var(--muted); }
.tbl .tname { font-size: 12.5px; margin-bottom: 4px; }
.tbl + .tbl { margin-top: 6px; }
.tbl .more { font-family: var(--f-mono); font-size: 12px; color: var(--muted); padding-top: 4px; }
.cols { margin: 0; padding-left: 20px; font-size: 13.5px; color: var(--muted); display: grid; gap: 2px; max-width: 80ch; }
.parts { display: grid; gap: 0; }
.part { border-top: 1px dashed var(--line); padding: 16px 0 6px; display: grid; gap: 10px; min-width: 0; }
.part-head { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; font-size: 12.5px; }
.part-l { font-family: var(--f-display); font-weight: 700; font-size: 15px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

<header class="top"><div class="wrap">
  <div class="brand"><h1>Data <b>C8</b> Exam Lab</h1><span data-t="brandSub"></span></div>
  <nav class="tabs" aria-label="Sections">
    <a href="#exam" data-view="exam" data-th="tabExam"></a>
    <a href="#paper" data-view="paper" data-th="tabPaper"></a>
    <a href="#concepts" data-view="concepts" data-th="tabConcepts"></a>
    <a href="#mistakes" data-view="mistakes" data-th="tabMistakes"></a>
  </nav>
  <div class="lang" id="langGroup" role="group">
    <button data-lang="zh" lang="zh-CN">中英</button><button data-lang="en" lang="en">English</button><button data-lang="es" lang="es">Español</button>
  </div>
</div></header>

<main class="wrap">
  <section class="view" id="view-exam">
    <div class="setup-page">
      <div class="setup-head">
        <div><h2 data-t="setupTitle"></h2><p class="hint" data-t="setupSub"></p></div>
        <div class="quick">
          <button class="pill mock" data-preset="mock" data-t="pMock"></button>
          <button class="pill weak" data-preset="weak" data-t="pWeak"></button>
          <button class="pill" data-preset="m1" data-t="pM1"></button>
          <button class="pill" data-preset="m2" data-t="pM2"></button>
          <button class="pill" data-preset="fin" data-t="pFin"></button>
          <button class="pill" data-preset="all" data-t="pAll"></button>
          <button class="pill" data-preset="none" data-t="pNone"></button>
        </div>
      </div>
      <p class="setup-msg" id="setupMsg" role="alert" hidden></p>
      <div class="card">
        <div class="card-h"><h3 data-t="topics"></h3><em id="selCount"></em></div>
        <div id="topicList"></div>
      </div>
      <div class="setup-grid">
        <div class="card">
          <div class="card-h"><h3 data-t="qsTitle"></h3></div>

const topicSub = id => LANG === 'zh' ? TOPICS.find(x => x.id === id).zh : '';
const unitName = u => LANG === 'es' ? UNIT_ES[u] : LANG === 'en' ? UNITS[u].en : `${UNITS[u].zh} · ${UNITS[u].en}`;
const kindName = k => LANG === 'zh' ? `${KIND[k].zh} · ${KIND[k].en}` : KIND_L[k][LANG];
const kindShort = k => LANG === 'zh' ? KIND[k].zh : KIND_L[k][LANG];

// Localize a bank question or case (before choices are shuffled). zh returns the original.
function loc(q) {
  if (LANG === 'zh' || q.fromAI) return q;
  const tr = TR[q.id]?.[LANG];
  if (q.k === 'case') {
    const c = {...q, title: tr?.title || q.title, bg: tr?.bg || q.bg, cols: tr?.cols || q.cols, bgzh: undefined};
    c.parts = q.parts.map(p => locPart(p, tr?.parts?.[p.l]));
    if (q.id.startsWith('tfb-')) { c.title = t('tfTitle'); c.bg = t('tfBg'); }
    return c;
  }
  return locPart(q, tr);
}
function locPart(p, tr) {
  if (!tr && TR[p.id]) tr = TR[p.id][LANG]; // T/F block parts are bank questions
  if (!tr) return p;
  const o = {...p};
  if (tr.q) o.q = tr.q;
  if (tr.c) o.c = p.c.map((x, i) => tr.c[i] ?? x);
  if (tr.e) o.e = tr.e;
  if (tr.p) o.p = tr.p;
  if (tr.a && p.k === 'short') o.a = tr.a;
  if (tr.code) o.code = tr.code;
  return o;
}

 q:"In trips, type is either 'member' or 'casual' and day has 7 values. What does trips.pivot('type', 'day') look like?",
 c:['7 rows and 3 columns: day, casual, member; cells are counts','2 rows and 8 columns; cells are counts','7 rows and 2 columns: day and count','14 rows, one per (day, type) pair'], a:0,

{id:'gp5', t:['groups'], k:'mc', d:2,
 q:"The contingency table below was made with pivot from an original table. How many rows and columns did the original table have (assuming it only had the columns needed)?", code:"Year       | Bike | Bus | Walk\nFreshman   |  10  | 25  |  40\nSophomore  |  15  | 20  |  30",
 c:['140 rows, 2 columns','140 rows, 4 columns','2 rows, 3 columns','6 rows, 4 columns'], a:0,
 e:'列联表每个格子都是计数，加起来就是原表的行数：10+25+40+15+20+30 = 140。原表只需要两列：Year 和交通方式。'},
{id:'gp6', t:['groups'], k:'multi', d:3,
 q:"students has columns name and sid; grades has columns id and score. Consider students.join('sid', grades, 'id'). Select all statements that are true.",

 a:[0,1,3], e:'join 只保留能匹配上的行（A ✓）；结果保留第一个表的列名 sid（B ✓）；匹配不上的会消失、一对多会变成多行，所以行数不一定相同（C ✗，D ✓）。'},
{id:'gp7', t:['groups'], k:'code', d:2,
 q:'Fill in the blanks so that busiest evaluates to the day with the most trips.',
 code:"busiest = trips.group([A]).sort([B]).column('day').item(0)", blanks:[{l:'A', acc:["'day'"]},{l:'B', acc:["'count',descending=True"]}],

{id:'gp8', t:['groups'], k:'mc', d:2,
 q:"Which is the best description of the difference between trips.group(['day', 'type']) and trips.pivot('type', 'day')?",
 c:['They contain the same counts; group puts each (day, type) pair in its own row, while pivot puts types in separate columns.','group counts trips; pivot averages durations.','pivot drops days that have no casual riders.','They are identical tables.'], a:0,
 e:'两者都是交叉计数，只是形状不同：group 是“长表”（每个组合一行），pivot 是“宽表”（一个变量的值变成列）。'},

// Part B1: probability, sampling, models, hypothesis testing.
addQ(
{id:'pr1', t:['probability'], k:'mc', d:2,
 q:'A basketball player makes each free throw with chance 0.8, independently. What is the chance they make at least one of 3 free throws?',
 c:['3 × 0.8','1 − 0.2³','0.8³','1 − 0.8³'], a:1,
 e:'“至少一次”= 1 − “一次都没进”。一次都没进的概率是 0.2³，所以答案 1 − 0.2³ = 0.992。1 − 0.8³ 是“至少有一次没进”。'},
{id:'pr2', t:['probability'], k:'mc', d:2,
 q:'A free-throw shooter makes each shot with chance 0.4, independently. What is the chance of making EXACTLY 2 of 4 shots?',
 c:['0.4² × 0.6²','6 × 0.4² × 0.6²','4 × 0.4² × 0.6²','1 − 0.6⁴'], a:1,
 e:'4 次中选 2 次命中，一共有 6 种顺序（HHMM, HMHM, HMMH, MHHM, MHMH, MMHH），每种概率 0.4²×0.6²，相加得 6 × 0.4² × 0.6² ≈ 0.346。'},
{id:'pr3', t:['probability'], k:'mc', d:2,
 q:'A bag has 4 red and 6 blue marbles. Two are drawn at random WITHOUT replacement. What is the chance both are red?',
 c:['(4/10) × (4/10)','(4/10) × (3/9)','(4/10) + (3/9)','2 × (4/10)'], a:1,
 e:'乘法法则 P(A and B) = P(A) × P(B | A)。第一个红 4/10，在第一个是红的条件下剩 3 红 9 个，所以 3/9。'},
{id:'pr4', t:['probability'], k:'tf', d:1,
 q:'True or False: If two events cannot both happen, the chance that one or the other happens is the sum of their chances.',
 a:true, e:'True。这是 addition rule，前提是两件事互斥（mutually exclusive）。'},
{id:'pr5', t:['probability'], k:'mc', d:3,
 q:'A die is rolled 4 times. Which expression is the chance that at least one roll is a six?',
 c:['4/6','1 − (5/6)⁴','(1/6)⁴','1 − (1/6)⁴'], a:1,
 e:'1 − P(没有一次是 6) = 1 − (5/6)⁴ ≈ 0.52。4/6 是常见错误（把概率直接相加，但这些事件不互斥）。'},
);

addQ(
{id:'sa1', t:['sampling'], k:'mc', d:1,
 q:'Researchers want the average height of all 30,000 Berkeley undergrads. They measure 400 randomly sampled students and get an average of 169 cm. Which statement is correct?',
 c:['169 cm is a parameter.','169 cm is a statistic; the average height of all 30,000 undergrads is a parameter.','Both are statistics.','The average of all 30,000 undergrads is random.'], a:1,
 e:'parameter 描述总体，是固定的（通常未知）；statistic 由样本算出，会随样本而变。'},
{id:'sa2', t:['sampling'], k:'tf', d:2,
 q:'True or False: In a probability sample, every individual in the population must have the same chance of being chosen.',
 a:false, e:'False。probability sample 只要求“每种可能的样本被选中的概率是可以计算的”，不要求每个人机会相等。简单随机抽样（SRS）才是每个人机会相等。'},
{id:'sa3', t:['sampling'], k:'mc', d:1,
 q:'A student surveys the first 50 people who walk past Sather Gate at noon. This is an example of:',
 c:['A simple random sample','A probability sample','A convenience sample','A census'], a:2,
 e:'谁方便就问谁，是 convenience sample，不是概率抽样，样本可能有偏（比如中午路过的人群不代表全体）。'},
{id:'sa4', t:['sampling'], k:'mc', d:2,
 q:'A fair die is rolled 10 times and then 10,000 times. Which statement best describes the Law of Averages?',
 c:['After 10,000 rolls, the empirical histogram will probably be close to the probability histogram (each face about 1/6).','After 10 rolls, each face appears very close to 1/6 of the time.','After many rolls, the number of sixes will exactly equal the number of ones.','Rolls become less random the more you roll.'], a:0,
 e:'Law of averages（大数定律）：独立重复次数越多，经验分布越接近理论概率分布。它说的是“比例”接近，不是“次数完全相等”。'},
{id:'sa5', t:['sampling','normal'], k:'mc', d:2,
 q:'You simulate the sample mean many times using samples of size 25, and then again using samples of size 400 (from the same population). How do the two empirical distributions of the sample mean compare?',
 c:['Both are centered near the population mean; the n = 400 one is much narrower.','The n = 400 one is centered further from the population mean.','They have the same spread.','The n = 400 one is wider because there is more data.'], a:0,
 e:'样本越大，统计量越集中在参数附近：SD of sample mean = 总体 SD / √n。400/25 = 16 倍样本量，宽度变成 1/4。'},
{id:'sa6', t:['sampling'], k:'short', d:2,
 q:'Explain the difference between a probability distribution and an empirical distribution.',
 a:'A probability distribution gives the theoretical chance of every possible outcome of a random process. An empirical distribution is the distribution of outcomes actually observed in data or in a simulation; by the law of averages it approaches the probability distribution as the number of repetitions grows.',
 p:['probability distribution：理论上每个结果的概率','empirical distribution：实际观测/模拟得到的结果分布','加分：重复次数越多，经验分布越接近概率分布（law of averages）'],
 e:'一个是“理论”，一个是“实际看到的”。'},
);

addQ(
{id:'md1', t:['models'], k:'multi', d:2,
 q:'Null: the coin is fair. Alternative: the coin is biased toward TAILS. 200 flips. Select all test statistics for which LARGE values support the alternative.',
 c:['Number of tails','Number of heads','Number of tails − 100','|Number of tails − 100|','TVD between observed and (0.5, 0.5)'], a:[0,2],
 e:'备择有方向（偏向反面），要用带方向的统计量：反面数越多越支持备择。反面数 − 50 只是平移，同样可以。正面数是“越小越支持”。绝对值和 TVD 没有方向，偏向正面也会变大，所以不适合单侧备择。'},
{id:'md2', t:['models'], k:'multi', d:2,
 q:'Null: the six-sided die is fair. Alternative: the die is NOT fair. Which test statistics are reasonable? Select all that apply.',
 c:['TVD between the observed proportions of faces and (1/6, …, 1/6)','The sum of the rolls','The proportion of rolls that are 1','The number of rolls'], a:[0],
 e:'“不公平”可以以很多方式出现，需要比较整个类别分布 → TVD。和、单一面的比例只能捕捉某一种偏差（比如 1 和 6 换了概率，和不变）。掷的次数是固定的，不是统计量。'},
{id:'md3', t:['models'], k:'mc', d:2,
 q:'Observed proportions in three categories are (0.5, 0.3, 0.2); the model says (0.4, 0.4, 0.2). What is the TVD?',
 c:['0.1','0.2','0.05','0.3'], a:0, fixed:true,
 e:'TVD = ½ × (|0.5−0.4| + |0.3−0.4| + |0.2−0.2|) = ½ × 0.2 = 0.1。别忘了乘 ½。'},
{id:'md4', t:['models','hyptest'], k:'mc', d:2,
 q:'A jury panel of 100 people had 8 Black members while the eligible population is 26% Black. To test whether the panel was chosen at random from the population, what should you simulate?',
 c:['Draw panels of 100 using sample_proportions(100, make_array(0.26, 0.74)) many times and record the count of Black members.','Draw panels of 100 using proportions (0.08, 0.92).','Resample the observed panel with replacement many times.','Shuffle the labels of the 100 panel members.'], a:0,
 e:'在零假设（模型）下模拟：概率要用模型给的 26%，不是观察到的 8%。C 是 bootstrap（用来估计参数，不是检验模型）；D 是置换检验（比较两组）。'},
{id:'md5', t:['models'], k:'tf', d:1,
 q:'True or False: The TVD between two categorical distributions can be negative if the second distribution has smaller proportions.',
 a:false, e:'False。TVD 用的是绝对值，最小是 0（两个分布完全相同），最大是 1。'},
{id:'md6', t:['models','iteration'], k:'code', d:3,
 q:'Complete the code that simulates the TVD under the null that a die is fair, using 300 rolls.',
 code:"model = make_array(1/6, 1/6, 1/6, 1/6, 1/6, 1/6)\ntvds = make_array()\nfor i in np.arange(5000):\n    sim = [A]\n    tvd = [B]\n    tvds = np.append(tvds, tvd)",
 blanks:[{l:'A', acc:['sample_proportions(300,model)']},{l:'B', acc:['sum(abs(sim-model))/2','np.sum(np.abs(sim-model))/2','0.5*sum(abs(sim-model))','sum(np.abs(sim-model))/2']}],
 e:'每次用 sample_proportions(300, model) 在零假设下模拟 300 次掷骰子的比例，再算 TVD = ½ Σ|sim − model|。'},
);

addQ(
{id:'ht1', t:['hyptest'], k:'mc', d:2,
 q:'Which of the following is the best definition of a p-value?',
 c:['The probability that the null hypothesis is true.','The probability, assuming the null hypothesis is true, of getting a test statistic equal to the observed one or further in the direction of the alternative.','The probability that the alternative hypothesis is true.','The probability that the observed result happened by chance alone, given the data.'], a:1,
 e:'p 值是“在零假设成立的前提下”计算的条件概率，描述的是“数据（统计量）有多极端”，不是“假设为真的概率”。A、C、D 都是经典误解。'},
{id:'ht2', t:['hyptest'], k:'mc', d:2,
 q:'At a carnival ring-toss game, a player who tosses at random should win 1/4 of the time. One player wins 9 of 15 games. To test whether this player wins more often than random tossing would explain, which is the appropriate NULL hypothesis?',
 c:['The player is skilled and wins more often than 1/4 of the time.','The player wins each game with chance 1/4, independently; the high win count is due to chance.','The player won 9 out of 15 games.','The player wins each game with chance 9/15.'], a:1,
 e:'零假设必须是能模拟的明确随机模型：每局 1/4、独立。A 是备择；C 是关于样本的事实，不是假设；D 用了观测比例，不是我们要检验的“机会模型”。'},
{id:'ht3', t:['hyptest'], k:'mc', d:2,
 q:'A test yields a p-value of 0.03. Using a p-value cutoff of 0.05, which conclusion is stated correctly?',
 c:['We accept the alternative hypothesis; it is proven.','We reject the null hypothesis; the data favor the alternative.','There is a 3% chance the null hypothesis is true.','We fail to reject the null hypothesis.'], a:1,
 e:'p = 0.03 < 0.05 → reject the null，数据更支持备择。不能说“证明”(proven)，也不能把 p 值解释为零假设为真的概率。'},
{id:'ht4', t:['hyptest'], k:'mc', d:2,
 q:'A test yields a p-value of 0.12 with a 5% cutoff. What should we conclude?',
 c:['We accept the null hypothesis; it is true.','We fail to reject the null hypothesis; the data are consistent with the null.','We reject the null hypothesis.','The alternative hypothesis is false.'], a:1,
 e:'p > cutoff → fail to reject。数据和零假设一致（consistent），但这不等于证明零假设为真，所以绝对不要写 accept the null。'},
{id:'ht5', t:['hyptest'], k:'tf', d:2,
 q:'True or False: If we use a p-value cutoff of 5% and the null hypothesis is actually true, there is about a 5% chance that we will (incorrectly) reject the null.',
 a:true, e:'True。这就是 cutoff 的含义：它是 Type I error（错误地拒绝了正确的零假设）的概率上限。'},
{id:'ht6', t:['hyptest'], k:'mc', d:3,
 q:'A researcher runs 40 independent hypothesis tests at the 5% cutoff. In fact, the null hypothesis is true in all 40. About how many tests would we expect to reject the null?',
 c:['0','2','5','40'], a:1, fixed:true,
 e:'每个检验在零假设为真时约有 5% 的机会被错误拒绝，40 × 0.05 = 2。这就是“多重检验”的问题：做很多检验，总会有些“显著”只是运气。'},
{id:'ht7', t:['hyptest','iteration'], k:'code', d:2,
 q:'sim_wins is an array of 10,000 simulated win counts (out of 15) under the null; the observed count is 9. The alternative is that the player wins MORE often than chance. Write an expression for the p-value.',
 code:'p_value = [A]', blanks:[{l:'A', acc:['np.count_nonzero(sim_wins>=9)/len(sim_wins)','np.mean(sim_wins>=9)','np.average(sim_wins>=9)','sum(sim_wins>=9)/len(sim_wins)','np.count_nonzero(sim_wins>=9)/10000']}],
 e:'p 值 = 模拟统计量“等于观测值或更极端（朝备择方向）”的比例。备择是“赢得更多”，所以用 >= 9。等号一定要包括。'},
{id:'ht8', t:['hyptest'], k:'short', d:2,
 q:'A coffee shop claims 60% of customers order oat milk. You suspect the true proportion is LOWER. You observe 52 of 100 customers order oat milk. State a null hypothesis and an alternative hypothesis.',
 a:'Null: each customer orders oat milk with chance 0.6, independently of others; the observed 52% differs from 60% only because of chance. Alternative: the chance that a customer orders oat milk is less than 0.6.',
 p:['Null 必须是可模拟的模型：每位顾客点燕麦奶的概率是 0.6（差异来自 chance）','Alternative 带方向：概率小于 0.6','不要把样本里的 52% 写进假设；假设描述的是总体/机制'],
 e:'这是课上反复强调的格式：null = “a chance model we can simulate under”，alternative = “a different view, here in a specific direction”。'},
{id:'ht9', t:['hyptest'], k:'multi', d:3,
 q:'A test of whether a new tutoring program helps gives p = 0.001. Select all statements that are correct.',
 c:['If the null hypothesis were true, a test statistic this extreme would be very unlikely.','There is a 0.1% chance that the null hypothesis is true.','At the 1% cutoff, we reject the null hypothesis.','The tutoring program must have a large effect.'], a:[0,2],
 e:'A 是 p 值的正确解读 ✓；B 是常见误解 ✗；0.001 < 0.01 所以拒绝 ✓；统计显著 ≠ 效应大，样本很大时很小的效应也可以很显著 ✗。'},
{id:'ht10', t:['hyptest'], k:'tf', d:2,
 q:'True or False: The p-value cutoff should be chosen after seeing the p-value, so it can be adjusted to fit the data.',
 a:false, e:'False。cutoff 要在看数据之前定好。看了结果再调 cutoff 等于作弊（p-hacking）。'},
{id:'ht11', t:['hyptest'], k:'mc', d:2,
 q:'Where in the empirical distribution of simulated test statistics is the p-value?',
 c:['The area of the tail starting at the observed statistic, in the direction of the alternative.','The height of the histogram at the observed statistic.','The area between the two 2.5th and 97.5th percentiles.','The center of the distribution.'], a:0,
 e:'p 值 = 从观测值开始、朝备择方向的“尾巴面积”。C 描述的是置信区间的做法，不是 p 值。'},
{id:'ht12', t:['hyptest'], k:'short', d:3,
 q:"A student writes: 'The p-value was 0.20, so we have proven that the null hypothesis is true.' Explain what is wrong and rewrite the conclusion correctly.",
 a:'A large p-value does not prove the null; it only means the observed data are not unusual under the null. Correct: Since 0.20 is above the cutoff (e.g. 5%), we fail to reject the null hypothesis; the data are consistent with the null model.',
 p:['指出：大的 p 值不能“证明”零假设','原因：只是说明在零假设下这样的数据不算罕见','正确写法：fail to reject the null；data are consistent with the null'],
 e:'假设检验只能“拒绝”或“不拒绝”零假设，永远不能证明零假设。'},
);

// Part B2: A/B testing, bootstrap, confidence intervals.
addQ(
{id:'ab1', t:['abtest'], k:'mc', d:2,
 q:'Babies of mothers who smoke and mothers who do not smoke are compared on birth weight. Which is the correct null hypothesis for an A/B test?',
 c:['In the population, the distribution of birth weights is the same for both groups; the observed difference is due to chance.','The average birth weights in the two SAMPLES are equal.','Smoking lowers birth weight.','The difference between the sample averages is 0.'], a:0,
 e:'零假设说的是“总体中两组分布相同，看到的差异只是随机造成的”。B 和 D 说的是样本，样本均值明显可以不同；C 是备择。'},
{id:'ab2', t:['abtest'], k:'mc', d:2,
 q:'In a permutation test, what do we shuffle, and why?',
 c:['The outcome values, because the outcomes are random.','The group labels, because under the null hypothesis the labels make no difference to the outcomes.','Both columns independently, to create new data.','The rows, sampling with replacement, to estimate a parameter.'], a:1,
 e:'零假设下标签和结果无关，所以随机重排标签（sample(with_replacement=False)），这模拟了“如果分组纯属随机，会看到多大的差异”。D 是 bootstrap。'},
{id:'ab3', t:['abtest'], k:'code', d:2,
 q:"The table births has columns 'Smoker' (bool) and 'Weight'. diff_of_means(tbl) returns the difference in mean Weight between the groups. Fill in the blank to compute ONE simulated statistic under the null.",
 code:"shuffled = births.sample([A]).column('Smoker')\nsim = diff_of_means(births.with_column('Shuffled', shuffled).select('Shuffled', 'Weight'))",
 blanks:[{l:'A', acc:['with_replacement=False']}],
 e:'置换（permutation）是不放回地重排所有行：sample(with_replacement=False)。默认的 sample() 是有放回，那是 bootstrap。'},
{id:'ab4', t:['abtest','causality'], k:'mc', d:3,
 q:'In a randomized controlled experiment, a permutation test gives p = 0.004 for the difference in pain relief between a drug and a placebo. With a 1% cutoff, what can we conclude?',
 c:['There is an association, but we cannot say the drug causes the difference.','We reject the null; because treatment was randomly assigned, the data support that the drug causes better pain relief.','We fail to reject the null.','The drug works for every patient.'], a:1,
 e:'p < 0.01 → reject the null。因为是随机分组的实验，排除了运气之后差异可以归因于 treatment，可以下因果结论。'},
{id:'ab5', t:['abtest'], k:'tf', d:2,
 q:'True or False: In an A/B test, a permutation test needs the two groups to have the same number of individuals.',
 a:false, e:'False。打乱标签时，每组的人数保持不变（与原数据一样），两组可以大小不同。'},
{id:'ab6', t:['abtest'], k:'mc', d:3,
 q:'The test statistic is (mean of group B) − (mean of group A). The alternative is that group B has LARGER values. The observed statistic is 2.1. Which gives the p-value from the array sims of simulated statistics?',
 c:['np.mean(sims >= 2.1)','np.mean(sims <= 2.1)','np.mean(abs(sims) >= 2.1)','np.mean(sims == 2.1)'], a:0,
 e:'备择方向是“B 更大”→ 统计量越大越支持备择 → 尾巴是 >= 观测值。用绝对值是双侧检验。'},
{id:'ab7', t:['abtest'], k:'short', d:2,
 q:'A company tests whether a new website layout (B) changes the average time users spend on the page compared to the old layout (A). Users are randomly shown A or B. State the null and alternative hypotheses, and give a test statistic.',
 a:'Null: the distribution of time spent is the same under both layouts; any observed difference is due to the random assignment. Alternative: the distribution of time spent is different under the two layouts (average time differs). Test statistic: |mean time for B − mean time for A| (absolute value since the alternative has no direction).',
 p:['Null：两种布局下停留时间的分布相同，差异来自随机分组','Alternative：分布不同（不说明方向）','统计量：两组平均值之差的绝对值（因为备择是双侧）'],
 e:'备择说“changes”（改变）而不是“increases”（增加），所以是双侧，统计量要用绝对值。'},
);

addQ(
{id:'bs1', t:['bootstrap'], k:'mc', d:1,
 q:'How is a single bootstrap resample generated from an original sample of size n?',
 c:['Draw n individuals from the population.','Draw n individuals from the original sample WITH replacement.','Draw n individuals from the original sample WITHOUT replacement.','Draw n/2 individuals from the original sample with replacement.'], a:1,
 e:'bootstrap = 有放回、同样大小地从“原样本”中重抽。无放回抽 n 个只是把样本重新排列，统计量完全不变。我们拿不到总体，所以 A 不可能。'},
{id:'bs2', t:['bootstrap'], k:'mc', d:2,
 q:'The bootstrap distribution of the sample median is typically centered near:',
 c:['The population median','The median of the original sample','Zero','The population mean'], a:1,
 e:'bootstrap 从原样本里重抽，所以分布中心在原样本的统计量附近，而不在总体参数附近。bootstrap 估计的是“变异程度”，不能修正偏差。'},
{id:'bs3', t:['bootstrap'], k:'multi', d:2,
 q:'For which of the following would the bootstrap be likely to work POORLY? Select all that apply.',
 c:['Estimating the maximum age in a population','Estimating the median income from a large random sample','Estimating the mean from an original sample of size 5','Estimating the mean of a population from a large convenience sample'], a:[0,2,3],
 e:'不适用：估计最大/最小值（样本里没出现的极端值永远抽不到）、原样本太小、样本不是随机的（bootstrap 的前提是原样本像总体）。大的随机样本估计中位数是正常的使用场景。'},
{id:'bs4', t:['bootstrap'], k:'tf', d:2,
 q:'True or False: Increasing the number of bootstrap resamples from 1,000 to 100,000 will make the resulting 95% confidence interval substantially narrower.',
 a:false, e:'False。多重抽几次只会让区间端点更稳定（模拟误差变小），宽度基本不变。想让区间变窄要增大“原样本大小”。'},
{id:'bs5', t:['bootstrap'], k:'code', d:2,
 q:"sample_tbl is a large random sample with a column 'Rent'. Complete the code to bootstrap the median rent 5,000 times.",
 code:"medians = make_array()\nfor i in np.arange(5000):\n    resample = [A]\n    medians = np.append(medians, [B])",
 blanks:[{l:'A', acc:['sample_tbl.sample()','sample_tbl.sample(sample_tbl.num_rows)','sample_tbl.sample(with_replacement=True)']},{l:'B', acc:["np.median(resample.column('Rent'))","percentile(50,resample.column('Rent'))"]}],
 e:'sample() 不带参数就是“有放回地抽和原表一样多的行”，正好是 bootstrap。然后对重抽样本算中位数。'},
{id:'bs6', t:['bootstrap'], k:'short', d:2,
 q:'Why do we resample WITH replacement from the original sample in the bootstrap? What key assumption makes this reasonable?',
 a:'Sampling with replacement (same size as the original) produces new samples that differ from the original, imitating the variability we would see if we could draw new samples from the population. This is reasonable because we assume the original sample is large and random, so it resembles the population.',
 p:['有放回 → 每次重抽结果不同，模拟“从总体重新抽样”的变化','如果无放回抽同样多，只是把原样本重排，统计量不变','前提假设：原样本大且随机，因此像总体'],
 e:'这是 bootstrap 最常考的概念题。'},
{id:'bs7', t:['bootstrap','reginf'], k:'mc', d:3,
 q:'To bootstrap the slope of a regression line from a scatter plot table, what should each resample consist of?',
 c:['Resample the x values and the y values separately, each with replacement.','Resample entire rows (x, y pairs) with replacement.','Shuffle the y values without replacement.','Resample only the y values with replacement and keep x fixed.'], a:1,
 e:'回归推断 bootstrap 要整行重抽，保持 (x, y) 配对。分开重抽会破坏 x 和 y 的关系；打乱 y 是在做“斜率 = 0”的置换检验。'},
);

addQ(
{id:'ci1', t:['ci'], k:'mc', d:2,
 q:'From a random sample, a 95% confidence interval for the average commute time of Berkeley students is (21.4, 26.8) minutes. Which interpretation is correct?',
 c:['There is a 95% chance that the population average is between 21.4 and 26.8.','95% of Berkeley students have commutes between 21.4 and 26.8 minutes.','If we repeated the sampling and interval-building process many times, about 95% of the intervals would contain the population average.','95% of bootstrap sample averages are between 21.4 and 26.8, so the population average is too.'], a:2,
 e:'置信度描述的是“构造区间的过程”：大约 95% 的区间会套住参数。A 错在参数是固定的，不是随机的，一个具体区间要么包含要么不包含；B 混淆了平均数和个体数据；D 混淆了 bootstrap 统计量和参数。'},
{id:'ci2', t:['ci'], k:'tf', d:2,
 q:'True or False: The confidence level refers to the probability that a previously computed interval contains the true parameter.',
 a:false, e:'False。一旦区间算好，它要么包含参数要么不包含，没有概率可言。置信水平指的是“方法”的成功率。'},
{id:'ci3', t:['ci'], k:'tf', d:1,
 q:'True or False: With everything else the same, a 99% confidence interval is wider than a 95% confidence interval.',
 a:true, e:'True。想要更高的把握套住参数，就得把网撒得更大，所以更宽。'},
{id:'ci4', t:['ci','normal'], k:'tf', d:2,
 q:'True or False: With everything else the same, a larger original sample size produces a wider confidence interval.',
 a:false, e:'False。样本越大，估计越准，区间越窄（宽度大约 ∝ 1/√n）。'},
{id:'ci5', t:['ci','hyptest'], k:'mc', d:2,
 q:'A 95% bootstrap CI for the average weekly study hours of students is (11.2, 14.5). Null: the average is 15 hours. Alternative: the average is not 15 hours. What is the conclusion at the 5% cutoff?',
 c:['Reject the null, because 15 is not in the interval.','Fail to reject the null, because 15 is close to the interval.','Fail to reject the null, because the interval does not contain 0.','Cannot use a CI for testing.'], a:0,
 e:'用 CI 做检验：零假设的值不在 95% 区间里 → 在 5% cutoff 下拒绝零假设。这要求备择是双侧（“不等于”）。99% 区间对应 1% cutoff。'},
{id:'ci6', t:['ci','bootstrap'], k:'code', d:1,
 q:'stats is an array of 10,000 bootstrapped sample means. Fill in the blanks to compute a 90% confidence interval.',
 code:'left = percentile([A], stats)\nright = percentile([B], stats)', blanks:[{l:'A', acc:['5']},{l:'B', acc:['95']}],
 e:'90% 区间去掉两边各 5%：第 5 和第 95 百分位数。95% 区间是 2.5 和 97.5。'},
{id:'ci7', t:['ci','bootstrap'], k:'multi', d:3,
 q:'From a random sample of 200 students, the bootstrapped sample means of weekly screen time have 5th percentile 21.3 and 95th percentile 26.9 hours. Select all statements that are true.',
 c:['(21.3, 26.9) is an approximate 90% confidence interval for the population mean screen time.','About 90% of individual students have screen times between 21.3 and 26.9 hours.','If we repeated the whole process (new sample + bootstrap) 100 times, about 90 of the intervals would contain the population mean.','A 95% CI from the same bootstrap would contain both 21.3 and 26.9.','Doing more bootstrap resamples would make the estimate of the population mean more accurate.'],
 a:[0,2,3], e:'A ✓（5 和 95 → 90%）；B ✗ 区间是关于“平均值”的，不是个体；C ✓ 过程的成功率；D ✓ 95% 区间更宽，包含 90% 区间；E ✗ 增加重抽次数不会让估计更准，只会让模拟更稳定。'},
{id:'ci8', t:['ci'], k:'short', d:2,
 q:'A 95% confidence interval for the proportion of Californians who support a policy is (0.52, 0.58). Write a correct one-sentence interpretation.',
 a:'We are 95% confident that the proportion of ALL Californians who support the policy is between 0.52 and 0.58, meaning that this interval came from a process that captures the true proportion about 95% of the time.',
 p:['说的是“总体”比例（parameter），不是样本','用 “95% confident” 而不是 “95% probability”','可以解释为：构造方法在约 95% 的情况下会套住真实值'],
 e:'这是 Project 里最常扣分的地方：主语必须是总体参数，95% 描述的是方法的可靠性。'},
{id:'ci9', t:['ci'], k:'mc', d:3,
 q:'Two researchers each take independent random samples and build 95% CIs for the same parameter. What is the chance that BOTH intervals contain the parameter (approximately)?',
 c:['0.95','0.95² ≈ 0.90','0.05','1'], a:1, fixed:true,
 e:'每个区间独立地约有 0.95 的机会套住参数，两者都套住 ≈ 0.95 × 0.95 ≈ 0.9025（乘法法则）。'},
{id:'ci10', t:['ci','bootstrap'], k:'mc', d:2,
 q:'Researcher A uses a sample of 400; researcher B uses a sample of 100 from the same population. Both make 95% bootstrap CIs for the mean. About how do their widths compare?',
 c:["A's interval is about half as wide as B's.","A's interval is about one quarter as wide as B's.",'They are the same width.',"A's interval is about twice as wide."], a:0,
 e:'宽度 ∝ 1/√n。样本量变 4 倍，√4 = 2，宽度变成一半。'},
);

addQ(
{id:'ce1', t:['center'], k:'mc', d:1,
 q:'The histogram of household incomes in a city has a long right tail. How do the mean and median most likely compare?',
 c:['Mean > median','Mean < median','Mean = median','Cannot be determined at all'], a:0, fixed:true,
 e:'右侧长尾会把平均数往右拉，而中位数不太受极端值影响，所以 mean > median。'},
{id:'ce2', t:['center'], k:'mc', d:2,
 q:'Phone batteries last an average of 12 hours with SD 1.5 hours. Nothing else is known about the distribution. What is the MINIMUM percent of batteries lasting between 7.5 and 16.5 hours?',
 c:['75%','88.9%','95%','99.7%','Not enough information'], a:1, fixed:true,
 e:'7.5 和 16.5 都是平均 ± 3 SD（4.5 / 1.5 = 3）。不知道分布形状 → 用 Chebyshev：至少 1 − 1/3² ≈ 88.9%。99.7% 只在分布近似正态时成立。'},
{id:'ce3', t:['center'], k:'tf', d:2,
 q:"True or False: Chebyshev's inequality only applies to distributions that are roughly bell-shaped.",
 a:false, e:'False。Chebyshev 对任何分布都成立，这是它的价值；代价是只给出“至少”这样的下界。'},
{id:'ce4', t:['center'], k:'mc', d:2,
 q:'Every value in a list is multiplied by 3 and then 5 is added. If the original mean is 10 and SD is 2, what are the new mean and SD?',
 c:['Mean 35, SD 6','Mean 35, SD 11','Mean 30, SD 6','Mean 15, SD 2'], a:0,
 e:'乘 3：平均 30、SD 6；再加 5：平均 35，SD 不变（加常数只平移，不改变离散程度）。'},
{id:'ce5', t:['center'], k:'mc', d:1,
 q:'A score is 82; the class mean is 70 and SD is 8. What is the score in standard units?',
 c:['1.5','12','−1.5','0.15'], a:0, fixed:true,
 e:'z = (82 − 70) / 8 = 1.5，即比平均高 1.5 个 SD。'},
{id:'ce6', t:['center'], k:'tf', d:1,
 q:'True or False: The average of the deviations from the mean (value − mean) is always 0.',
 a:true, e:'True。平均数是“平衡点”，正负偏差正好抵消。所以 SD 要先平方再平均再开根（root mean square）。'},
{id:'ce7', t:['center'], k:'code', d:2,
 q:'Write an expression for the SD of the array x using only np.mean, np.sqrt, and arithmetic.',
 code:'sd = [A]', blanks:[{l:'A', acc:['np.sqrt(np.mean((x-np.mean(x))**2))']}],
 e:'SD = root mean square of deviations：先算偏差 x − mean，平方，求平均，开根号。'},
{id:'ce8', t:['center'], k:'mc', d:3,
 q:'By Chebyshev, at MOST what percent of any list of numbers can be 4 or more SDs away from the average?',
 c:['1/16 = 6.25%','1/4 = 25%','5%','0.27%'], a:0, fixed:true,
 e:'至少 1 − 1/16 在 4 个 SD 之内，所以最多 1/16 = 6.25% 在外面。'},
);

addQ(
{id:'nm1', t:['normal'], k:'mc', d:2,
 q:'Which statement correctly describes the Central Limit Theorem?',
 c:['If the sample is large, the distribution of the sample is roughly normal.','If the sample is large and drawn at random with replacement, the probability distribution of the sample average is roughly normal, regardless of the population distribution.','The population becomes normal when it is large.','Any statistic computed from a large sample has a normal distribution.'], a:1,
 e:'CLT 说的是“样本和/样本均值的分布”近似正态。样本本身长得像总体（可能是偏的）；也不是任何统计量都正态（例如 max）。'},
{id:'nm2', t:['normal'], k:'mc', d:2,
 q:'A population has SD 20. What is the SD of the sample average for random samples of size 100?',
 c:['20','2','0.2','200'], a:1, fixed:true,
 e:'SD of sample average = 总体 SD / √n = 20 / 10 = 2。'},
{id:'nm3', t:['normal'], k:'tf', d:2,
 q:'True or False: According to the CLT, a histogram of a large random sample of incomes will look roughly normal.',
 a:false, e:'False。大随机样本的直方图会像“总体”的分布（收入右偏，样本也右偏）。是“样本均值”的分布近似正态。'},
{id:'nm4', t:['normal'], k:'mc', d:1,
 q:'For a roughly normal distribution, about what percent of values are within 2 SDs of the mean?',
 c:['68%','75%','95%','99.7%'], a:2, fixed:true,
 e:'正态：±1 SD ≈ 68%，±2 SD ≈ 95%，±3 SD ≈ 99.7%。75% 是 Chebyshev 对任何分布的下界。'},
{id:'nm5', t:['normal'], k:'mc', d:3,
 q:'You want a 95% CI for a population proportion with width at most 0.04. Using the worst-case SD of 0.5 for a 0/1 population, how large a sample do you need?',
 c:['625','2,500','10,000','50'], a:1, fixed:true,
 e:'宽度 ≈ 4 × SD / √n ≤ 0.04 → √n ≥ 4 × 0.5 / 0.04 = 50 → n ≥ 2,500。0/1 总体的 SD 最大是 0.5（p = 0.5 时）。'},
{id:'nm6', t:['normal'], k:'mc', d:2,
 q:'To make the SD of the sample average 3 times smaller, by what factor must the sample size increase?',
 c:['3','6','9','√3'], a:2, fixed:true,
 e:'SD ∝ 1/√n。要缩小 3 倍，√n 要变成 3 倍，n 要变成 9 倍。'},
{id:'nm7', t:['normal'], k:'tf', d:2,
 q:'True or False: For a large random sample, the accuracy of the sample average as an estimate of the population average depends mainly on the sample size, not on the population size.',
 a:true, e:'True。SD of sample average = 总体 SD / √n，公式里没有总体大小。抽 1,000 人估计加州和估计全美，精度差不多。'},
{id:'nm8', t:['normal','center'], k:'mc', d:2,
 q:'A population is 30% ones and 70% zeros. What is its SD?',
 c:['√(0.3 × 0.7) ≈ 0.46','0.3','0.21','0.5'], a:0,
 e:'0/1 总体：均值 = p = 0.3，SD = √(p(1−p)) = √0.21 ≈ 0.46。'},
{id:'nm9', t:['normal'], k:'short', d:3,
 q:'The distribution of individual song lengths on a platform is right-skewed. Explain why the distribution of the AVERAGE length of 400 randomly chosen songs is still roughly bell-shaped, and say where it is centered and how spread out it is.',
 a:'By the Central Limit Theorem, the average of a large random sample (drawn with replacement) has a roughly normal distribution regardless of the shape of the population. It is centered at the population average song length and its SD is the population SD divided by √400 = 20.',
 p:['引用 CLT：大样本随机抽样，样本均值近似正态，不管总体形状','中心：总体平均','SD：总体 SD / √400 = 总体 SD / 20'],
 e:'三要素：形状（正态）、中心（总体均值）、宽度（σ/√n）。'},
);

addQ(
{id:'co1', t:['correlation'], k:'multi', d:2,
 q:'Select all statements about the correlation coefficient r that are true.',
 c:['r is unchanged if x is converted from inches to centimeters.','r is unchanged if x and y are switched.','r = 0 means there is no association of any kind between x and y.','r measures how steep the scatter plot is.','r is always between −1 and 1.'], a:[0,1,4],
 e:'r 没有单位、换单位不变、互换 x/y 不变、在 [−1, 1] 之间。r = 0 只说明没有“线性”关联（可能是 U 形）；r 衡量的是点“聚集在一条直线附近”的程度，不是斜率。'},
{id:'co2', t:['correlation'], k:'code', d:2,
 q:'Complete the function that computes the correlation coefficient of two columns of table t.',
 code:"def standard_units(arr):\n    return (arr - np.mean(arr)) / np.std(arr)\n\ndef correlation(t, x, y):\n    return [A]",
 blanks:[{l:'A', acc:['np.mean(standard_units(t.column(x))*standard_units(t.column(y)))','np.average(standard_units(t.column(x))*standard_units(t.column(y)))']}],
 e:'r = 两个变量在标准单位下乘积的平均值。'},
{id:'co3', t:['correlation','causality'], k:'mc', d:2,
 q:'Across U.S. cities, the number of coffee shops and the number of violent crimes have r = 0.85. What is the best explanation?',

 e:'相关不等于因果。城市人口越多，咖啡店和犯罪数都越多，人口是 confounder。'},
{id:'co4', t:['correlation'], k:'tf', d:2,
 q:'True or False: If a scatter plot shows a perfect U-shaped curve, its correlation coefficient could be close to 0.',
 a:true, e:'True。r 只衡量线性关系；对称的 U 形，左右两边的正负趋势会互相抵消，r ≈ 0，但关联很强。'},
{id:'co5', t:['correlation'], k:'mc', d:3,
 q:'Researchers compute the correlation between average income and average test score using one point per STATE. Compared with the correlation computed using one point per STUDENT, the state-level correlation is likely to be:',
 c:['Stronger (closer to ±1)','Weaker','Exactly the same','Always 0'], a:0, fixed:true,
 e:'用平均值计算的相关（ecological correlation）会去掉个体之间的变化，点更集中在直线附近，通常会夸大关系的强度。'},
);

addQ(
{id:'rg1', t:['regression'], k:'mc', d:2,
 q:'Which quantities are needed to compute the slope of the regression line in ORIGINAL units?',
 c:['r, SD of x, SD of y','r, mean of x, mean of y','r only','SD of x, SD of y, mean of x, mean of y'], a:0,

{id:'rg2', t:['regression'], k:'mc', d:2,
 q:'In standard units, the regression line for predicting y from x is:',
 c:['y = x','y = r × x','y = x / r','y = r × x + mean(y)'], a:1, e:'标准单位下：预测 y = r × x（过原点，斜率 r）。'},
{id:'rg3', t:['regression'], k:'tf', d:1,
 q:'True or False: If x equals the average of x, the regression line predicts the average of y.',
 a:true, e:'True。回归线一定经过 (mean x, mean y)：在标准单位下 x = 0 时预测 0。'},
{id:'rg4', t:['regression'], k:'mc', d:2,
 q:'Heights of fathers and sons have r = 0.5. A father is 2 SDs above average height. What is the predicted height of his son, in standard units?',
 c:['2','1','0.5','4'], a:1, fixed:true,
 e:'预测 = r × x = 0.5 × 2 = 1 个 SD。这就是 regression to the mean：预测值比 x 更靠近平均。'},
{id:'rg5', t:['regression'], k:'mc', d:2,
 q:'In what sense is the regression line the "best" line?',
 c:['It goes through the most points.','Among all straight lines, it has the smallest root mean squared error of prediction.','It has the smallest residuals for every point.','It has slope equal to 1 in standard units.'], a:1,
 e:'least squares：在所有直线中，回归线让 RMSE（均方误差）最小。不是每个点的残差都最小。'},
{id:'rg6', t:['regression'], k:'code', d:2,
 q:'actual and predicted are arrays of the same length. Write an expression for the root mean squared error.',
 code:'rmse = [A]', blanks:[{l:'A', acc:['np.sqrt(np.mean((actual-predicted)**2))','np.sqrt(np.mean((predicted-actual)**2))','np.sqrt(np.average((actual-predicted)**2))']}],
 e:'RMSE：误差 → 平方 → 平均 → 开根。'},
{id:'rg7', t:['regression'], k:'code', d:3,
 q:"Complete the code to find the least-squares slope and intercept for predicting 'y' from 'x' in table t using minimize.",
 code:"def mse(slope, intercept):\n    x = t.column('x')\n    y = t.column('y')\n    fitted = [A]\n    return np.mean((y - fitted) ** 2)\n\nbest = minimize([B])",

 e:'mse 函数接收参数，返回误差。minimize(mse) 传的是函数本身（不加括号），返回让误差最小的参数数组。'},
{id:'rg8', t:['regression'], k:'short', d:2,
 q:'A multiple regression model predicts apartment rent as: rent = 2.1 × sqft + 150 × bedrooms − 40 × miles_to_campus + 300. Interpret the coefficient −40 in one sentence.',
 a:'Holding square footage and number of bedrooms fixed, each additional mile from campus is associated with a predicted rent that is $40 lower.',
 p:['“其他变量不变” (holding other variables fixed)','每多 1 英里','预测租金低 40 美元','用 “associated with / predicted” 而不是因果语言'],

{id:'cs-library', k:'case', d:3, title:'Library Late Returns', t:['models','hyptest','iteration'],
 bg:'The library claims that late returns fall into four categories in these proportions: Books 0.55, Laptops 0.10, Chargers 0.15, Room keys 0.20. A student auditor selects 400 late returns at random from this semester\'s records and finds the proportions Books 0.48, Laptops 0.17, Chargers 0.15, Room keys 0.20.',
 bgzh:'图书馆声称逾期归还物品按四类比例分布（书 0.55、笔记本电脑 0.10、充电器 0.15、房间钥匙 0.20）。学生随机抽查 400 条逾期记录，观察到的比例是 0.48、0.17、0.15、0.20。',
 code:'model = make_array(0.55, 0.10, 0.15, 0.20)\nobserved = make_array(0.48, 0.17, 0.15, 0.20)',
 parts:[
 {l:'a', pts:3, k:'multi', q:'Select ALL correct statements of the null hypothesis.', c:['The 400 late returns are like a random sample from a population with category proportions 0.55, 0.10, 0.15, 0.20; differences from these are due to chance.','The observed proportions equal the model proportions.','Each late return independently falls into the four categories with chances 0.55, 0.10, 0.15, 0.20.','Each late return independently falls into the four categories with chances 0.48, 0.17, 0.15, 0.20.','Laptops are returned late more often than the library claims.'], a:[0,2],
  e:'零假设是可以模拟的机会模型，用的是“图书馆声称”的比例（A、C）。B 是关于样本的说法，而样本显然不相等；D 用了观测比例；E 是备择方向。'},
 {l:'b', pts:2, k:'mc', q:'With TVD as the test statistic, which is the appropriate alternative hypothesis?', c:["The distribution of late returns across categories is different from the library's model.","The sample proportions differ from the model proportions.","Laptops are returned late more often than 10% of the time.","The library's model is correct."], a:0,
  e:'TVD 不带方向，对应“分布不同”的备择。B 说的是样本（这显然成立，不需要检验）；C 是单方向的说法，和 TVD 不匹配；D 是零假设。'},
 {l:'c', pts:3, k:'code', q:'Write an expression for the observed value of the test statistic.', code:'obs_tvd = [A]', blanks:[{l:'A', acc:['sum(abs(observed-model))/2','np.sum(np.abs(observed-model))/2','sum(np.abs(observed-model))/2','0.5*sum(abs(observed-model))']}],
  e:'TVD = ½ × Σ|observed − model|。'},
 {l:'d', pts:2, k:'mc', q:'What is the value of obs_tvd?', c:['0.07','0.14','0','0.035'], a:0, fixed:true, e:'|−0.07| + |0.07| + 0 + 0 = 0.14，乘 ½ 得 0.07。'},
 {l:'e', pts:4, k:'code', t:['iteration','models'], q:'Complete simulate_one so it returns one simulated TVD under the null hypothesis.', code:'def simulate_one():\n    sim = [A]\n    return [B]',
  blanks:[{l:'A', acc:['sample_proportions(400,model)']},{l:'B', acc:['sum(abs(sim-model))/2','np.sum(np.abs(sim-model))/2','sum(np.abs(sim-model))/2','0.5*sum(abs(sim-model))']}],
  e:'在零假设下用 model 的比例模拟 400 条记录，再和 model 比较算 TVD。注意比较的对象是 model，不是 observed。'},
 {l:'f', pts:3, k:'code', q:'tvds is an array of 10,000 simulated TVDs. Write an expression for the p-value.', code:'p_value = [A]', blanks:[{l:'A', acc:['np.mean(tvds>=obs_tvd)','np.count_nonzero(tvds>=obs_tvd)/10000','np.count_nonzero(tvds>=obs_tvd)/len(tvds)','np.average(tvds>=obs_tvd)','sum(tvds>=obs_tvd)/len(tvds)']}],
  e:'TVD 越大越支持备择，所以 p 值 = 模拟 TVD ≥ 观测值的比例（包括等号）。'},

  e:'单侧备择用带方向的统计量：App − Control 越大越支持备择。绝对值是双侧的；C 的方向写反了；TVD 用于类别分布。'},
 {l:'d', pts:4, k:'code', t:['abtest'], q:'Complete the code that computes ONE simulated value of the statistic under the null hypothesis. (Note that "App" comes before "Control" alphabetically.)', code:"shuffled = sleep.sample([A]).column('group')\nsim_tbl = sleep.with_column('Shuffled', shuffled)\nmeans = sim_tbl.select([B]).group('Shuffled', np.mean).column('change mean')\nsim_stat = [C]",
  blanks:[{l:'A', acc:['with_replacement=False']},{l:'B', acc:["'Shuffled','change'"]},{l:'C', acc:['means.item(0)-means.item(1)']}],
  e:'置换：不放回打乱标签；只保留新标签和结果两列再 group；group 结果按字母排序，App 在前，所以 item(0) − item(1) 就是 App − Control。'},
 {l:'e', pts:3, k:'code', t:['hyptest'], q:'sims is an array of 10,000 simulated statistics. Write an expression for the p-value.', code:'p_value = [A]', blanks:[{l:'A', acc:['np.mean(sims>=8.5)','np.count_nonzero(sims>=8.5)/10000','np.count_nonzero(sims>=8.5)/len(sims)','np.average(sims>=8.5)','sum(sims>=8.5)/len(sims)']}],
  e:'方向是“App 更大”，所以算模拟值 ≥ 8.5 的比例。'},
 {l:'f', pts:3, k:'mc', t:['hyptest','causality'], q:'The p-value is 0.012 and the cutoff is 5%. Which conclusion is best?', c:['Reject the null; because treatment was randomly assigned, the data support that the wind-down app caused more sleep, on average, for these volunteers.','There is an association, but we cannot say anything about causation.','The app increases sleep for every adult in the United States.','Fail to reject the null; the data are consistent with no effect.'], a:0,
  e:'p < 0.05 → reject。随机分组的实验可以下因果结论（A）。但志愿者不是全美成年人的随机样本，所以不能直接推广到所有人（C 错）。'},
 {l:'g', pts:3, k:'short', t:['causality','sampling'], q:'A news article says: "App adds 8.5 minutes of sleep for all college students." Explain one problem with this claim.',
  a:'The subjects were volunteers, not a random sample of all college students, so the result may not generalize to all students. Also, 8.5 minutes is the difference in AVERAGE change in this experiment; it is an estimate with uncertainty, not a guaranteed effect for each student.',
  p:['志愿者不是所有大学生的随机样本 → 不能直接推广','8.5 是这次实验的平均差异，有不确定性','不是每个学生都会增加 8.5 分钟'],
  e:'因果结论成立的范围是“这批受试者”；推广到总体需要随机抽样。'},
 ]},

{id:'cs-rent', k:'case', d:2, title:'Off-Campus Rent Survey', t:['bootstrap','ci','normal'],
 bg:'The student government surveys a simple random sample of 500 students who live off campus and records each student\'s monthly rent in dollars in the one-column table rents (column Rent). The sample median is $1,450, the sample mean is $1,520, and the sample SD is $410.',
 bgzh:'学生会随机抽取 500 名校外住宿的学生，记录每月房租（表 rents，列 Rent）。样本中位数 1,450 美元，均值 1,520，标准差 410。',
 table:{cols:['Rent'], rows:[['1325'],['1890'],['1100'],['2450'],['1475']], more:495},
 cols:['Rent (int): monthly rent in dollars'],
 parts:[
 {l:'a', pts:2, k:'mc', t:['sampling','bootstrap'], q:'The survey team wants to estimate a parameter using the sample median. Which parameter?', c:['The median monthly rent of all students who live off campus','The median rent of the 500 surveyed students','The median of the bootstrap medians','The mean rent of all students'], a:0,
  e:'parameter 描述总体：所有校外住宿学生的租金中位数。样本中位数是用来估计它的 statistic。'},
 {l:'b', pts:4, k:'code', t:['bootstrap'], q:'Complete the code to bootstrap the median rent 5,000 times.', code:"medians = make_array()\nfor i in np.arange(5000):\n    resample = [A]\n    medians = np.append(medians, [B])",
  blanks:[{l:'A', acc:['rents.sample()','rents.sample(500)','rents.sample(rents.num_rows)','rents.sample(with_replacement=True)']},{l:'B', acc:["np.median(resample.column('Rent'))","percentile(50,resample.column('Rent'))"]}],
  e:'sample() 默认有放回、行数等于原表，正好是 bootstrap。每次算重抽样本的中位数。'},
 {l:'c', pts:2, k:'code', t:['ci'], q:'Fill in the blanks to compute a 95% confidence interval.', code:'ci = make_array(percentile([A], medians), percentile([B], medians))', blanks:[{l:'A', acc:['2.5']},{l:'B', acc:['97.5']}],
  e:'95% 区间去掉两侧各 2.5%。'},
 {l:'d', pts:3, k:'multi', t:['ci','bootstrap'], q:'The interval is ($1,410, $1,495). Select ALL correct statements.', c:['We are 95% confident that the median rent of all off-campus students is between $1,410 and $1,495.','About 95% of off-campus students pay between $1,410 and $1,495.','If the survey and bootstrap were repeated many times, about 95% of the resulting intervals would contain the population median.','There is a 95% probability that the population median is between $1,410 and $1,495.','The bootstrap medians are centered near $1,450.'], a:[0,2,4],
  e:'A、C 是正确解读；B 混淆了中位数和个体；D 把参数当成随机的；E ✓ bootstrap 分布中心在原样本统计量附近。'},
 {l:'e', pts:3, k:'mc', t:['ci','hyptest'], q:'Last year the median rent was $1,500. Null: the median is still $1,500. Alternative: it has changed. What is the conclusion at the 5% cutoff?', c:['Reject the null, because $1,500 is not in the 95% confidence interval.','Fail to reject the null, because $1,500 is close to the interval.','Fail to reject, because the sample median is below $1,500.','We cannot use a confidence interval to test this.'], a:0,
  e:'双侧检验：零假设的值不在 95% 区间里 → 5% cutoff 下拒绝。'},
 {l:'f', pts:3, k:'mc', t:['normal','ci'], q:'Using the Central Limit Theorem, which is an approximate 95% confidence interval for the MEAN rent of all off-campus students?', c:['1520 ± 2 × 410/√500 ≈ ($1,483, $1,557)','1520 ± 2 × 410 = ($700, $2,340)','1450 ± 2 × 410/√500','1520 ± 410/500'], a:0,
  e:'样本均值的 SD ≈ 样本 SD / √n = 410/√500 ≈ 18.3。均值 ± 2 个这样的 SD。B 用的是个体的 SD，那是描述个体的范围。'},
 {l:'g', pts:3, k:'mc', t:['normal'], q:'Assuming the SD of rents is about $410, roughly how large a random sample is needed so that the 95% CI for the mean rent has total width at most $40?', c:['1,681','41','420','6,724'], a:0,
  e:'宽度 ≈ 4 × SD/√n ≤ 40 → √n ≥ 4 × 410 / 40 = 41 → n ≥ 1,681。'},
 ]},

{id:'cs-boba', k:'case', d:2, title:'Boba Wait Times', t:['center','normal'],
 bg:'A boba shop on Telegraph Avenue recorded the wait time, in minutes, for all 2,000 orders it took last month. The histogram of wait times is skewed to the right. The mean wait is 8 minutes, the SD is 3 minutes, and the median is 7 minutes.',
 bgzh:'Telegraph 上一家奶茶店记录了上月全部 2,000 单的等待时间（分钟），分布右偏。均值 8 分钟，标准差 3 分钟，中位数 7 分钟。',
 parts:[
 {l:'a', pts:2, k:'mc', t:['center'], q:'Which is the best explanation for why the mean is larger than the median?', c:['A small number of very long waits pull the mean up, while the median is not affected much by them.','Most orders take longer than the mean.','The SD is larger than the median.','The median is always smaller than the mean.'], a:0,
  e:'右偏长尾会把平均数往右拉；中位数对极端值不敏感。D 错：左偏时中位数大于均值。'},
 {l:'b', pts:3, k:'mc', t:['center'], q:'At LEAST what percent of orders had wait times between 2 and 14 minutes?', c:['75%','95%','88.9%','68%'], a:0,
  e:'2 和 14 是均值 ± 2 SD。分布不是正态 → 用 Chebyshev：至少 1 − 1/4 = 75%。'},
 {l:'c', pts:2, k:'tf', t:['normal','center'], q:'True or False: We can conclude that about 95% of orders had wait times between 2 and 14 minutes.', a:false,
  e:'False。95% 只适用于近似正态的分布。这里分布右偏，只能保证至少 75%。'},
 {l:'d', pts:3, k:'mc', t:['center'], q:'An order waited 15 minutes. About how many SDs above average is that?', c:['2.33','7','5','1.4'], a:0, e:'(15 − 8) / 3 ≈ 2.33。'},
 {l:'e', pts:3, k:'mc', t:['normal'], q:'The manager draws 36 orders at random with replacement and computes their mean wait. What is the SD of this sample mean?', c:['0.5 minutes','3 minutes','0.083 minutes','18 minutes'], a:0, e:'总体 SD / √n = 3 / 6 = 0.5。'},
 {l:'f', pts:3, k:'mc', t:['normal'], q:'Approximately what is the chance that the sample mean of 36 orders is MORE than 9 minutes?', c:['About 2.5%','About 16%','About 5%','About 37%'], a:0,
  e:'样本均值近似正态，中心 8、SD 0.5。9 分钟是 +2 SD，超过它的概率约 (100% − 95%) / 2 = 2.5%。'},
 {l:'g', pts:4, k:'short', t:['normal'], q:'Explain why it is reasonable to use the normal curve in part (f) even though individual wait times are skewed.',
  a:'By the Central Limit Theorem, the mean of a large random sample drawn with replacement has a roughly normal distribution regardless of the shape of the population. With n = 36, the sample mean is roughly normal, centered at 8 with SD 3/√36 = 0.5.',
  p:['引用 Central Limit Theorem','前提：大样本、随机有放回抽样','是“样本均值的分布”近似正态，与总体形状无关','中心 8，SD = 3/√36 = 0.5'],
  e:'个体右偏没关系，CLT 讲的是平均值。'},
 ]},

{id:'cs-study', k:'case', d:3, title:'Study Hours and Exam Scores', t:['correlation','regression','residuals','reginf'],
 bg:'A statistics instructor collects data on 120 students in an observational study. Weekly study hours have mean 10 and SD 4. Final exam scores (percent) have mean 70 and SD 12. The correlation between study hours and score is r = 0.6. The scatter plot looks roughly linear.',
 bgzh:'观察性研究：120 名学生每周学习时长（均值 10、SD 4）和期末成绩（均值 70、SD 12），相关系数 r = 0.6，散点图大致呈线性。',
 table:{cols:['hours','score'], rows:[['12','81'],['6','58'],['15','77'],['9','73'],['3','49']], more:115},
 cols:['hours (float): average weekly study hours','score (float): final exam score in percent'],
 parts:[
 {l:'a', pts:2, k:'mc', t:['regression'], q:'What is the slope of the regression line for predicting score from hours?', c:['1.8','0.2','0.6','3'], a:0, e:'slope = r × SDy / SDx = 0.6 × 12 / 4 = 1.8 percentage points per hour。'},
 {l:'b', pts:2, k:'mc', t:['regression'], q:'What is the intercept of the regression line?', c:['52','70','61.8','58'], a:0, e:'intercept = 70 − 1.8 × 10 = 52。'},
 {l:'c', pts:3, k:'mc', t:['regression'], q:'What is the predicted score for a student who studies 18 hours per week?', c:['84.4','94','82.4','76'], a:0,
  e:'18 小时在标准单位下是 (18 − 10)/4 = 2；预测 = 0.6 × 2 = 1.2 SD → 70 + 1.2 × 12 = 84.4。直接用直线 52 + 1.8 × 18 = 84.4，结果一样。B 忘了乘 r。'},
 {l:'d', pts:3, k:'mc', t:['residuals'], q:'What is the SD of the residuals?', c:['9.6','7.2','4.8','12'], a:0, e:'√(1 − 0.36) × 12 = 0.8 × 12 = 9.6。'},
 {l:'e', pts:2, k:'mc', t:['residuals'], q:'The residual plot fans out: residuals are spread more widely for students who study many hours. What does this mean?', c:['Predictions are less accurate for students who study many hours.','The relation is not linear, so r must be 0.','The regression line overestimates every heavy studier.','Nothing; residual plots never matter.'], a:0,
  e:'残差的离散程度随 x 变大 → heteroscedasticity，不同位置的预测准确度不同。'},
 {l:'f', pts:3, k:'mc', t:['reginf'], q:'A 95% bootstrap confidence interval for the slope of the true line is (1.2, 2.4). Null: the true slope is 0. What is the conclusion at the 5% cutoff?', c:['Reject the null; the data are not consistent with a true slope of 0.','Fail to reject the null.','The true slope is definitely 1.8.','The test cannot be done with a confidence interval.'], a:0,
  e:'0 不在区间内 → 拒绝“真实斜率为 0”。'},
 {l:'g', pts:3, k:'short', t:['causality','correlation'], q:'Does this analysis show that studying more CAUSES higher exam scores? Explain.',
  a:'No. This is an observational study: students chose how much to study. There may be confounding factors (for example prior math background or motivation) that affect both study hours and scores, so the association does not establish causation.',
  p:['结论：不能推出因果','原因：observational study，学生自己决定学习时长','举出可能的 confounder（基础、动机、时间等）'],
  e:'回归和显著的斜率只说明 association。'},
 {l:'h', pts:2, k:'tf', t:['correlation'], q:'True or False: If study time were measured in minutes instead of hours, the correlation coefficient would change.', a:false,
  e:'False。r 不受单位变化影响（线性变换后标准单位不变）。斜率会变，但 r 不变。'},
 ]},
);

addCase(
{id:'cs-plants', k:'case', d:3, title:'Tomato Blight Classifier', t:['classification','bayes'],
 bg:'The campus garden club wants to flag tomato plants with blight early. For 200 plants they recorded two features and whether a plant expert later confirmed blight. 60 of the 200 plants (30%) had blight. They plan to use k-nearest neighbors.',
 bgzh:'校园菜园俱乐部想提前识别番茄枯萎病。200 株植物记录了两个特征，以及专家后来确认的是否患病（30% 患病）。他们打算用 k-NN。',
 table:{cols:['leaf_spots','yellow_pct','blight'], rows:[['3','12.5','0'],['8','61.0','1'],['1','4.0','0'],['6','40.5','1'],['2','35.0','0']], more:195},
 cols:['leaf_spots (int): number of dark spots on the lowest leaf, from 0 to 10','yellow_pct (float): percent of leaf area that is yellow, from 0 to 100','blight (int): 1 if the plant had blight, 0 otherwise'],
 parts:[
 {l:'a', pts:3, k:'mc', q:'Why should the club convert both features to standard units before computing distances?', c:['yellow_pct ranges over much larger values than leaf_spots, so without standardizing it would dominate the distance.','Standard units make every distance an integer.','k-NN only works when all values are between 0 and 1.','Standardizing changes which plants have blight.'], a:0,
  e:'不同尺度的特征，大尺度的会主导欧氏距离。标准单位让两个特征的影响可比。'},
 {l:'b', pts:4, k:'code', q:'Complete the function that returns the Euclidean distance between two plants, given as arrays of their (standardized) feature values.', code:'def distance(p1, p2):\n    return [A]',
  blanks:[{l:'A', acc:['np.sqrt(np.sum((p1-p2)**2))','np.sqrt(sum((p1-p2)**2))']}], e:'差 → 平方 → 求和 → 开根号。'},
 {l:'c', pts:3, k:'code', q:"top_k is a table of the k nearest training plants (k is odd) with the column 'blight' (0 or 1). Fill in the blank so the prediction is 1 when most neighbors have blight and 0 otherwise.", code:'prediction = int([A])',
  blanks:[{l:'A', acc:["np.mean(top_k.column('blight'))>0.5","np.average(top_k.column('blight'))>0.5","np.count_nonzero(top_k.column('blight'))>k/2","sum(top_k.column('blight'))>k/2"]}],
  e:'标签是 0/1 时，平均值就是“患病邻居的比例”；超过 0.5 就说明多数是 1。int(True) = 1。'},
 {l:'d', pts:2, k:'mc', q:'A 1-nearest-neighbor classifier gets 100% accuracy when evaluated on the 200 training plants. What is the best interpretation?', c:['This is expected and says little about new plants: each training plant\'s nearest neighbor is itself. Accuracy should be measured on a separate test set.','The classifier will be 100% accurate on new plants.','The features perfectly separate blighted plants.','k = 1 is always the best choice.'], a:0,
  e:'在训练集上评估 1-NN，最近邻就是自己，准确率必然 100%，这是过拟合的典型情况。'},
 {l:'e', pts:2, k:'tf', q:'True or False: With k = 199, the classifier predicts "no blight" for every new plant, no matter its features.', a:true,
  e:'True。199 个邻居里最多 60 个患病，至少 139 个健康，多数票永远是 0。'},
 {l:'f', pts:3, k:'mc', t:['bayes'], q:'In the whole garden, 30% of plants have blight. A quick leaf test is positive for 80% of blighted plants and 10% of healthy plants. A plant tests positive. What is the chance it has blight?', c:['0.24 / (0.24 + 0.07) ≈ 0.77','0.8','0.3','0.24'], a:0,
  e:'患病且阳性 0.3 × 0.8 = 0.24；健康但阳性 0.7 × 0.1 = 0.07。后验 = 0.24 / 0.31 ≈ 0.77。'},
 {l:'g', pts:3, k:'mc', t:['bayes'], q:'In a different garden only 5% of plants have blight (same test). A plant tests positive. What does a "more likely than not" classifier predict?', c:['Healthy, because P(blight | positive) = 0.04 / 0.135 ≈ 0.30 < 0.5','Blight, because the test is positive','Blight, because 80% > 50%','Healthy, because 5% < 50%'], a:0,
  e:'0.05 × 0.8 = 0.04；0.95 × 0.1 = 0.095；后验 = 0.04 / 0.135 ≈ 0.30 < 0.5 → 预测健康。先验很小时，阳性也不一定代表更可能患病。D 的结论对但理由不完整（没用到证据）。'},
 ]},

{id:'cs-market', k:'case', d:2, title:'Farmers Market Vendors', t:['tables','groups','functions','viz'],
 bg:'The Saturday farmers market keeps two tables. vendors has one row per vendor, and each vendor has exactly one stall. sales has one row per stall per week for 12 weeks. Every stall in sales appears in vendors.',
 bgzh:'周六农贸市场有两张表：vendors 每个摊主一行（每人一个摊位号），sales 每个摊位每周一行，共 12 周。sales 里的摊位都能在 vendors 里找到。',

 parts:[
 {l:'a', pts:2, k:'mc', t:['groups'], q:"How many rows does vendors.join('stall', sales, 'stall') have?", c:['The same number of rows as sales','The same number of rows as vendors','vendors.num_rows × sales.num_rows','12'], a:0,
  e:'sales 的每一行都恰好匹配到一个 vendor，所以结果行数 = sales 的行数。'},
 {l:'b', pts:4, k:'code', t:['groups'], q:'Create a table with one row per category and the TOTAL revenue for that category over all 12 weeks.', code:"vendors.join([A]).select([B]).group([C])",
  blanks:[{l:'A', acc:["'stall',sales","'stall',sales,'stall'"]},{l:'B', acc:["'category','revenue'"]},{l:'C', acc:["'category',sum","'category',np.sum"]}],
  e:"先 join 把类别和收入放在一起；只留 category 和 revenue；按 category 分组求和。新列名是 'revenue sum'。"},
 {l:'c', pts:3, k:'code', t:['tables'], q:'Let totals be the table from part (b). Complete the expression for the category with the highest total revenue.', code:"totals.sort([A]).column('category').item(0)",
  blanks:[{l:'A', acc:["'revenue sum',descending=True"]}], e:"group 之后的列名是 'revenue sum'，降序排序后第一行就是最大的。"},
 {l:'d', pts:3, k:'mc', t:['viz'], q:'You want to show how the TOTAL weekly revenue of the whole market changed over the 12 weeks. Which is most appropriate?', c:["sales.select('week', 'revenue').group('week', sum).plot('week')","sales.hist('revenue')","sales.barh('stall')","sales.scatter('stall', 'revenue')"], a:0,
  e:'先按周求和得到每周总收入，再画随时间变化的 line plot。'},
 {l:'e', pts:4, k:'code', t:['functions'], q:"Complete the function that labels a week's revenue as 'high' if it is at least 500 dollars and 'low' otherwise.", code:"def label(r):\n    if [A]:\n        return 'high'\n    return [B]",

 {l:'f', pts:2, k:'code', t:['functions'], q:"Write an expression that evaluates to an array of labels, one for each row of sales.", code:'labels = [A]', blanks:[{l:'A', acc:["sales.apply(label,'revenue')"]}],

 {l:'g', pts:2, k:'tf', t:['tables'], q:"True or False: Running vendors.join('stall', sales, 'stall') changes the vendors table so that it now includes revenue.", a:false,

{id:'cs-ride', k:'case', d:3, title:'Rideshare Fares', t:['regression','residuals','classification'],
 bg:'An analyst studies 5,000 rideshare trips in the East Bay to predict the fare. She randomly splits the trips into a table train (4,000 rows) and a table test (1,000 rows). Both have the same columns.',
 bgzh:'分析 5,000 次东湾网约车行程来预测车费，随机分成 train（4,000 行）和 test（1,000 行）。',
 table:{cols:['miles','minutes','surge','fare'], rows:[['3.2','14','0','12.80'],['7.9','25','1','34.10'],['1.1','6','0','7.25'],['12.4','31','0','29.95']], more:3996},
 cols:['miles (float): trip distance','minutes (float): trip duration','surge (int): 1 if surge pricing was on, 0 otherwise','fare (float): fare in dollars'],
 parts:[
 {l:'a', pts:4, k:'code', t:['regression'], q:'Complete the function used to fit fare ≈ a·miles + b·minutes + c by least squares on the TRAINING set.', code:"def train_mse(a, b, c):\n    fitted = [A]\n    return [B]\n\nbest = minimize(train_mse)",

  e:'预测值 = a·miles + b·minutes + c；返回均方误差。minimize 会找到让它最小的 a, b, c。'},
 {l:'b', pts:3, k:'mc', t:['regression'], q:'What does minimize(train_mse) return?', c:['An array of the values of a, b, c that minimize the mean squared error on the training set','The smallest possible mean squared error','The fitted fares for the training set','The RMSE on the test set'], a:0,
  e:'minimize 返回的是“让函数最小的参数”，不是最小值本身。'},
 {l:'c', pts:3, k:'short', t:['regression'], q:'The fitted value of b is 0.42. Interpret b in one sentence.',
